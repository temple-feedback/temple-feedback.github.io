ly still with HR similar to the user's real sleep. Related concern raised: even if onset/offset are corrected, 'Eating' and 'Sleeping' should never coexist for the same time period — resolved automatically with accurate prediction, but note that within the circadian window if a person wakes, eats or does something and then sleeps again within 1–2 hours, we still consider it one sleep cycle and merge the awake activity into staging.","sensitive":"","notes":"user_id e73c2025 — not in mapping."},{"id":"SL-297","member":"—","group":"—","date":"22/07","source":"Slack","area":"Product Team","subcategory":"Insights & Coaching","classification":"Suggestion","text":"'Since I have set an 8K steps goal, my Amazfit notifies me when near it. Temple doesn't. Since I don't wear my watch, I don't know if I'm near my steps goal.' Nudge to complete daily step goal / notify when done.","answer":"Valid — step goals already exist; nudges to be built.","sensitive":"","notes":""},{"id":"SL-298","member":"Member","group":"Member","date":"22/07","source":"Slack","area":"Science Team","subcategory":"Entropy","classification":"Question","text":"Curious how Entropy responds to changes in inflammation, insulin sensitivity, lipid profile, and other blood markers.","answer":"","sensitive":"","notes":"Onboarding — the member 22/07, Users 1 & 2 (Eternal/Non-Eternal status not specified)."},{"id":"SL-299","member":"Member","group":"Member","date":"22/07","source":"Slack","area":"Science Team","subcategory":"Entropy","classification":"Suggestion","text":"Will experiment with fasting, fasted workouts, and yoga poses to observe correlation with Entropy and Brain Flow.","answer":"","sensitive":"","notes":"Onboarding — the member 22/07, Users 1 & 2."},{"id":"SL-300","member":"Member","group":"Member","date":"22/07","source":"Slack","area":"Product Team","subcategory":"Insights & Coaching","classification":"Positive","text":"Starting a longevity club soon; keen to onboard all members onto Temple.","answer":"","sensitive":"","notes":"Onboarding — the member 22/07, Users 1 & 2."},{"id":"SL-301","member":"Member","group":"Member","date":"22/07","source":"Slack","area":"Data Science","subcategory":"Auto Workout","classification":"Suggestion","text":"Auto activity detection is super important — user doesn't check their phone during workouts.","answer":"","sensitive":"","notes":"Onboarding — the member 22/07, User 3."},{"id":"SL-302","member":"Member","group":"Member","date":"22/07","source":"Slack","area":"Product Team","subcategory":"Insights & Coaching","classification":"Suggestion","text":"Wants Meals × Entropy analysis to understand the load of a meal on the body irrespective of whether it's logged; correlations between Entropy and breakfast/lunch/dinner based on meal times.","answer":"","sensitive":"","notes":"Onboarding — the member 22/07, User 3."},{"id":"SL-303","member":"Member","group":"Member","date":"25/07","source":"Slack","area":"Data Science","subcategory":"Auto Workout","classification":"Problem","text":"'I did my workout around 7-8, recorded it too, but not showing now in app.'","answer":"Auto-detected workout was continued from the aerobar at 7:11 PM and tracked till 8:04 PM. At 8:04:02 PM a manual 'discard' event was received instead of 'end & save', which is why the activity isn't visible.","sensitive":"","notes":"user_id 577f70ba — not in mapping."},{"id":"SL-304","member":"Member","group":"Member","date":"26/07","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Problem","text":"Incorrect sleep onset detected.","answer":"Detected significant steps until 1:05 AM and sustained blinks until 1:35 AM with HR elevated to 125 at 1:10 AM, coming down after 1:30. Even with the new algorithm the onset would be 1:50 AM.","sensitive":"","notes":""},{"id":"SL-305","member":"Member","group":"Member","date":"09/07","source":"Slack","area":"Data Science","subcategory":"Calorie Tracking","classification":"Problem","text":"Logged the same meal three times within 20 minutes on 9 July. Macros stored in the DB were correct each time, but the insight text generated for each entry mentions different macros and calories.","answer":"The user was adding items to the same meal (protein shake added multiple times after creating it), triggering Sense three times. Bitter gourd and roti were added subsequently — user was likely experimenting since this was one of the first meals. CSV feeding the observability review to be updated so only the final prompt is surfaced.","sensitive":"","notes":"Observed during OB insights review."},{"id":"SL-306","member":"Member","group":"Member","date":"27/07","source":"Slack","area":"Data Science","subcategory":"Accuracy","classification":"Problem","text":"'Morning swim had durations of missing record. Heart rate just flattening to last known value it seems.' Whoop comparison shared.","answer":"Activity was added retrospectively; duty cycling caused flat HR values. Activity mode is only started for 5–10 min when we detect a workout, and if the customer takes no action on the notification we return to duty cycle. In this case a non-duty-cycle window did exist near the peak but we returned to duty cycling after that.","sensitive":"","notes":"user_id 1f0302b6 — not in mapping."},{"id":"SL-307","member":"Member","group":"Member","date":"27/07","source":"Slack","area":"Data Science","subcategory":"Calorie Tracking","classification":"Problem","text":"Difference in calories between Temple and reference source for the same activity.","answer":"Activity was done in duty-cycling mode — less granularity of HR and Entropy, both used to estimate calories.","sensitive":"","notes":""},{"id":"SL-308","member":"—","group":"—","date":"27/07","source":"Slack","area":"Data Science","subcategory":"Auto Workout","classification":"Suggestion","text":"Discussion — should we bring back auto activity detection given improved battery life? Customers are not clicking on the prompt to start an activity; when they retrospectively add an activity, metrics are off; onboarding customers ask for auto detection as a feature.","answer":"the member to discuss further.","sensitive":"","notes":"Internal observation via the member."},{"id":"SL-309","member":"Member","group":"Member","date":"28/07","source":"Slack","area":"Product Team","subcategory":"Insights & Coaching","classification":"Problem","text":"'Almost every day my heart rate reaches Zones 2 to 4, yet I'm still seeing this message.' User keeps seeing a message despite crossing HR zones on most days.","answer":"Messaging is confusing — it doesn't say only logged activity data will be visible here.","sensitive":"","notes":"user_id a456e370 — not in mapping."},{"id":"SL-310","member":"Member","group":"Member","date":"28/07","source":"Slack","area":"Data Science","subcategory":"Chewing Detection","classification":"Problem","text":"'Suddenly app is detecting talking as chewing today.'","answer":"Personalisation algorithm gradually becomes more permissive over time to minimise missed detections while avoiding false positives. This user had no history of false detections so the algorithm had adapted to a permissive state; today's two false detections will be learned from and similar false detections suppressed going forward, effective tomorrow.","sensitive":"","notes":""},{"id":"SL-311","member":"Member","group":"Member","date":"28/07","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Problem","text":"Two Temples worn simultaneously (one on each side, second device owned by the member) showed a ~30-minute difference in total sleep for the same night (27 July). User's device: 5h28m; the member device: 4h59m.","answer":"When wearing devices on both sides, one may be pressed against the body while the other is not, introducing motion on one side that produces small timing differences. Onset diff was 19 min, offset diff was 4 min; an awake period was identified on one device that rejected a sleep window kept on the other, hence the ~30 min gap. New algorithm — already live for a subset of users — aligns onset/offset across both devices for the same person even when underlying data differs by side.","sensitive":"","notes":"Companion device id 1ab9038a (the member) — internal."},{"id":"SL-312","member":"Member","group":"Member","date":"28/07","source":"Slack","area":"Product Team","subcategory":"Insights & Coaching","classification":"Problem","text":"Sense bot didn't pick up live step count for the user (as of 3:28 PM).","answer":"","sensitive":"","notes":"user_id 30c85b16 — not in mapping."},{"id":"SL-313","member":"Member","group":"Member","date":"28/07","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Problem","text":"Missed detecting a nap for a newly onboarded customer, 6:15–6:55 PM. HR and Entropy don't obviously indicate a restful state.","answer":"Very little accelerometer movement across the window but HR varied significantly (69 → 86 bpm). Current algorithm didn't identify a nap window. New algorithm — being rolled out gradually — identifies a nap 18:05–18:52 (offset conservative under current rules, tweaks planned). Live for ~150 internal users so far; will scale after internal validation.","sensitive":"","notes":"user_id cc4e4bac — not in mapping."},{"id":"SL-314","member":"Member","group":"Member","date":"28/07","source":"Slack","area":"Tech","subcategory":"Notifications","classification":"Problem","text":"Incorrect time shown in the push notification for meal items analysed at dinner.","answer":"Issue identified; fix released. Root cause investigation in progress.","sensitive":"","notes":""},{"id":"SL-315","member":"Member","group":"Member","date":"28/07","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Problem","text":"Inconsistency: BioMonitor overview shows Brain Flow at 'Top 25%' but the detailed page shows 'Top 1%' for the same value.","answer":"The value lies exactly on the zone boundary. BioMonitor uses an exclusive boundary check; other screens use inclusive. Fix in an upcoming release.","sensitive":"","notes":""},{"id":"SL-316","member":"—","group":"—","date":"29/07","source":"Slack","area":"Product Team","subcategory":"Insights & Coaching","classification":"Problem","text":"Morning Outlooks not generating on time — the member got generated ~30 min after waking; similar reports for a few other users.","answer":"Overall generation metric shows no systemic issue; investigating the delayed cases specifically.","sensitive":"","notes":""},{"id":"SL-317","member":"Member","group":"Member","date":"29/07","source":"Slack","area":"Tech","subcategory":"App Crashes","classification":"Problem","text":"Latest app crashed twice while doing morning sync.","answer":"Two separate crashes for this user at 7:13 and 7:14 AM. First: threading-related while retrieving L1 metrics from the app's DB (low frequency — 5 times in last 30 days, once in last 7 days); OS stack traces insufficient to pinpoint the thread; probable fix being sent EOD. Second: a third-party SDK crash for silent OTA updates — low frequency; investigating a workaround. Not a widespread issue.","sensitive":"","notes":""},{"id":"SL-318","member":"Member","group":"Member","date":"29/07","source":"Slack","area":"Tech","subcategory":"App Crashes","classification":"Problem","text":"App crash while uploading a picture of a meal; another crash while the app was in split-screen mode. Android device.","answer":"Team actively investigating; awaiting confirmation on whether crashing is continuous for this user.","sensitive":"","notes":"user_id fe224020 — not in mapping."},{"id":"SL-319","member":"Member","group":"Member","date":"29/07, 04/08","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Problem","text":"Sleep onset/offset incorrect. Detected sleep from 2:50 AM to 5:50 AM; user manually edited to Whoop timings 11:48 PM–7:41 AM.","answer":"Blink algorithm misfired at the start of the session, generating a large number of false blink events; initial sleep windows were rejected despite very little movement and stable HR. Offset auto-corrected from 05:50 → 07:43 as additional data flowed in during sync. New algorithm (in testing, already rolled out to a larger group of internal users) aligns detected timings more closely with real sleep and will handle cases like this much better.\n\n[Update 04/08]: Recurring failure — current algorithm is misfiring the micro-motion algorithm. New algorithm (shipped 04/08 to everyone) reduces this dependency and detects sleep 12:41 AM–8:06 AM with significant awake motion 8:06–8:31 AM. Raw sensor data collection enabled for this user to root-cause the micro-motion misfires.","sensitive":"","notes":"user_id fa9df9f1 — not in mapping."},{"id":"SL-320","member":"—","group":"—","date":"31/07","source":"Slack","area":"Product Team","subcategory":"Insights & Coaching","classification":"Positive","text":"'Great update — was missing a clearer view of my daily recovery.'","answer":"","sensitive":"","notes":""},{"id":"SL-321","member":"Member","group":"Member","date":"31/07","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Problem","text":"Customer was awake from 1:15–4am; Temple didn't detect the awake window during the sleep session.","answer":"Current staging model cannot capture the wake using the signals it was initially trained on. A new signal in development captures this awake duration; internal release timeline being worked out this week.","sensitive":"","notes":""},{"id":"SL-322","member":"Member","group":"Member","date":"01/08","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Problem","text":"'All time high not updated. Today's high is higher than the all-time high.'","answer":"Root cause: when a user hits a personal best, today's best is replaced immediately but the all-time max is rendered by the backend, which happens later. Fix in progress — all places that show max and all-time best will be replaced immediately when a user hits their personal best. Will be updated in the next release.","sensitive":"","notes":""},{"id":"SL-323","member":"Member","group":"Member","date":"02/08","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Problem","text":"'Yesterday I slept for 2 hrs from 1pm to 3pm. This was not captured by Temple. During this time my Entropy went to 20 as well, heartbeat also went to 55 indicating I was asleep.'","answer":"Investigated — a nap was actually detected 12:10 PM to 2:30 PM. Customer confirmed they found the nap on their feed afterwards.","sensitive":"","notes":"user_id 88069c54 — not in mapping."},{"id":"SL-324","member":"Member","group":"Member","date":"02/08","source":"Slack","area":"Data Science","subcategory":"Accuracy","classification":"Problem","text":"Steps under-reported vs Apple Watch.","answer":"No raw data available for this customer to check directly. Other L1s (primary cadence, steps published) suggest possible undercounting (not a 100% confirm signal). Also validating on users where raw data is available so there's no gap in steps computation. Note: Apple Watch also overcounts with hand gestures (e.g. talking).","sensitive":"","notes":"user_id 9f05de09 — not in mapping."},{"id":"SL-325","member":"Member","group":"Member","date":"02/08","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Problem","text":"Retry button didn't work when logging food images.","answer":"Team investigating.","sensitive":"","notes":"user_id 9f05de09 — not in mapping."},{"id":"SL-326","member":"Member","group":"Member","date":"03/08","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Problem","text":"'Temple caught my nap today. But it's incorrect. I was on WhatsApp chatting with people up until 12:55 pm! It's picked up the time (1 pm) as deep sleep and that's precisely when I'd gotten into nap state.'","answer":"Very low movement starting from 12:14 pm combined with a declining HR (usually seen in naps/sleeps) caused a false detection for the nap onset. The new algorithm, which takes other signals into account, differentiates stillness from sleep and gives the nap from 1:07 pm to 1:48 pm. New algorithm is currently live for 150 internal users; will be rolled out to everyone by end of week after further pipeline improvements.","sensitive":"","notes":"user_id 9f05de09 — not in mapping. Same failure mode also seen internally: (1) 28/07 nap 10:19–11:18 in current algo, new algo detects 10:18–11:31; (2) 02/08 window 11:10–13:10 detected in current algo but not in new algo — internal user confirmed this was likely correct (wasn't napping, at most ~10 min in the middle)."},{"id":"SL-327","member":"Member","group":"Member","date":"03/08","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Question","text":"'Not getting option to add more activities.' Is there a limit to the max number of new custom activities a user can add?","answer":"Team asked for clarification on whether user was trying to start Activity Mode or add custom activities; awaiting user detail.","sensitive":"","notes":"user_id b7c051e5 — not in mapping."},{"id":"SL-328","member":"Member","group":"Member","date":"04/08","source":"Slack","area":"Tech","subcategory":"Sync & Data","classification":"Problem","text":"Gaps in the user's live Brain Flow, Entropy, and HR readings during their workout — post-workout summary shows the data correctly.","answer":"Root cause: firmware upgrade triggered during the countdown screen created a race condition — app doesn't allow FW upgrade during workout, but the check fired at 09:09:59 and workout countdown began at 09:10:01, activity mode at 09:10:03, reboot at 09:10:09. Since FW rebooted, device came back in normal mode instead of workout mode. Fix released in iOS v1.1.0 (1244).","sensitive":"","notes":"user_id bf7e5b2e — not in mapping."},{"id":"SL-329","member":"Member","group":"Member","date":"06/08","source":"Slack","area":"Tech","subcategory":"Sync & Data","classification":"Problem","text":"'Major lag in data showing up when I open the app. I woke up around 6:00 AM (Dubai time), but sleep data isn't there. Opened the app to check ~5+ minutes ago but it's still syncing.'","answer":"Edge case from battery optimisation: background sync was changed to run at 3-hour intervals. If a user opens the app and only a partial backlog is synced before closing, the device stops the sync and waits for the next 3-hour tick or the next app open. Fix releasing in next FW today + adding alerting to catch proactively. (Usually 3-hour backlog syncs within 10 seconds in a single app-open session.)","sensitive":"","notes":""},{"id":"SL-330","member":"Member","group":"Member","date":"07/08","source":"Slack","area":"Hardware/Firmware","subcategory":"Battery","classification":"Question","text":"Member reported the device takes about 2 to 2.5 hours to charge — asked us to check.","answer":"Analysed last three charging cycles: (1) 1h 5m from 16→97%, (2) 1h 10m from 25→100%, (3) 20m from 16→44%. All within normal battery behaviour. Awaiting confirmation from the member on the perception of 2–2.5 hours.","sensitive":"","notes":"user_id 082966ca — not in mapping."},{"id":"SL-331","member":"Member","group":"Member","date":"05/08","source":"Slack","area":"Product Team","subcategory":"Insights & Coaching","classification":"Question","text":"'Started tracking activity at 9:15; device went off body at 10:22 but activity kept registering till 10:41 and only paused when I manually stopped it in the app.' Expected auto-pause when device goes off body.","answer":"By design: activity is not auto-paused when device goes off body — the current UX call was to keep activity mode running to avoid the confusing case where time-elapsed goes backwards when the device reconnects. Validated against Garmin/Apple/Whoop — they behave the same way (activity continues if wearable is removed). Physiological data isn't recorded during off-body; GPS-based data (e.g. future distance tracking) doesn't need on-body contact.","sensitive":"","notes":"user_id a456e370 — not in mapping."},{"id":"SL-332","member":"Member","group":"Member","date":"06/08","source":"Slack","area":"Tech","subcategory":"Sync & Data","classification":"Problem","text":"Yesterday the longevity score widget said 'unlocks in 1 day'; after updating the app today it says '31 days'.","answer":"Tech migration at 10:17 AM moved longevity score to a centralised source; deployment mistakenly set the unlock window to 60 days instead of 30, which flipped the countdown. Rolled back at 10:51 AM.","sensitive":"","notes":""},{"id":"SL-333","member":"Member","group":"Member","date":"07/08","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Problem","text":"'If I am adding activity as a nap the image should be of nap. Not running.' On the home page all activities show a running icon; activity page has different icons but Nap also shows a running icon.","answer":"Two fixes in progress: (1) surface Nap and Sleep as first-class activity categories to log, (2) show respective activity icons on timeline notches. Also evaluating a non-running-looking generic icon for custom activities. Separately: improve nap surfacing latency — currently a nap is only surfaced 30 min after it ends to avoid the same nap being split, which creates confusion when users log it manually.","sensitive":"","notes":""},{"id":"SL-334","member":"Non-Eternal (onboarding)","group":"Non-Eternal (onboarding)","date":"07/08","source":"Slack","area":"Product Team","subcategory":"Women's Health","classification":"Suggestion","text":"Wants Auto-Period tracking — tracking cycle phases through physiological signals without having to log manually.","answer":"","sensitive":"","notes":"From an onboarding session."},{"id":"SL-335","member":"Non-Eternal (onboarding)","group":"Non-Eternal (onboarding)","date":"07/08","source":"Slack","area":"Product Team","subcategory":"App & Home Experience","classification":"Suggestion","text":"Wants sets/weight logging during workouts.","answer":"","sensitive":"","notes":"From an onboarding session."},{"id":"SL-336","member":"Non-Eternal (onboarding)","group":"Non-Eternal (onboarding)","date":"07/08","source":"Slack","area":"Science Team","subcategory":"Others","classification":"Suggestion","text":"Referenced wearclair.com — a startup building a continuous non-invasive hormone monitoring wearable (estrogen, progesterone, LH, FSH, PdG). Suggested we draw insights from their approach.","answer":"","sensitive":"","notes":"From an onboarding session."},{"id":"SL-337","member":"Non-Eternal (onboarding)","group":"Non-Eternal (onboarding)","date":"07/08","source":"Slack","area":"Product Team","subcategory":"Insights & Coaching","classification":"Suggestion","text":"Wants proactive notifications when metrics show aberrations, e.g. 'Your resting Entropy is much higher than your L30D average, take a breather.'","answer":"","sensitive":"","notes":"From an onboarding session."},{"id":"SL-338","member":"Member","group":"Member","date":"07/08","source":"Slack","area":"Product Team","subcategory":"App & Home Experience","classification":"Suggestion","text":"Wants an intuitive button on the Entropy summary page that jumps to the FAQs / Sense at the bottom — extra scrolling creates fatigue and disengagement before users reach key information.","answer":"Section is intended to help users learn habits that train Entropy Max / Resting Entropy. Agreed usage may be low. WIP on more personalised Now-card call-outs about Entropy based on user data — combined with Sense on all pages, this should improve learning about Entropy / Longevity.","sensitive":"","notes":"user_id f65c4c19 — not in mapping."},{"id":"SL-339","member":"Member","group":"Member","date":"07/08","source":"Slack","area":"Hardware/Firmware","subcategory":"Battery","classification":"Problem","text":"Firmware updates are taking noticeably longer than before; live metrics also take significantly longer to appear after opening the app.","answer":"Improvements made in FW v184 (live for internal users); FW v186 whitelisted to customers today, auto-rollout within 8 hours will bring live-metric time considerably down. User is currently on FW v181.","sensitive":"","notes":""},{"id":"SL-340","member":"Member","group":"Member","date":"07/08","source":"Slack","area":"Science Team","subcategory":"Entropy","classification":"Problem","text":"Entropy Max doesn't adequately reward heavy strength training sessions compared to cardio workouts. This is the primary reason the user continues to wear Whoop.","answer":"","sensitive":"","notes":""},{"id":"SL-341","member":"Member","group":"Member","date":"07/08","source":"Slack","area":"Data Science","subcategory":"Auto Workout","classification":"Problem","text":"Activities are not being auto-detected. Whoop auto-recognises workouts, so this is a noticeable gap.","answer":"Auto-detection re-enabled internally with improved UI, currently in shadow. Will be released to customers in the upcoming release.","sensitive":"","notes":""},{"id":"SL-342","member":"Member","group":"Member","date":"07/08","source":"Slack","area":"Adhesion","subcategory":"Tapes","classification":"Problem","text":"Found the recommended Temple placement uncomfortable — glasses press against the device — and has had to find an alternative wearing position.","answer":"","sensitive":"","notes":""},{"id":"SL-343","member":"Member","group":"Member","date":"07/08","source":"Slack","area":"Tech","subcategory":"App Crashes","classification":"Problem","text":"Two related bugs: (1) after logging and saving an activity, the 'Add activity' button is unresponsive — user has to force-kill the app before logging a new activity; (2) at times the app freezes on the home page and navigation buttons don't respond.","answer":"Both symptoms are the same issue — app is freezing sometimes and users can't navigate beyond the home page. Not tied to a specific device model or OS version (another internal user hit it on a different version). Not reproducible on demand; investigation in progress.","sensitive":"","notes":"user_id dc7421d8 — not in mapping."},{"id":"SL-344","member":"Member","group":"Member","date":"12/08","source":"Slack","area":"Hardware/Firmware","subcategory":"Heating","classification":"Problem","text":"'Yesterday evening, when I touched the temple, it felt slightly warm — similar to how a phone sometimes gets warm while charging. It wasn't nearly as hot as a phone, but it was noticeably warm. I took it off immediately, and it cooled down within 10–15 seconds. I'm not sure what caused it, and this has never happened before.'","answer":"Firmware temperature logs show no temperature rise above 35°C in the last 3 days; max recorded during charging was 29°C.","sensitive":"TRUE","notes":""},{"id":"SL-345","member":"Member","group":"Member","date":"09/08","source":"Slack","area":"Data Science","subcategory":"Accuracy","classification":"Problem","text":"Wearing Whoop alongside Temple; step counts have come in under-tracked on Temple for both days (most of 8 Aug steps were outdoors). Asked whether certain kinds of movement tend to get over/under-tracked.","answer":"No true labelled data available. Evaluating a couple of improvements in the steps algorithm; results in 2–4 days.","sensitive":"","notes":"user_id 5072fee1 — not in mapping."},{"id":"SL-346","member":"Member","group":"Member","date":"10/08","source":"Slack","area":"Science Team","subcategory":"Entropy","classification":"Problem","text":"Switched Temple from left side to right side for the first time (5–9 Aug); resting Entropy was quite high during that period. Monthly trend read >75 only on days she wore it on the right side. Reported later that it went back to normal after switching back to the left side. Tried inversion, sketching, cold shower — none of which brought Entropy Min down as they usually would.","answer":"Team analysis: user switched sides on 3 Aug (left to right); values on both sides were comparable before and after — the switch doesn't appear to be a strong factor. High resting Entropy values look physiological — recovery scores show a declining pattern 5–9 Aug that aligns with elevated Entropy (lowest recovery on 6 Aug matched highest resting Entropy that day). Wear-time and per-day data shared for further investigation.","sensitive":"","notes":""},{"id":"SL-347","member":"Member","group":"Member","date":"10/08","source":"Slack","area":"Hardware/Firmware","subcategory":"Battery","classification":"Problem","text":"Battery has been draining unusually fast over the last two days.","answer":"Analysis shows 69% discharge over the last 5 days (100→31%) = 0.58%/hour average, and 30% over the last 50 hours (56→26%) = 0.6%/hour. Expected rate after raw data collection was turned on for everyone via configs.","sensitive":"","notes":"user_id ee740249 — not in mapping."},{"id":"SL-348","member":"Member","group":"Member","date":"12/08","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Problem","text":"Slept 8 hours (captured on Whoop). Temple only showed 49 min in the night and 51 min in the morning — the time in between was missed. Same again the next night; not capturing full night sleep.","answer":"L1 data is missing for the said duration (no data 2:34–6:30 AM in the second instance). Root-cause fix being pushed to all users.","sensitive":"","notes":""},{"id":"SL-349","member":"Member","group":"Member","date":"12/08","source":"Slack","area":"Product Team","subcategory":"Nutrition & Logging","classification":"Question","text":"Are there plans to have something built for logging daily water intake?","answer":"","sensitive":"","notes":""},{"id":"SL-350","member":"Member","group":"Member","date":"12/08","source":"Slack","area":"Tech","subcategory":"Sync & Data","classification":"Problem","text":"Recurring connectivity issues, frequency has increased recently. Whenever the user opens the app, timestamps consistently show '17m ago', '44m ago', '22m ago', etc.","answer":"Improvements in progress from both firmware and app sides — will be improved in future releases.","sensitive":"","notes":""},{"id":"SL-351","member":"Member","group":"Member","date":"12/08","source":"Slack","area":"Product Team","subcategory":"Insights & Coaching","classification":"Question","text":"User query about the latest state of Focus.","answer":"Focus and Cognitive Work have been removed from the app for good.","sensitive":"","notes":""},{"id":"SL-352","member":"Member","group":"Member","date":"12/08","source":"Slack","area":"Data Science","subcategory":"Accuracy","classification":"Problem","text":"Showing 2,860 steps for the day while the user's watch reported 8,500. Also for the prior day: Temple reported 3,320 vs Whoop's 6,700+ (Temple estimate could realistically be ~5.7k considering high-accel periods; Whoop appears to be overcounting).","answer":"On-body/off-body pattern for this customer looks unusual and is likely the cause of missing steps. Investigation shows we missed ~1,700 steps over ~22 min on 12 Aug (8:47–9:09 AM). Multiple HW off-body events, first at 8:47; entered calibration multiple times (8:58, 9:03) but signal quality was too poor to transition to on-body until 9:08. accel_std was high before and after this window and on other days at similar times — likely running that we missed.","sensitive":"","notes":"user_id 4e2c4879 — not in mapping."},{"id":"SL-353","member":"Member","group":"Member","date":"13/08","source":"Slack","area":"Tech","subcategory":"Sync & Data","classification":"Problem","text":"'CNLS not connected' message appearing repeatedly. Killing the app fixed it the first time but not the second. Device eventually connected then disconnected again.","answer":"Device found stuck in boot; team investigating recovery.","sensitive":"","notes":"user_id 4e2c4879 — not in mapping."},{"id":"SL-354","member":"Member","group":"Member","date":"13/08","source":"Slack","area":"Data Science","subcategory":"Auto Workout","classification":"Problem","text":"Did strength training in the morning; Temple didn't pick it up as a workout. Instead, sent an alert asking if the user had eaten anything — user had to manually log the workout.","answer":"For paid customers, still on the earlier auto-workout notification flow; auto-detection with new designs is releasing today (already live for temple.com internal users), and will start the workout from 8:08 AM for this customer once live. The chewing-detection alert was a false positive at ~8:37 AM (retracted within 5 min if not acted on); addressed via the personalisation algorithm and similar wrong chewing detections will be suppressed going forward. Activity auto-detection now live for customers in iOS app v1.1.0 (1264) and above; Android to follow.","sensitive":"","notes":"user_id cc4e4bac — not in mapping."},{"id":"SL-355","member":"Member","group":"Member","date":"13/08","source":"Slack","area":"Data Science","subcategory":"Calorie Tracking","classification":"Problem","text":"Half a plate of cooked poha should translate to ~180g. Also got the macros wrong (protein, carbs). Attached comparison from web search, Claude, and Inch.","answer":"Poha macros in catalog were slightly inflated — cause of the discrepancy. Iterating to find and fix other similar items. Portion-size calibration also being checked in parallel.","sensitive":"","notes":"user_id 9f05de09 — not in mapping."},{"id":"SL-357","member":"Member","group":"Member","date":"13/08","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Problem","text":"Woke up 7:53–7:55 AM, checked Temple app immediately — showed sleep <7 hours. Reopened later and duration had updated to 7h4m with offset time updated to 7:56 AM. Feels like the last few minutes of light sleep are over-counted.","answer":"When the app was opened at 7:58, offset was conservatively predicted at 7:43 with a Light block between 7:41 and 7:43. Algorithm self-corrected with more context to 7:55:40 (rounded to 7:56) at the next event; staging showed Light 7:46–7:56. Testing a new signal (live for a few users) that persists the wake window through to the end.","sensitive":"","notes":"user_id f89a2ec9 — not in mapping."},{"id":"SL-358","member":"Member","group":"Member","date":"13/08","source":"Slack","area":"Data Science","subcategory":"Auto Workout","classification":"Problem","text":"Activity Mode misbehaved during an HIIT session: (1) 10-min delay in detecting the activity vs Apple Watch (customer manually activated on the watch), (2) activity was turned off in the middle of the run.","answer":"Not the expected behaviour. Looks like the FW-side notification flow was running for this customer, which turns off the duty cycle after 8–10 min and sends the notification. Our algorithms usually handle running workouts/HIITs well. Workout ended from state 2 directly, which isn't expected. FW version was 193 at the time (now 195). Investigating; also re-checking the auto-workout config now that it's live for all customers.","sensitive":"","notes":""},{"id":"SL-359","member":"Member","group":"Member","date":"20/08","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Problem","text":"'I slept around 6 hours last night. But Temple only picked up 1hr and 10mins because the rest of the time I sat on the armchair and slept. If sleep time is an input into Entropy and longevity then this apparent lack of sleep may be messing my other metrics too.'","answer":"Too much motion during the whole duration; HR increasing continuously from 12 AM. HR calcs are correct. Very periodic motion in raw accel data every 15–30 sec throughout the night — plausibly a rocker recliner chair with vibration. Working on the low-confidence-sleep path to clean up periodic-motion / broadband noise from armchair movement.","sensitive":"","notes":""},{"id":"SL-360","member":"—","group":"—","date":"20/08","source":"Slack","area":"Product Team","subcategory":"App & Home Experience","classification":"Suggestion","text":"'The eating activity is not relevant for me but it takes the space on homepage. Can we keep it in sync with the eating notification toggle and not show these if toggled off?' There's a per-card delete option but not a global option; nutrition tab already shows these under 'Today's Meals'.","answer":"","sensitive":"","notes":""},{"id":"SL-361","member":"Member","group":"Member","date":"20/08","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Problem","text":"Customer not able to discard auto-detected eating logs.","answer":"Fix released in app v1.1.0 (1288). Customer initially still facing the issue — turned out they were on an older app version. After updating to 1288 the issue is fixed.","sensitive":"","notes":""},{"id":"SL-362","member":"Member","group":"Member","date":"21/08","source":"Slack","area":"Product Team","subcategory":"App & Home Experience","classification":"Suggestion","text":"'We need to rethink the weight trends page. Also should celebrate some milestones on the homepage timeline, whenever a new weight is logged.'","answer":"3-month view will be picked up next week. Celebrations to be triggered based on total weight lost over X weeks for users with BMI > 25.","sensitive":"","notes":""},{"id":"SL-363","member":"Member","group":"Member","date":"21/08","source":"Slack","area":"Data Science","subcategory":"Calorie Tracking","classification":"Problem","text":"'My readings for the pilates session seem off. Calorie burn as well as Entropy captured seem off.'","answer":"Session wasn't started live (logged retroactively at 21:40) and auto-detection didn't fire, so the device stayed on its 5-min duty cycle. Recorded avg HR was low (92 vs usual 132). Combined with very low motion + duty cycling, we couldn't detect the window as active — 11 active kcal vs the usual ~203. SNR was low (mean −1.34, median −1.0) and the spectral distribution was scattered/bimodal most of the time (likely due to motion). Need to figure out how to capture these low-intensity workouts.","sensitive":"","notes":""},{"id":"SL-364","member":"Member","group":"Member","date":"21/08","source":"Slack","area":"Hardware/Firmware","subcategory":"Battery","classification":"Problem","text":"'Been facing this disconnect issue since morning. Device is charged but unable to connect. Put it on charging once, after which it worked for a while, but got disconnected shortly after.'","answer":"Device went into ship mode (safety cut-off triggered by unusually fast battery drain). Putting on charger wakes it up temporarily — hence the intermittent behaviour. Discharge higher than usual. Device recalled for RCA and replacement.","sensitive":"TRUE","notes":""},{"id":"SL-365","member":"Member","group":"Member","date":"21/08","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Problem","text":"User reported he did not wear the Temple device on 14 Aug, but a sleep report was still generated. He later added that he hadn't worn it for 3–4 days.","answer":"Device was actually worn on the night of 13th (sleep 12:40 AM–7:34 AM on 14th), removed at 10:24 AM on 14th. No sleep detected for the night of 14th. Signal quality and SNR were good throughout the said night; avg accel z pattern matches sleep; raw PPG waveform clearly shows the pulse — on-body detection looks correct.","sensitive":"","notes":""},{"id":"SL-366","member":"Member","group":"Member","date":"21/08","source":"Slack","area":"Data Science","subcategory":"Chewing Detection","classification":"Problem","text":"Chewing detection has been consistently off — slight jaw movement around 6 AM on 18 Aug triggered a chewing notification, while eating boiled chana around 10 AM on 18 Aug gave no notification.","answer":"Chewing was actually detected at 09:54 AM and confirmed by the user — investigating the notification delay. For the 6 AM false detection: we couldn't suppress it via personalisation because doing so would also suppress 9 historical confirms that were similar short bouts of chewing barely crossing current loose thresholds. Tightening any threshold to address this dismiss could also miss similar valid detections in the future.","sensitive":"","notes":""},{"id":"SL-367","member":"Member","group":"Member","date":"21/08","source":"Slack","area":"Tech","subcategory":"Sync & Data","classification":"Problem","text":"Every time the user opens the app, it isn't syncing live (shows last synced 20/30 minutes ago) and the Entropy gauge stays grey for a while before going live.","answer":"Time-to-live-state was unusually high for this customer in one case. Optimisations released to bring time-to-live under 3 seconds of app open. Customer asked to update to app v1.1.0 (1294).","sensitive":"","notes":"user_id bf9174dd — not in mapping."},{"id":"SL-368","member":"Member","group":"Member","date":"22/08","source":"Slack","area":"Hardware/Firmware","subcategory":"Battery","classification":"Problem","text":"Device not connecting to app, PPG sensor not firing. On charger SOC shows 73%, rapidly increases to 83%. On removing from charger, SOC drops to 68%. Device disconnects and PPG stops firing 2–3 min after taking off the charger.","answer":"Yesterday 22:27 the device entered ship mode with a ~7°C temperature rise (points to possible short). Today 14:23 user put it on charge — device exited ship mode and reconnected via BLE. On removing charger, died again — no connection, no PPG LEDs. Only stays alive on charger power. Needs physical RCA on the bench. Device recall requested.","sensitive":"TRUE","notes":""},{"id":"SL-369","member":"—","group":"—","date":"22/08","source":"Slack","area":"Product Team","subcategory":"App & Home Experience","classification":"Suggestion","text":"Can we call out messaging on the app to manage expectations better? User may not be seeing the recovery-widget banner on the home page.","answer":"Banner exists on the home page recovery widgets — asking the user to share a screenshot to confirm if they're seeing it.","sensitive":"","notes":""},{"id":"SL-370","member":"Member","group":"Member","date":"22/08","source":"Slack","area":"Data Science","subcategory":"Chewing Detection","classification":"Problem","text":"'Today, twice I got a notification of Eating detected when I was not eating anything.'","answer":"No dismiss feedback received from this user for wrong detections so far — thresholds have remained in a more permissive state to improve recall while maintaining precision. Asked the user to dismiss wrong detections so the personalisation algorithm can adapt. Also exploring how to improve this without requiring per-user feedback.","sensitive":"","notes":"user_id 73a187d1 — not in mapping."},{"id":"SL-371","member":"Member","group":"Member","date":"22/08","source":"Slack","area":"Data Science","subcategory":"Auto Workout","classification":"Problem","text":"Delayed detection of an activity.","answer":"Potential workout candidates were picked up at 6:58 and 7:12 but were suppressed by our false-positive-cut signatures — those signatures misfired here. Re-tuning them to reduce such instances.","sensitive":"","notes":""},{"id":"SL-372","member":"Member","group":"Member","date":"22/08","source":"Slack","area":"Hardware/Firmware","subcategory":"Battery","classification":"Question","text":"'Battery is discharging very quickly. Can check last 10 days?'","answer":"Discharging at 0.6–0.9%/hour over the last few cycles — within expected range. Scaled runtime is ~130–150 hours (median). False alert.","sensitive":"","notes":""},{"id":"SL-373","member":"—","group":"—","date":"22/08","source":"Slack","area":"Tech","subcategory":"App Crashes","classification":"Problem","text":"Onboarding screen stuck at progress bar for an internal user on app v1294.","answer":"Happens when the app is put into the background while the progress bar animation is running. Fix in app v1.1.0 (1310), live to all customers.","sensitive":"","notes":""},{"id":"SL-374","member":"—","group":"—","date":"22/08","source":"Slack","area":"Product Team","subcategory":"App & Home Experience","classification":"Suggestion","text":"When allowing customers to switch activities during a workout, allow labeling each activity after the workout ends. Current flow requires labeling during the workout, which is disruptive for hybrid workouts with rapid transitions. Suggested an 'Unnamed activity' option that can be labeled later.","answer":"","sensitive":"","notes":""},{"id":"SL-375","member":"Member","group":"Member","date":"22/08","source":"Slack","area":"Tech","subcategory":"Notifications","classification":"Problem","text":"Getting a repeated notification for the last couple of days.","answer":"Checked logs for the user_id, nothing conclusive. Same issue observed with 2–3 more users. Continuing to investigate on app + firmware side.","sensitive":"","notes":"user_id 1b9c24f2 — not in mapping."},{"id":"SL-376","member":"Member","group":"Member","date":"22/08","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Problem","text":"Unable to see the back icon and capture-photo icon on the screen. Temple Sense also wasn't working for a while in the morning.","answer":"Customer is on iOS 27 beta (public latest is iOS 26). Users on iOS 27 beta may experience issues with certain symbols/icons not rendering, though buttons still work when clicked. Hotfix in progress; app being validated on iOS 27 beta releases.","sensitive":"","notes":"user_id 767826a0 — not in mapping."},{"id":"SL-377","member":"—","group":"—","date":"22/08","source":"Slack","area":"Product Team","subcategory":"Nutrition & Logging","classification":"Problem","text":"A user's not able to log water intake — the food-log flow rejects zero-calorie inputs.","answer":"Confirmed — planning to allow zero-calorie inputs; also thinking through a dedicated hydration logging flow.","sensitive":"","notes":""},{"id":"SL-378","member":"Member","group":"Member","date":"22/08","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Problem","text":"'There's some tap-area issue on the pause/play button in the live activity widget. Also, there's a lag between hitting play and the activity actually resuming here, leading to multiple taps.'","answer":"Tap-area issue fixed; will be updated in the next release (bundled with the new-fonts release today). Lag issue also to be fixed in the same release.","sensitive":"","notes":""},{"id":"SL-379","member":"—","group":"—","date":"23/08","source":"Slack","area":"Product Team","subcategory":"App & Home Experience","classification":"Suggestion","text":"Multiple customers have requested auto-ending of an activity.","answer":"Team position: we send a nudge notification (currently after 2 hours of no motion) rather than auto-end, to avoid false auto-ends during breaks in sports/matches. Upper limit of 24h for auto-ending exists to prevent battery drain. Can tighten the 2-hour limit; nudges should be fine but auto-end is not planned.","sensitive":"","notes":""},{"id":"SL-380","member":"Member","group":"Member","date":"23/08","source":"Slack","area":"Product Team","subcategory":"Insights & Coaching","classification":"Problem","text":"User's Longevity Score declined despite three consecutive days of intense workouts, decent sleep and recovery. Score stayed at 86 for the last 10 days and dropped to 85 yesterday. Max Entropy / Idle Entropy / avg Brain Flow trends for the last 2 weeks didn't reveal the cause.","answer":"Both resting Entropy and Max Entropy Capacity contributions reduced on 23rd vs 22nd — both are computed on 30-day data, not just for that specific day, which is why the change isn't visible in short-term trends. Introducing Sense-driven callouts to explain reasons for Longevity Score changes.","sensitive":"","notes":""},{"id":"SL-381","member":"—","group":"—","date":"23/08","source":"Slack","area":"Product Team","subcategory":"App & Home Experience","classification":"Suggestion","text":"Two inputs on the Search feature on the home page: (1) it only works on Activity and Nutrition logs; Supplements, weight, blood pressure, etc are missing. (2) No way to view All Food or All Sleeps; only All Activities can be viewed.","answer":"Will add filters for logged items / journals; will bake retrieval functionality from Sense chat as well. All sleeps can already be filtered via the 'Any' option under Duration but that's not evident — will make it more intuitive. Adding All Meals too.","sensitive":"","notes":""},{"id":"SL-382","member":"—","group":"—","date":"23/08","source":"Slack","area":"Product Team","subcategory":"Insights & Coaching","classification":"Problem","text":"Customers are raising queries on certain data points not being ingested into Sense's pipeline (e.g. Blood Pressure readings). Features added later seem to be missing.","answer":"Backend team engaged; list of missing metrics/features shared. Changes being sent for prioritisation.","sensitive":"","notes":""},{"id":"SL-383","member":"Member","group":"Member","date":"24/08","source":"Slack","area":"Data Science","subcategory":"Auto Workout","classification":"Problem","text":"(1) High number of false auto-workout detections for this user. (2) Today, an auto-activity detection at ~10:30 AM was ended manually by the user, but the device is still in activity mode.","answer":"Timeline: 10:25 Temple disconnected → 10:26 auto-workout detection on phone → 10:33 device briefly reconnected, user tapped Aerobar, workout started (backdated to 10:26), then disconnected. 10:33–15:39 device stayed disconnected. 15:39 reconnected → app re-sent workout-mode enable → success. As of 16:46, workout still running (~6h+); no End & Save / discard tap all day (end_save_activity count = 0). User confirmed they pressed stop but didn't discard, then killed the app — the two-click discard flow needs a UX fix. Also: ~190 min of workout mode over 5 days that didn't surface as actual workouts, accounting for ~10% battery consumption.","sensitive":"","notes":"user_id c0332743 — not in mapping."},{"id":"SL-384","member":"Member","group":"Member","date":"24/08","source":"Slack","area":"Tech","subcategory":"Sync & Data","classification":"Problem","text":"Temple was on-body and charged, disconnected for ~10–15 min and then reconnected. Phone was with the user the whole time. Recurring for this user.","answer":"Team investigating.","sensitive":"","notes":""},{"id":"SL-385","member":"Member","group":"Member","date":"25/08","source":"Slack","area":"Data Science","subcategory":"Calorie Tracking","classification":"Problem","text":"Calories seem to be underestimated for a workout.","answer":"User logged the workout retrospectively — activity mode was not turned on during the workout. Exploring whether to use user inputs from the log for a better retrospective estimate.","sensitive":"","notes":""},{"id":"SL-386","member":"Member","group":"Member","date":"25/08","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Problem","text":"Missed sleep onset by ~45 min last night. Actual onset was 1:20 AM; captured as 2:05 AM. User kept phone aside at 1:20 AM but may have been awake past that.","answer":"Debugging.","sensitive":"","notes":""},{"id":"SL-387","member":"Member","group":"Member","date":"25/08","source":"Slack","area":"Data Science","subcategory":"Calorie Tracking","classification":"Problem","text":"'There is a bug. I copy pasted this from my nutritionist. Gave exact macros. Even after giving all the correct info, it miscalculated.' Nutritional information for breakfast (2 sourdough toasts + masala omelette): 298 cal, 23.4g protein, 25.9g carbs, 11.2g fats — but Temple showed 520 kcal, 22g P, 60g C, 20g F.","answer":"Root cause: we were only handling macros specified per dish; user provided macros for the entire meal at once, which wasn't handled and got dropped. Fix updated so meal-level macros are distributed across individual dishes proportionally based on catalogue values. Testing on dev.","sensitive":"","notes":""},{"id":"SL-388","member":"Member","group":"Member","date":"25/08","source":"Slack","area":"Product Team","subcategory":"Nutrition & Logging","classification":"Suggestion","text":"'The meal in the night miso Ramen was before sleeping, should not be part of today's nutrition. We should separate meals of the day based on sleep than 12-12.' User logged a meal at 12:20 AM on 25 Aug. Clarified in follow-up: 'I will check the nutrition of the day based on food consumed during the day between two nights' sleep. This cannot be measured between 12 AM to midnight. Also, the pattern/timing of consuming these food items forms a big portion of body health/stomach/gut issues.'","answer":"","sensitive":"","notes":""},{"id":"SL-389","member":"Member","group":"Member","date":"26/08","source":"Slack","area":"Product Team","subcategory":"Insights & Coaching","classification":"Problem","text":"String of numbers surfaced in the insights on the app.","answer":"System and user prompts reviewed — a Max Entropy of 159 was passed without the decimal; the repeating .0's were purely hallucinated by the LLM (a degenerate repetition loop, a common LLM issue). Switched from gemini-3.6-flash to gpt-5.6-luna, which is delivering better results. Also looking at code-level changes to capture and never surface these to users. Happens only in rarest cases.","sensitive":"","notes":"user_id 1351367a — not in mapping."},{"id":"SL-390","member":"Member","group":"Member","date":"27/08","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Problem","text":"On 24 Aug the customer achieved Max Entropy 169 and Resting Entropy 62. The timeline widget showed 119 and 73 respectively.","answer":"Issue identified; fix released the same day.","sensitive":"","notes":""},{"id":"SL-391","member":"Member","group":"Member","date":"27/08","source":"Slack","area":"Product Team","subcategory":"Insights & Coaching","classification":"Problem","text":"Wore Temple after a hiatus and Longevity score spiked ~15 points on day 1 of resuming wear — without any workout done. Score is not baking in off-body days.","answer":"Threshold logic: need 60% of a day's data to consider a valid day; below 12h on-body → don't decay Max Capacity and don't include that day in L30D resting Entropy. Live now. Dormant-user handling coming next: if a user doesn't wear continuously for 7 days OR valid-days-in-L30 drops below 15, score locks; to unlock, wear for 3 days with ≥18 valid days in L30.","sensitive":"","notes":""},{"id":"SL-392","member":"Member","group":"Member","date":"26/08","source":"Slack","area":"Data Science","subcategory":"Accuracy","classification":"Problem","text":"Step-count difference between Temple and Garmin — wore both devices at the same time.","answer":"No true label during daily movement, so both devices worn together with a ~5–6% gap is expected. Also evaluating a couple of improvements to the steps algorithm; all report in the 16–17k range for this session.","sensitive":"","notes":"user_id 72b05c10 — not in mapping. Same theme as SL-352 (steps discrepancy vs another wearable) but a different customer."},{"id":"SL-393","member":"Member","group":"Member","date":"26/08","source":"Slack","area":"Product Team","subcategory":"App & Home Experience","classification":"Suggestion","text":"'Can we have the HR Zone written just after Heart Rate?' Currently the customer has to verify HR Zone against the graph, which is challenging while working out.","answer":"We wanted people to relate with their Entropy zones — evaluating whether to bring back HR Zone information on the live workout page.","sensitive":"","notes":""},{"id":"SL-394","member":"Member","group":"Member","date":"26/08","source":"Slack","area":"Product Team","subcategory":"App & Home Experience","classification":"Suggestion","text":"Wants auto-detection for when his activity is completed — currently the workout keeps running in the background if not manually stopped.","answer":"Same as prior asks — team position is nudge-only (not auto-end) with a 2-hour no-motion trigger, to avoid false auto-ends during breaks in sports/matches.","sensitive":"","notes":"Related to SL-379 (auto-end asked by multiple customers)."},{"id":"SL-395","member":"Member","group":"Member","date":"27/08","source":"Slack","area":"Hardware/Firmware","subcategory":"Charger","classification":"Problem","text":"'Device not working. Didn't use it for the past 5-6 days. Put it on charge, there's no light.'","answer":"Device charging light was actually active and the device was at 100% — customer's video didn't clearly show the LED. Device did see an abnormal discharge rate on 16 Aug (flagged for investigation). Customer to test PPG by placing a surface close to the sensor. Device otherwise operational.","sensitive":"","notes":"user_id d44d06f4 — not in mapping. Abnormal discharge on 16 Aug flagged internally."},{"id":"SL-396","member":"Member","group":"Member","date":"27/08","source":"Slack","area":"Product Team","subcategory":"App & Home Experience","classification":"Suggestion","text":"'This image doesn't go with the brand. And reminds me of Wikihow.' Referring to the 'Reminder to change your grip' image.","answer":"Video made for this — replacing the quick-fix image with a real-life imagery thumbnail + video. Sketches also being upgraded.","sensitive":"","notes":""},{"id":"SL-397","member":"Member","group":"Member","date":"28/08","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Problem","text":"Customer spends time lazing in bed after waking up and it gets registered as light sleep. Recurring on nights 23→24, 25→26, 27→28 Aug.","answer":"For 27→28: accel signature is stable and continuously still 6:12–8:22; HR increases and dips multiple times which doesn't conclusively differentiate sleep from waking — the region is very quiet and HR is indistinguishable from the rest of the sleep. For 23rd night: user was in flight; prediction looks correct based on signals. Dashboards shared for further debug.","sensitive":"","notes":"user_id 73856ba3 — not in mapping."},{"id":"SL-398","member":"Member","group":"Member","date":"28/08","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Problem","text":"'While Temple catches naps pretty accurately, it doesn't do that until a while, sometimes as late as 30 to 60 minutes. Is that intentional?'","answer":"Known issue; solved. Earlier we only showed a nap once we were sure it had completed, which required a certain amount of post-nap data — hence the delay. Moved to the same logic as sleep. Enabled for external customers on 28/08.","sensitive":"","notes":"user_id 9f05de09 — not in mapping."},{"id":"SL-399","member":"Member","group":"Member","date":"31/08","source":"Slack","area":"Data Science","subcategory":"Auto Workout","classification":"Problem","text":"Auto-detection missed a workout that Whoop caught. 8:30–9:30 AM: 10 min skipping → 45 min weights → 10 min skipping.","answer":"Captured as several shorter sessions rather than one continuous workout, so no detected workout notification was sent. Cause traced; fix in progress.","sensitive":"","notes":""},{"id":"SL-400","member":"—","group":"—","date":"31/08","source":"Slack","area":"Data Science","subcategory":"Auto Workout","classification":"Suggestion","text":"Suggestion from customer feedback (heard from 2 customers on separate occasions): turn off duty-cycling at certain points during the day based on the customer's routine — e.g. if a user works out almost daily 7–9 AM Mon–Fri, disable duty cycle at 6:45 AM to capture workout onset (and similarly for offset). Would help capture activities more reliably.","answer":"Exploring further; will validate the 'routine holds true' hypothesis with data across customers first.","sensitive":"","notes":""},{"id":"SL-401","member":"Member","group":"Member","date":"01/09","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Problem","text":"Chart y-axis has 'two 2ks' shown and an odd value like '783' on the scale.","answer":"Team checking.","sensitive":"","notes":"user_id ac5b8928 — not in mapping."},{"id":"SL-402","member":"Member","group":"Member","date":"01/09","source":"Slack","area":"Data Science","subcategory":"Calorie Tracking","classification":"Problem","text":"Recorded a strength-training session showing Physical Work 1.2 on Temple while Whoop showed Strain 11.5. Isn't the delta significant?","answer":"Auto-detection did fire and opened the aerobar, but customer didn't act on it — so device kept tracking on its own. That detection lasted only 12 min and stopped (movement + HR weren't high or steady enough); a detected activity must run 20 min to be saved. Raised HR was seen 7:50–9:25 GST but almost entirely in duty-cycled mode (avg 86 bpm, peak 96), and a drop in Entropy observed. During low motion + duty cycling, per-second sensor data is required to detect strength-training patterns accurately. Calories came out low — 60 during the session (0.8 PW) plus walking through the day (total 1.2 PW). For a strength session of this duration we'd expect ~150–200 active calories (~2.5 PW). That still wouldn't reach Whoop's 11.5 because Whoop's revised Strain adds an estimated musculoskeletal-load component (based on workout type, not HR) on top of cardiovascular load; our Physical Work is calorie-dependent, so we'll structurally under-report vs Strain in strength workouts. Recommendation: manually log strength-training sessions for better active-calorie estimation.","sensitive":"","notes":"user_id 900e20e7 — not in mapping."},{"id":"SL-403","member":"Member","group":"Member","date":"02/09","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Problem","text":"Sleep orientation wasn't generated for this user.","answer":"We identify worn-side by 4 windows with >0 steps; detected Left at 1:25 AM, no steps after that (user went to sleep). An update around 10 AM flipped the side, causing confusion in worn-side — hence no posture published. User disputes the reason (says she re-applied 3 times: 1:30 PM, 2:30 PM, 4:20 PM). Verified with raw accelerometer data locally — both updates are as expected. History is reset every night; should not recur.","sensitive":"","notes":""},{"id":"SL-404","member":"Member","group":"Member","date":"02/09","source":"Slack","area":"Hardware/Firmware","subcategory":"Battery","classification":"Question","text":"Charged to 100% on Tuesday, now showing only 5% battery remaining — is 2 days quite low?","answer":"Device was only charged to 54% on 1 Sep (customer thought it was 100% — case blinked yellow when picked up). When charging stopped, we saw multiple stops and restarts before it finally stopped — likely residue from grips on the device. Auto-workout duration isn't significant here. Ask customer to clean the device before charging next time.","sensitive":"","notes":"user_id a456e370 — not in mapping."}],"taxonomy":{"Hardware/Firmware":["Battery","Device Body","Charger","Connectivity","Sensor","Heating"],"Manufacturing":["Color/Finish","Breakage","Packaging"],"Adhesion":["Tapes","Skin Issues","Residue"],"Data Science":["Accuracy","Chewing Detection","Sleep Tracking","Auto Workout","Calorie Tracking","GPS/Distance"],"Science Team":["Entropy","Brain Flow","Focus","Cognitive Metrics","Physical Metrics","Recovery Score","Others"],"Tech":["App Crashes","Sync & Data","Notifications","UI/UX","Android Bugs"],"Product Team":["Nutrition & Logging","Insights & Coaching","App & Home Experience","Integrations & Notifications","Device & Metrics","Women's Health"],"Support":["Onboarding","Device Replacement","Logistics"]},"faq":{"Hardware/Firmware":[{"question":"How long does the device take to charge, and how do I know when it's done?","customers":[],"answer":"A full charge takes about 1 hour 15 minutes (80% in ~30 mins). You'll get a notification on the app when it's complete. The LED on the charger will breathe 4 times and stop — that's normal, not a fault.","count":3},{"question":"Why does battery drain faster than expected, or not last the advertised duration?","customers":[],"answer":"Battery life averages 3–3.5 days. Leaving an activity running in the background significantly drains it faster. Check that no activity is paused/running when not in use. Battery life is intentionally matched to tape change rhythm (every 3–4 days).","count":4},{"question":"What do the different LED light colours and blink patterns on the charger mean?","customers":[],"answer":"White blinking = charging in progress. Breathing 4 times then stopping = fully charged (this is normal). No light = device not seated properly on charger, adjust placement. Purple/unusual colours may indicate a firmware or hardware issue — contact support.","count":2},{"question":"Is the device safe to use near water, during sweaty workouts, or in a sauna?","customers":[],"answer":"The device is fully waterproof — face washing, showering, and sweating are all fine. Sauna is also safe; the temple area naturally stays at core body temperature, capping device heat around 40–45°C even at 70°C ambient. Max rated temp is around 55°C.","count":2},{"question":"The device keeps disconnecting or won't reconnect to the app — what should I do?","customers":[],"answer":"First try restarting your phone's Bluetooth. If that doesn't work, unlink the device in the app and re-scan. For new/replacement devices, you will need to unlink the old device first before connecting the new one — we're working on making this automatic.","count":3}],"Adhesion":[{"question":"Why does the tape fall off during heavy workouts or after a few days?","customers":[],"answer":"The most common cause is oil or residue on the skin before application. Wipe the temple area with a dry tissue first, then press the device firmly for 4–5 seconds after placing. For high-sweat activities, use Athlete tapes instead of Comfort tapes. Tape is designed to last 3–4 days.","count":5},{"question":"Is it normal for skin to feel irritated or show marks after removing the tape?","customers":[],"answer":"Mild marks or slight redness on removal is common, especially in early weeks. Skin typically adapts within 1–2 tape cycles. Avoid reapplying to the exact same spot — rotate slightly. If irritation persists beyond 3–4 days, switch sides or contact us.","count":3},{"question":"Does residue build up on the device sensor, and how should I clean it?","customers":[],"answer":"Some glue residue on the device after removal is normal. Use a dry cloth or damp wipe to gently clean the contact points and sensor area. Avoid submerging the device specifically for cleaning. Keeping the sensor area clean ensures accurate readings.","count":1}],"Data Science":[{"question":"Why did the device miss detecting a meal, or flag a false eating detection?","customers":[],"answer":"Chewing detection works on jaw movement patterns and is still being personalised per user. False positives (e.g. chewing gum, talking) can be dismissed and tagged as 'not eating' — this data trains your personal model. Liquids and small sips are not detected yet. Late notifications are being improved.","count":5},{"question":"Why does the sleep tracking seem inaccurate — wrong start time, missed naps, or split sessions?","customers":[],"answer":"Sleep detection improves over the first 7 days as the device calibrates to your patterns. Brief wake-ups (under 10 mins) should now merge as one session. Nap detection is not yet live. If sleep data is missing, check battery didn't die mid-sleep — that causes a gap. You can manually edit sleep times in the app.","count":4},{"question":"Calorie counts seem off — too high for food logged, or too low for workouts. Why?","customers":[],"answer":"Food calorie estimates are AI-generated and occasionally inaccurate — flag these so we improve them. For workouts, Temple uses entropy-based calorie calculation rather than heart rate, which is more accurate for strength training but still being refined for high-intensity cardio (HIIT, cycling at threshold). Improvements are actively in progress.","count":3},{"question":"Can the device detect drinks, liquids, or fluid intake?","customers":[],"answer":"Not currently — detection is based on jaw chewing movements, so liquids (smoothies, coffee, water) are not picked up. This is on the roadmap.","count":2}],"Science Team":[{"question":"What does Entropy actually measure, and what brings it down?","customers":[],"answer":"Entropy is your body's real-time metabolic rate — the total energy cost of what you're doing (physical activity + nervous system activity + baseline organ function). To lower it: meditation, breathwork, cold exposure, head-down tilt, and sleep. It naturally spikes during exercise, eating, and stress — and drops during rest and recovery.","count":5},{"question":"Why does Entropy go above the 120/160 shown on the dial during workouts?","customers":[],"answer":"The dial shows up to 120 (or 160 on some versions) because that's where most users sit day-to-day. During intense workouts, entropy can reach 180–200+, which is normal and means your body is working hard. The full scale goes to 200 — the display will be updated to reflect this.","count":2},{"question":"How is Focus measured, and why does it show low even during focused work?","customers":[],"answer":"Focus is a physiological signal measured from cerebral blood flow patterns — it reflects your brain's readiness state, not effort or concentration per se. Always log an activity when doing focused work (surgery, coding, meetings) so we can study and calibrate your personal focus signature.","count":2},{"question":"What is Cognitive Work and how do I increase it?","customers":[],"answer":"Cognitive Work = Focus × hours. It's the total productive brain output over a period. To increase it: maintain high focus states for longer durations by keeping Entropy low before deep work sessions, sleeping well, and timing focused work during your natural Brain Flow peaks.","count":2}],"Tech":[{"question":"Data isn't loading, or the app is showing outdated/missing metrics — what's happening?","customers":[],"answer":"This is usually a sync delay. Try killing the app and reopening. Charts update on 5-minute intervals, so the last data point shown will be the last 5-minute mark — live data catches up within seconds of opening. If sleep data is missing after waking, wait a few minutes for backend processing to complete.","count":3},{"question":"Notifications are either too frequent, delayed, or not firing at all — is this normal?","customers":[],"answer":"Off-body reminders fire at regular intervals. Charge-complete notifications trigger once at 100% — if missed, a persistent banner is being added. Eating detection notifications are being tuned for timing. Push every 5 minutes after full charge is a bug — being fixed. Bluetooth-off notifications are on the roadmap.","count":4},{"question":"The UI feels confusing in certain spots — ending an activity, calorie display, or chart readability.","customers":[],"answer":"Known areas being improved: ending an activity requires 3-dot menu (intentional to keep screen clean, will be made clearer); calorie surplus/burned label can be confusing (fix in progress); chart data intervals are 5 minutes (not real-time by design). Feedback on specific screens is always welcome — send a screenshot.","count":3}],"Product Team":[{"question":"Is there or will there be a way to locate the device if it's lost or falls off?","customers":[],"answer":"Find My Temple is now live on app version v1.1.0. Update your app to access it. We also replace devices under Temple Care if they're lost or damaged.","count":3},{"question":"Are third-party integrations like Strava, Apple Health, or Garmin planned?","customers":[],"answer":"Apple Health integration is already live — go to Menu > Integrations > Apple Health. Strava is in active development (2–3 weeks). Automated Set Detection for workouts is also coming soon. More integrations are being prioritised based on demand.","count":3},{"question":"Will there be a widget or quicker way to log food and check metrics without opening the app?","customers":[],"answer":"A home screen widget is in development. It will show live Entropy and Brain Flow, and allow quick food logging and activity starts directly from the widget — no need to open the full app.","count":2},{"question":"Can the device be shared between two people or used by someone else temporarily?","customers":[],"answer":"Not currently — the device calibrates to one person's physiology and profile. Sharing without resetting produces inaccurate readings. A reset/share flow is on the roadmap. For now, contact support if you need a second device.","count":2}],"Manufacturing":[{"question":"Will there be more colour options, including options suited for women?","customers":[],"answer":"Yes — three more colours are coming: Reflective Silver, True Gold, and Matte Titanium. Rose Gold for women is also being developed. Current users will be informed when new colours are available.","count":1}],"Support":[{"question":"How does device replacement work if the device is lost, damaged, or malfunctioning?","customers":[],"answer":"All devices are covered under Temple Care — our in-house replacement programme. Contact your support group and we'll ship a replacement right away, no questions asked. For damaged devices, we may ask to collect the old unit for diagnosis. Replacements typically arrive within 1–2 business days (India).","count":4}]}};

function showLoginErr(msg){const e=document.getElementById("login-err");if(e){e.textContent=msg;e.classList.add("show");}}
function handleGoogleSignIn(response){
  const errEl=document.getElementById("login-err");
  if(!response||!response.credential){showLoginErr("Sign-in didn't complete. Please try again.");return;}
  const payload=decodeJwt(response.credential);
  if(!payload||!payload.email||!payload.email_verified){showLoginErr("Could not verify your Google account. Please try again.");return;}
  const email=payload.email.toLowerCase();
  if(!email.endsWith("@temple.com")){showLoginErr("Please sign in with your @temple.com Google account.");return;}
  errEl.classList.remove("show");
  SESSION={email,role:roleFor(email)};
  try{sessionStorage.setItem(SESSION_KEY,JSON.stringify(SESSION));}catch(e){}
  enterApp();}
// Explicit GSI initialization — more reliable than data-attribute auto-init, enables FedCM,
// and surfaces errors instead of silently stalling after account selection.
function initGoogleSignIn(){
  if(!(window.google&&google.accounts&&google.accounts.id)){
    // GSI script not ready yet — retry shortly.
    return setTimeout(initGoogleSignIn,200);
  }
  try{
    google.accounts.id.initialize({
      client_id:GOOGLE_CLIENT_ID,
      callback:handleGoogleSignIn,
      use_fedcm_for_prompt:true,
      auto_select:false,
      cancel_on_tap_outside:true
    });
    const btn=document.getElementById("gsi-button");
    if(btn){
      google.accounts.id.renderButton(btn,{type:"standard",size:"large",theme:"filled_black",text:"signin_with",shape:"rectangular",logo_alignment:"left",width:300});
    }
  }catch(e){
    showLoginErr("Google Sign-In failed to load. Check your connection and refresh. ("+(e&&e.message?e.message:e)+")");
  }
}

function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
// Safe for passing a string as an argument inside a single-quoted inline on* handler.
// Escapes backslash and apostrophe (JS string), then &<>" for the HTML attribute layer.
function escJs(s){return (s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function by(arr,k){const m={};arr.forEach(r=>{(m[r[k]]=m[r[k]]||[]).push(r)});return m;}
function countClass(rows){const c={};CLASS_ORDER.forEach(x=>c[x]=0);rows.forEach(r=>{if(c[r.classification]!=null)c[r.classification]++});return c;}
function teamLabel(name){return String(name).replace(/\s+Team$/,'');} // display-only: drop trailing "Team"
function classChips(active){ // classification filter chips that double as the colour legend
  return '<div class="chips">'+CLASS_ORDER.map(c=>`<button class="chip ${active==c?'on':''}" onclick="setClass('${c}')"><span class="swatch" style="background:${CLASS_COL[c]}"></span>${c}</button>`).join('')+'</div>';
}
function cardInner(rows,label,openLabel){

}

function __recencyKey(r){
  const s=String(r.date||'').trim();
  if(!s) return -Infinity; // undated -> bottom
  const parts=s.split(/[,\u2013\-]/).map(x=>x.trim()).filter(Boolean);
  const last=parts[parts.length-1]; // for ranges/multi-dates, use the newest fragment
  const m=last.match(/^(\d{1,2})\/(\d{1,2})$/);
  if(!m) return -Infinity;
  return parseInt(m[2],10)*100+parseInt(m[1],10);
}
function __sortByRecency(rows){
  return rows.slice().sort((a,b)=>{
    const ka=__recencyKey(a), kb=__recencyKey(b);
    if(kb!==ka) return kb-ka; // newer first
    // secondary: id descending so newer SL id wins within same date
    const na=parseInt(String(a.id).replace(/[^0-9]/g,''),10)||0;
    const nb=parseInt(String(b.id).replace(/[^0-9]/g,''),10)||0;
    return nb-na;
  });
}

function tableRows(rows){
  rows=__sortByRecency(rows);
  return `<table><thead><tr><th>Date</th><th>Feedback</th><th>Type</th><th>Answer / Remark</th></tr></thead><tbody>`+
    rows.map(r=>`<tr>
      <td>${esc(r.date)}</td>
      <td><div class="txt">${esc(r.text)}</div></td>
      <td><span class="badge b-${r.classification}">${esc(r.classification)}</span></td>
      <td><div class="ans">${esc(r.answer)||'—'}</div></td>
    </tr>`).join('')+`</tbody></table>`;
}

function stackBar(groups, onClickFn, activeKey){ // groups: {label: rows}; onClickFn: name of fn taking the label
  const keys = Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length);
  const max = Math.max(1,...keys.map(k=>groups[k].length));
  return '<div class="stack">'+keys.map(k=>{
    const c=countClass(groups[k]);const tot=groups[k].length;
    const clickable = onClickFn ? ` onclick="${onClickFn}('${escJs(k)}')" style="cursor:pointer"` : '';
    const active = activeKey===k ? ' rowbar-active' : '';
    return `<div class="row-bar${active}"${clickable}><div class="lbl"><span class="lbl-name">${esc(k)}</span> <span class="lbl-count">· ${tot}</span></div>
      <div class="bar" style="width:${tot/max*100}%">`+
      CLASS_ORDER.map(cl=>c[cl]?`<span title="${cl}: ${c[cl]}" style="width:${c[cl]/tot*100}%;background:${CLASS_COL[cl]}"></span>`:'').join('')+
      `</div></div>`;}).join('')+'</div>';
}

  let h=`<div class="crumb"><button class="back" onclick="goHome()">← All</button>
    <div class="detail-h">${esc(dispName(m))}</div></div>`;
  const areasLabelled={};Object.keys(areas).forEach(k=>{areasLabelled[teamLabel(k)]=areas[k];});
  h+=`<div class="panel"><h3>By team</h3>${stackBar(areasLabelled)}</div>`;
  h+=classChips(state.fClass);
  let fr=rows; if(state.fClass)fr=fr.filter(r=>r.classification==state.fClass);
  h+=`<div class="stat">${fr.length} of ${rows.length} records</div>`;
  h+=tableRows(fr);
  app.innerHTML=h;
}

function render(){
  // Always enforce correct view visibility so navigation never re-shows the login screen.
  if(SESSION&&SESSION.email){
    document.getElementById("login-view").hidden=true;
    document.getElementById("app-view").hidden=false;
  }
  if(state.view=='home')home();
  else if(state.view=='team')teamView();
  else if(state.view=='member')memberView();
  window.scrollTo(0,0);
}
(function(){
  // Seed a base history entry representing the home view, so the first back-press returns to home instead of leaving the page.
  try{history.replaceState({view:'home',tab:'team',sel:null,subtab:'overview',fSub:null,fClass:null},"");}catch(e){}
  if(SESSION&&SESSION.email){SESSION={email:SESSION.email,role:roleFor(SESSION.email)};enterApp();}
  else{document.getElementById("login-view").hidden=false;initGoogleSignIn();}
})();
</script>
</body>
</html>
