on":"Problem","text":"the member: Wore the device all day yesterday but the app thinks I didn't. It says I was wearing it for only a short time.","answer":"Getting this checked. Can you unpair Temple from Bluetooth settings and pair again to ensure all further activity is logged.","sensitive":"","notes":""},{"id":"WA-165","member":"Member","group":"Member","date":"11/06","source":"WhatsApp","area":"Data Science","subcategory":"Sleep Tracking","classification":"Problem","text":"the member: Sleep showing only 3.6hrs but in reality I slept 8hr 30min as per Garmin. Something is off.","answer":"Your second half of sleep looks very disturbed with high motion. We are updating our algos to capture these types of disturbed sleep better.","sensitive":"","notes":""},{"id":"WA-166","member":"Member","group":"Member","date":"04/06","source":"WhatsApp","area":"Hardware/Firmware","subcategory":"Sensor","classification":"Question","text":"First question is around wearability in heat, particularly sauna. I used to wear my Oura in the sauna and it impacted battery life. Any suggestions for Temple?","answer":"Temple stays perfectly fine in the sauna as long as it is stuck to the temple. The temple region maintains core body temperature, so it cools the device. Max temperature seen on Temple in sauna is 45°C for a 15 min sauna at 90°C.","sensitive":"","notes":""},{"id":"WA-167","member":"Member","group":"Member","date":"07/06","source":"WhatsApp","area":"Hardware/Firmware","subcategory":"Sensor","classification":"Question","text":"Is it normal to have a slight sensation when first starting usage? Not like a headache but sort of like a small notion of the onset of one? Or maybe it's just because I'm conscious of it.","answer":"Not at all. There's nothing in Temple which can cause a headache. Zero radiation towards the body side. All we do is throw some red light into the skin.","sensitive":"","notes":""},{"id":"WA-168","member":"Member","group":"Member","date":"19/06","source":"WhatsApp","area":"Support","subcategory":"Onboarding","classification":"Question","text":"One question was about airport security — I travel quite a bit, what's the process?","answer":"You don't need to take Temple off during airport security. Walk right through the scanner. If asked, tell them it's a fitness wearable. 1% chance they ask you to take it off — you can say you can't, they'll wave the scanner and let you go.","sensitive":"","notes":""},{"id":"WA-169","member":"Member","group":"Member","date":"20/06","source":"WhatsApp","area":"Science Team","subcategory":"Entropy","classification":"Question","text":"How should I read Entropy? My best shows 12 but it's usually in 30s-50s. What version of this stat is worrying or should be changed?","answer":"Entropy is context-driven. At rest it should be low — that means your body is spending fewer calories to keep you going, linked to longevity. During activity it should rise — that's good, it shows your body can meet demand.","sensitive":"","notes":""},{"id":"WA-170","member":"Member","group":"Member","date":"22/06","source":"WhatsApp","area":"Adhesion","subcategory":"Tapes","classification":"Question","text":"How does one peel off the tape to replace? Is it safe to keep Temple in the case with the tape on? In a single use how many days is one tape advised for?","answer":"","sensitive":"","notes":""},{"id":"WA-171","member":"Member","group":"Member","date":"22/06","source":"WhatsApp","area":"Product Team","subcategory":"Insights & Coaching","classification":"Suggestion","text":"I realised I didn't know where to look for answers to basic questions. Perhaps adding some of this in the app or somewhere easily accessible will be useful.","answer":"","sensitive":"","notes":""},{"id":"WA-172","member":"Member","group":"Member","date":"19/06","source":"WhatsApp","area":"Data Science","subcategory":"Sleep Tracking","classification":"Positive","text":"The post-jog feedback I got from Temple today is way way better than Whoop. The connection to the reduced deep sleep and fatigue was an interesting point. Zone 2/3 feedback was great.","answer":"","sensitive":"","notes":""},{"id":"WA-173","member":"Member","group":"Member","date":"15/06","source":"WhatsApp","area":"Support","subcategory":"Onboarding","classification":"Positive","text":"Super excited to get Temple. Looking forward to learning more about it and myself.","answer":"","sensitive":"","notes":""},{"id":"WA-174","member":"Member","group":"Member","date":"22/06","source":"WhatsApp","area":"Hardware/Firmware","subcategory":"Battery","classification":"Problem","text":"During a workout today I saw rapid drain of battery. The device was drained faster than the estimated charge left shown on app.","answer":"Battery does drain faster during activity mode. In this case you started the workout when the device was at 12% charge, which led to faster drain than usual. The team will be making changes for better performance at low charge.","sensitive":"","notes":""},{"id":"WA-175","member":"Member","group":"Member","date":"22/06","source":"WhatsApp","area":"Hardware/Firmware","subcategory":"Charger","classification":"Question","text":"Any way to see the charging status of the charging case?","answer":"The crescent-shaped light on the pod indicates remaining charge: red = less than one complete charge left, yellow = just more than 1 charge, white = more than 2 charges left. It holds max 5 charges.","sensitive":"","notes":""},{"id":"WA-176","member":"Member","group":"Member","date":"22/06","source":"WhatsApp","area":"Science Team","subcategory":"Entropy","classification":"Question","text":"Screenshots of entropy, brainflow and heart rate from weekend's workout — how do I read this? Body was able to push through in all three, but since heart rate took longest to come back to resting state, does that mean cardiovascular health needs more attention?","answer":"","sensitive":"","notes":""},{"id":"WA-177","member":"Member","group":"Member","date":"22/06","source":"WhatsApp","area":"Science Team","subcategory":"Focus","classification":"Question","text":"I have mixed views on Focus. It has been extreme for me. I was surprised by its accuracy when my 6-month-old had bad congestion — I was mentally very alert, which was reflected. But during my cricket session, I expected it to peak and it was actually the opposite.","answer":"","sensitive":"","notes":""},{"id":"WA-178","member":"Member","group":"Member","date":"15/06","source":"WhatsApp","area":"Science Team","subcategory":"Entropy","classification":"Question","text":"Help me understand: during an engaging roadmap meeting I noticed my entropy was quite low but focus shot up. What do I infer? I thought low entropy meant I'm in a relaxed state but it didn't feel like that.","answer":"Perceived load and actual physiological load are two different things. Entropy captures the latter. You could feel loaded but your body might not be demanding as much metabolically. High focus and low Entropy — yes, sounds like a good place to be in.","sensitive":"","notes":""},{"id":"WA-179","member":"Member","group":"Member","date":"16/06","source":"WhatsApp","area":"Tech","subcategory":"UI/UX","classification":"Problem","text":"Minor bug around tagging a meal as lunch while it was consumed at 8am. Also if I'm logging without a picture it doesn't appear on the feed, makes me think it hasn't been logged but it shows on the food page.","answer":"Getting this sorted — if you refresh your app you'll be able to see the meal you had logged without the picture.","sensitive":"","notes":""},{"id":"WA-180","member":"Member","group":"Member","date":"16/06","source":"WhatsApp","area":"Product Team","subcategory":"Integrations & Notifications","classification":"Suggestion","text":"After adding food/activity details, the card doesn't show any state change while being processed in the background. As a user it feels like the activity didn't get logged. Should show an 'in progress' state on the card until processing is complete.","answer":"The fix for this is now live.","sensitive":"","notes":""},{"id":"WA-181","member":"Member","group":"Member","date":"18/06","source":"WhatsApp","area":"Science Team","subcategory":"Others","classification":"Question","text":"What would be a good benchmark for systolic time and respiratory rate?","answer":"Respiratory rate at sleep should be between 14-16. Closer to 13 is almost yogi level. For systolic time, lower is better — indicates your heart pumps blood out quickly. Healthy range is 150-180ms; endurance athletes sit around the lower number.","sensitive":"","notes":""},{"id":"WA-182","member":"Member","group":"Member","date":"18/06","source":"WhatsApp","area":"Hardware/Firmware","subcategory":"Sensor","classification":"Question","text":"What happens if the device falls off in water during a shower or swim?","answer":"It won't come off if you wipe dry your skin before application and press hard for 5 seconds. Pressure-sensitive adhesives need that initial press. If it does fall, Temple Care covers replacement.","sensitive":"","notes":""},{"id":"WA-183","member":"Member","group":"Member","date":"18/06","source":"WhatsApp","area":"Product Team","subcategory":"Device & Metrics","classification":"Suggestion","text":"Small observation: after putting the device in the pod, I found myself checking the app a few times to see if charging had completed. Felt like I wanted a 'ready to use again' signal.","answer":"You do get a notification when device is 100% charged. Checking if notifications are enabled for Android.","sensitive":"","notes":""},{"id":"WA-184","member":"Member","group":"Member","date":"19/06–01/07","source":"WhatsApp+Slack","area":"Tech","subcategory":"Android Bugs","classification":"Problem","text":"Two Android issues: the charge-complete notification didn't fire, and after confirming a meal the home meal card doesn't show a loading state and renders incorrectly until the page is reloaded.","answer":"The charge-notification issue is being checked. The meal-card bug was identified and a hotfix shipped (v0.2.024), live after review.","sensitive":"","notes":"Collapsed block (2 instances): WA-184, SL-046"},{"id":"WA-185","member":"Member","group":"Member","date":"19/06","source":"WhatsApp","area":"Product Team","subcategory":"Insights & Coaching","classification":"Positive","text":"Really liking these daily insights. One of the few experiences that consistently tries to explain why it happened and what I should do next. Feels very human and easy to consume.","answer":"","sensitive":"","notes":""},{"id":"WA-186","member":"Member","group":"Member","date":"19/06","source":"WhatsApp","area":"Data Science","subcategory":"Accuracy","classification":"Question","text":"The morning insight read 'pushing your focus time did this' for lower recovery, but I know my physical recovery was 45% and cognitive only 61%. Should it read: high focus time combined with lack of adequate sleep led to low recovery?","answer":"Yes, significant cognitive work combined with insufficient sleep led to lower recovery here. Team is working on making this clearer.","sensitive":"","notes":""},{"id":"WA-187","member":"Member","group":"Member","date":"18/06","source":"WhatsApp","area":"Hardware/Firmware","subcategory":"Sensor","classification":"Question","text":"I hope it's allowed to wear my Temple in sauna.","answer":"Yes, you can wear Temple in the sauna. You can also shower, run, and swim with it on. Just make sure to wipe the temple region with a tissue before sticking the device.","sensitive":"","notes":""},{"id":"WA-188","member":"Member","group":"Member","date":"19/06","source":"WhatsApp","area":"Data Science","subcategory":"Chewing Detection","classification":"Question","text":"Great job on auto-detection of meals — seems quite accurate from day 0, and the AI use in meal logging is super convenient. I wonder if meal info itself changes the entropy or brain flow?","answer":"The meal information itself doesn't drive changes in Entropy or Brain Flow. It's your body's response to the meal that does. The same meal can create different physiological responses in two different people — and even in the same person on different days.","sensitive":"","notes":""},{"id":"WA-190","member":"Member","group":"Member","date":"04/06","source":"WhatsApp","area":"Hardware/Firmware","subcategory":"Sensor","classification":"Question","text":"Quick question - is it water resistant?","answer":"Yes, water resistant up to 2m. Can't go diving but pools, showers, and steam are fine.","sensitive":"","notes":""},{"id":"WA-191","member":"Member","group":"Member","date":"15/06","source":"WhatsApp","area":"Product Team","subcategory":"Integrations & Notifications","classification":"Suggestion","text":"One area I think could become a real differentiator is helping users understand WHY certain outcomes occur. A short morning questionnaire could provide context: did you drink alcohol, work out after 8pm, eat late, travel? The devices give helpful summaries but bridging the gap between data and underlying drivers feels like a valuable opportunity.","answer":"Picked up — triggering an intuitive end-of-day journal prompting these questions. Whoop does this as well. Correlating suboptimal recovery with logged activities makes it actionable.","sensitive":"","notes":""},{"id":"WA-192","member":"Member","group":"Member","date":"15/06","source":"WhatsApp","area":"Science Team","subcategory":"Physical Metrics","classification":"Question","text":"The Physical Work metric — is it primarily driven by cardiovascular load, or does it also capture resistance/weight training? Even after gym sessions my physical work score remained relatively low.","answer":"Currently Physical Work is driven by active calories, computed using cardiovascular load and Entropy both. We are increasing the contribution of Entropy to better capture true load of Strength Training where nervous system load is higher than cardiovascular.","sensitive":"","notes":""},{"id":"WA-193","member":"Member","group":"Member","date":"18/06","source":"WhatsApp","area":"Product Team","subcategory":"Nutrition & Logging","classification":"Suggestion","text":"The morning insights could be more contextual with respect to supplements being taken and how they would reap benefits over a sustained dosage period.","answer":"We will make the insights on supplements better. Talking about calories here doesn't make sense.","sensitive":"","notes":""},{"id":"WA-194","member":"Member","group":"Member","date":"21/06","source":"WhatsApp","area":"Hardware/Firmware","subcategory":"Charger","classification":"Problem","text":"Charging case isn't working — Temple not charged. No light is blinking on the charge case. Tried with other cables and charger also.","answer":"Ran a check on the backend. Charger should be working now — try cleaning with tissue as advised by Karan.","sensitive":"","notes":""},{"id":"WA-195","member":"Member","group":"Member","date":"18/06","source":"WhatsApp","area":"Science Team","subcategory":"Focus","classification":"Question","text":"Does focus actually mean focus? My peaks are always during trading sessions. When I was playing chess and distracted, the reading was 40. At 80 I felt different. Is there science behind these numbers?","answer":"Focus means 'flow state'. Our usual focus doesn't get us there. It's standalone — no other metric needed in conjunction.","sensitive":"","notes":""},{"id":"WA-196","member":"Member","group":"Member","date":"22/06","source":"WhatsApp","area":"Adhesion","subcategory":"Tapes","classification":"Positive","text":"Played ~4 hours of cricket (full sweat), showered, swam, spa session — not even once did the device come off or feel loose. The waterproofing is impressive. Tape is extremely easy and quick to apply.","answer":"","sensitive":"","notes":""},{"id":"WA-197","member":"Member","group":"Member","date":"22/06","source":"WhatsApp","area":"Hardware/Firmware","subcategory":"Battery","classification":"Positive","text":"Battery life excellent — comfortably lasts ~2.5-3 days, charging from low to full takes almost an hour, very convenient.","answer":"","sensitive":"","notes":""},{"id":"WA-198","member":"Member","group":"Member","date":"22/06","source":"WhatsApp","area":"Science Team","subcategory":"Brain Flow","classification":"Question","text":"For Brain Flow, I often see comparisons like 'Top 10%' or 'Top 25%'. Would love to understand the benchmark population. Am I being compared to all users, similar age bracket, similar activity levels? Understanding the reference group would make comparisons more meaningful.","answer":"","sensitive":"","notes":""},{"id":"WA-199","member":"Member","group":"Member","date":"22/06–01/07","source":"WhatsApp+Slack","area":"Product Team","subcategory":"Insights & Coaching","classification":"Suggestion","text":"When the app highlights 'Your Best' or 'Your Highest' for a metric like Entropy, it would help to see the context — whether it was during sleep, exercise or recovery, and the associated event or time — to understand personal patterns.","answer":"","sensitive":"","notes":"Collapsed block (2 instances): WA-199, SL-032b"},{"id":"WA-200","member":"Member","group":"Member","date":"02/06","source":"WhatsApp","area":"Product Team","subcategory":"App & Home Experience","classification":"Problem","text":"It's not very intuitive to end a workout that you quick-started. I had to click a few times and use some brain power to figure it out. My intuition was to click the top pause icon but that just pauses and starts again.","answer":"Noted. Hearing this a lot from first time users. Will fix — leaves a bad first impression.","sensitive":"","notes":""},{"id":"WA-201","member":"Member","group":"Member","date":"02/06","source":"WhatsApp","area":"Product Team","subcategory":"App & Home Experience","classification":"Problem","text":"The login mechanism after you end the quick start session is not intuitive either. I thought when I click end and save that was it, but the workout kept going.","answer":"You need to save your workout as something. If you select an activity before, it saves straight up.","sensitive":"","notes":""},{"id":"WA-202","member":"Member","group":"Member","date":"04/06","source":"WhatsApp","area":"Tech","subcategory":"Notifications","classification":"Problem","text":"There is a bug — when my Temple is charged but I haven't yet put it on, it keeps notifying me to put it on every 5 minutes.","answer":"Getting fixed tonight. Sorry about this.","sensitive":"","notes":""},{"id":"WA-203","member":"Member","group":"Member","date":"17/06","source":"WhatsApp","area":"Science Team","subcategory":"Physical Metrics","classification":"Question","text":"I didn't understand what the target numbers for physical work and mental work are supposed to mean.","answer":"Based on your cognitive recovery from the night before and cognitive work trends, we set a target for cognitive work. Physical work works similarly keeping in mind physical recovery. Both targets are unbounded.","sensitive":"","notes":""},{"id":"WA-204","member":"Member","group":"Member","date":"17/06–01/07","source":"WhatsApp+Slack","area":"Product Team","subcategory":"Nutrition & Logging","classification":"Suggestion","text":"Meal logging is slow — you must wait for an image to fully upload before logging (it should happen in the background) — and editing a meal takes an unnecessary extra step (serving-size page first, then another tap for dish details). Separately, it would help to see charging-pod charge info in the app and to track the pod itself to avoid misplacing it.","answer":"Background image upload is going live (won't block logging); the meal-edit flow revamp is in the pipeline. Charging-pod charge info and pod tracking are both being looked into.","sensitive":"","notes":"Collapsed block (4 instances): WA-204, WA-209, SL-043b, SL-043c"},{"id":"WA-205","member":"Member","group":"Member","date":"17/06–01/07","source":"WhatsApp+Slack","area":"Product Team","subcategory":"Women's Health","classification":"Suggestion","text":"Period logging doesn't sync with Apple Health (so it lacks her past logs) and the logging UX is cumbersome — she'd want a 1-tap log with optional details. The flower graphic that wilts as the cycle progresses felt wrong, unempathetic and unnecessary.","answer":"Apple Health period sync is being checked; the flower imagery is being reconsidered for a better representation.","sensitive":"","notes":"Collapsed block (3 instances): WA-205, SL-043d, SL-043e"},{"id":"WA-206","member":"Member","group":"Member","date":"17/06","source":"WhatsApp","area":"Science Team","subcategory":"Entropy","classification":"Question","text":"What is the difference between 'peak' and 'best' for brain flow, and 'low' and 'best' for entropy?","answer":"BESTs are lifetime bests. On your first day they are the same as current values. Will solve this for Day 1 UX.","sensitive":"","notes":""},{"id":"WA-207","member":"Member","group":"Member","date":"17/06","source":"WhatsApp","area":"Hardware/Firmware","subcategory":"Device Body","classification":"Suggestion","text":"I wish there was an easier way to carry the tapes along. I have to find a pouch to carry it in.","answer":"We are making a pouch for the charger and also have a pocket for the tapes.","sensitive":"","notes":""},{"id":"WA-208","member":"Member","group":"Member","date":"17/06","source":"WhatsApp","area":"Hardware/Firmware","subcategory":"Charger","classification":"Question","text":"How do I know how much charge the charging box still has?","answer":"The crescent-shaped light: red = less than one complete charge, yellow = just more than 1 charge, white = more than 2 charges. Holds max 5 charges.","sensitive":"","notes":""},{"id":"WA-210","member":"Member","group":"Member","date":"21/06","source":"WhatsApp","area":"Tech","subcategory":"App Crashes","classification":"Problem","text":"I started a workout at 1:30pm on my Temple but somehow the workout didn't start until much later. Not sure what went wrong.","answer":"When you started Strength Training and landed on the confirmation screen, you may have missed pressing Start Activity and the app went to background. Only when app was reopened at 2:04pm was the activity recorded.","sensitive":"","notes":""},{"id":"WA-211","member":"Member","group":"Member","date":"22/06–01/07","source":"WhatsApp+Slack","area":"Data Science","subcategory":"Calorie Tracking","classification":"Problem","text":"Calorie figures don't match the food's own label — including near-zero calories for 10 almonds or pistachios, and mismatches even when a label photo is provided.","answer":"Root cause was a unit issue: 'almonds' logged as a default 'serving' (~15g handful) overstated calories, and the user's downward edit was saved as a per-gram preference, so a later 'pieces' entry pulled values to ~0. Fixed by tagging countable items as 'piece' and clearing the bad saved macros; the prompt now also reads macros from the label image, not just typed text.","sensitive":"","notes":"Collapsed block (3 instances): WA-211, SL-018, SL-030"},{"id":"WA-212","member":"Member","group":"Member","date":"21/06","source":"WhatsApp","area":"Adhesion","subcategory":"Tapes","classification":"Positive","text":"Played water polo from 11am-12:42pm. The tape held up perfectly. The device performed as usual despite multiple duckings in water and swimming. Went down to 11ft/3.35m three times. Impressive.","answer":"","sensitive":"","notes":""},{"id":"WA-213","member":"Member","group":"Member","date":"13/06","source":"WhatsApp","area":"Science Team","subcategory":"Entropy","classification":"Positive","text":"the member: Reframing sleep from architecture (state, duration) to nighttime energy expenditure (metabolic spend at night) is an interesting angle. Two people labeled with 'moderate sleep apnea' might have different costs for their apneic events, requiring different protocols.","answer":"","sensitive":"","notes":""},{"id":"WA-214","member":"Member","group":"Member","date":"02/06","source":"WhatsApp","area":"Data Science","subcategory":"Accuracy","classification":"Problem","text":"Device is in my pocket but readings are actively coming through. Shouldn't be tracking when not on the body.","answer":"Known issue. It starts tracking from other body parts but the readings are incorrect. Being solved soon.","sensitive":"","notes":""},{"id":"WA-215","member":"Member","group":"Member","date":"25/05","source":"WhatsApp","area":"Adhesion","subcategory":"Skin Issues","classification":"Problem","text":"Woke up this morning with a little discomfort or stress on the temple area — felt like removing the device to feel relief (didn't though). Also seeing some building veins around the temple on either side of the head.","answer":"Haven't seen this ever. Doesn't seem like it's related to Temple. Remove it and charge it anyway and wear it again.","sensitive":"TRUE","notes":""},{"id":"WA-217","member":"Member","group":"Member","date":"14/06","source":"WhatsApp","area":"Product Team","subcategory":"Integrations & Notifications","classification":"Suggestion","text":"the member: API integration with Peloton/Technogym/Wattbike to look at actual work done (watts) compared to cerebral measurement could expose a trainable target. A 'decoupling index' between peripheral and cerebral performance might be predictive of physiological or pathological processes.","answer":"","sensitive":"","notes":""},{"id":"WA-218","member":"Member","group":"Member","date":"18/06","source":"WhatsApp","area":"Hardware/Firmware","subcategory":"Sensor","classification":"Question","text":"Someone at the gym mentioned radiation from Temple that's apparently banned in the US. He asked whether the device has necessary approvals.","answer":"We have acquired all required certifications in USA and India, and are getting EU-based one next week. Our EMF radiation (SAR) levels are well below the thresholds these certifications require.","sensitive":"","notes":""},{"id":"WA-219","member":"Member","group":"Member","date":"19/06","source":"WhatsApp","area":"Hardware/Firmware","subcategory":"Device Body","classification":"Suggestion","text":"Small suggestion — could we provide a compact carrying case for the grips, similar to a mint strips box? The current black cuboid case is a bit bulky and I've started misplacing the loose grip pieces.","answer":"Good idea. Will work on it.","sensitive":"","notes":""},{"id":"WA-220","member":"Member","group":"Member","date":"31/05","source":"WhatsApp","area":"Science Team","subcategory":"Entropy","classification":"Question","text":"Really enjoying using the temple! Is there any explanation around what Entropy means and what it calculates? Same for Brain Flow?","answer":"Entropy is the effort your body is making to keep you alive right now — it calculates the total real time physiological load of the body. Brain flow is the total amount of blood flowing to your brain at a certain moment. All healthy habits lead to higher brain flow, unhealthy habits lead to lower brain flow.","sensitive":"","notes":""},{"id":"WA-221","member":"Member","group":"Member","date":"06/06","source":"WhatsApp","area":"Hardware/Firmware","subcategory":"Device Body","classification":"Negative","text":"People are looking at me thinking what he's wearing! 😂","answer":"People from the future — that's the comment I get a lot 😂","sensitive":"","notes":""},{"id":"WA-222","member":"Member","group":"Member","date":"06/06","source":"WhatsApp","area":"Support","subcategory":"Onboarding","classification":"Question","text":"What do we say at the airport or when they ask about the device?","answer":"It's a health tracker. If they say take it off, say you can't take it off. Should work. Carry a few tapes with you just in case.","sensitive":"","notes":""},{"id":"WA-223","member":"Member","group":"Member","date":"07/06","source":"WhatsApp","area":"Data Science","subcategory":"Sleep Tracking","classification":"Positive","text":"In airport didn't get any pthe memberlem — that's cool. I slept bad and the app shows everything correctly.","answer":"","sensitive":"","notes":""},{"id":"WA-224","member":"Member","group":"Member","date":"13/06","source":"WhatsApp","area":"Science Team","subcategory":"Entropy","classification":"Question","text":"I liked it in general, it's really good. Can you explain a little bit more about Entropy and Brain Flow?","answer":"Entropy, or Burn Rate, is the real cost of being alive — the energy your body spends every moment, whether from movement, stress, or just keeping you functioning. Brain Flow is an index reflecting how well blood is reaching your brain — essential for cognition, sleep, stress response, and mental performance.","sensitive":"","notes":""},{"id":"WA-225","member":"Member","group":"Member","date":"13/06","source":"WhatsApp","area":"Hardware/Firmware","subcategory":"Battery","classification":"Problem","text":"Didn't wear it last 2 days because of charge issues and travel fights.","answer":"","sensitive":"","notes":""},{"id":"WA-226","member":"Member","group":"Member","date":"15/06","source":"WhatsApp","area":"Support","subcategory":"Device Replacement","classification":"Problem","text":"Devices decommissioned due to security reasons — replacement devices being sent.","answer":"Sending replacement devices with necessary security enhancements.","sensitive":"","notes":""},{"id":"WA-228","member":"Member","group":"Member","date":"31/05","source":"WhatsApp","area":"Hardware/Firmware","subcategory":"Connectivity","classification":"Problem","text":"The device isn't pairing again — have been trying to pair all week. Got a new iPhone so maybe that's part of the issue. Both devices not pairing.","answer":"Checking this. Should not happen. The issue was heat short circuit from the sauna — device was held in hand after falling off, causing the charger and device to fail.","sensitive":"","notes":""},{"id":"WA-229","member":"Member","group":"Member","date":"31/05","source":"WhatsApp","area":"Hardware/Firmware","subcategory":"Heating","classification":"Problem","text":"Device fell off in the dry sauna and I held it in hand. Ever since then the charger light turned green and it stopped charging. Possibly a heat short circuit.","answer":"Temple only works in sauna if it stays on the temple because the temple area cools the device. Holding it in hand in the sauna caused a heat short circuit. Replacement being sent.","sensitive":"TRUE","notes":""},{"id":"WA-230","member":"Member","group":"Member","date":"22/05","source":"WhatsApp","area":"Data Science","subcategory":"Calorie Tracking","classification":"Problem","text":"When the image description has the calories printed on packaging, the app is still approximating and showing a lower amount instead of reading from the label.","answer":"We'll handle packaged foods — AI will now check if the image has a calorie label and use that value directly.","sensitive":"","notes":""},{"id":"WA-231","member":"Member","group":"Member","date":"22/05","source":"WhatsApp","area":"Tech","subcategory":"UI/UX","classification":"Problem","text":"Text overlap in the UI — numbers overlapping in one of the chart screens.","answer":"Fixed the overlap issue in the next immediate release. Update will reflect on Testflight early AM tomorrow.","sensitive":"","notes":""},{"id":"WA-232","member":"Member","group":"Member","date":"22/05","source":"WhatsApp+Slack","area":"Product Team","subcategory":"Device & Metrics","classification":"Suggestion","text":"Two requests: an hourly trend chart for Physical and Cognitive work (like the focus chart) to review what drove changes; and a clearer charger charge-level indicator, since the LED wasn't intuitive to interpret.","answer":"The trend chart is being shipped shortly. The charger LED currently means white = more than one full charge, yellow = less than one, red = empty; the charger doesn't relay state to the app, so a clearer indicator is planned for later versions.","sensitive":"","notes":"Collapsed block (2 instances): WA-232, SL-093"},{"id":"WA-233","member":"Member","group":"Member","date":"23/05","source":"WhatsApp","area":"Science Team","subcategory":"Brain Flow","classification":"Question","text":"Would be good to explain the new Brain Flow categorisations — is it top 25% amongst Temple users or within my own data range?","answer":"Categorisation is based on your age cohort. Release going next week where you will be able to see the age buckets and ranges.","sensitive":"","notes":""},{"id":"WA-234","member":"Member","group":"Member","date":"23/05","source":"WhatsApp","area":"Data Science","subcategory":"Calorie Tracking","classification":"Problem","text":"Something feels off with the active calories algorithm. Was at the airport with 5000+ steps today but showing only 34 active calories total. Wonder if it's related to the firmware update.","answer":"There was some undercounting prior to the FW upgrade. Changes have been made to capture a wider range of activities. Further refinements are planned.","sensitive":"","notes":""},{"id":"WA-235","member":"Member","group":"Member","date":"23/05","source":"WhatsApp","area":"Hardware/Firmware","subcategory":"Charger","classification":"Question","text":"Charging case — are there visible signals when the case is fully charged? It was plugged in for at least 5 hours and continues to have the pulsing light. Not sure if it's still charging or done.","answer":"The charger is possibly charged but not able to reach a certain threshold for it to go to a steady persistent state. It should still be able to charge your Temple. Raised to the team.","sensitive":"","notes":""},{"id":"WA-236","member":"Member","group":"Member","date":"25/05","source":"WhatsApp","area":"Tech","subcategory":"Sync & Data","classification":"Problem","text":"Best Entropy showed as 10 when data was syncing and then became 16. The intermediate sync value got recorded as the best — shouldn't trying to edit the time, it says successfully saved but isn't getting captured. The Save button looks inactive while editing.","answer":"Need to tap Done button on the timer selector after editing the time. Removing the need for Done button — fixing Save button handling too.","sensitive":"","notes":""},{"id":"WA-241","member":"Member","group":"Member","date":"05/06","source":"WhatsApp","area":"Hardware/Firmware","subcategory":"Battery","classification":"Problem","text":"Battery draining faster than usual — charged on Wednesday night and now at 20% 1.5 days later. Usually lasts 2 days but this feels faster.","answer":"Checking this.","sensitive":"","notes":""},{"id":"WA-242","member":"Member","group":"Member","date":"06/06","source":"WhatsApp","area":"Hardware/Firmware","subcategory":"Sensor","classification":"Problem","text":"Device entered error state with multiple PPG and IMU init failures. Device fell at end of tennis lesson — that might have triggered this.","answer":"Replacement being sent. The device shell expands in heat creating a gap between base plate and shell — water leakage into the device puffs the resin inside. Being solved.","sensitive":"","notes":""},{"id":"WA-243","member":"Member","group":"Member","date":"11/06","source":"WhatsApp","area":"Manufacturing","subcategory":"Packaging","classification":"Positive","text":"Received the new temple today — packaging looks great! QR code could look better though.","answer":"Getting rid of the QR code.","sensitive":"","notes":""},{"id":"WA-244","member":"Member","group":"Member","date":"19/06","source":"WhatsApp","area":"Tech","subcategory":"Sync & Data","classification":"Problem","text":"As soon as I put on the new device, entropy reading started at 4 and climbed over 8-10 seconds to 39 — the accurate reading. But the 4 has been recorded as my best entropy during calibration.","answer":"It's picked up the value during initial calibration. Will handle this.","sensitive":"","notes":""},{"id":"WA-245","member":"Member","group":"Member","date":"21/06","source":"WhatsApp","area":"Tech","subcategory":"Sync & Data","classification":"Problem","text":"Today's min Entropy shows 14 but doesn't appear anywhere on the graph. Daytime low on graph is around 20. Saw 14 for a second when I opened the app and it jumped to 30s instantly — feels like a calibration reading that got recorded.","answer":"Charts do 5-minute averages. Will check why min wasn't plotted in this case.","sensitive":"","notes":""},{"id":"WA-246","member":"Member","group":"Member","date":"21/06","source":"WhatsApp","area":"Manufacturing","subcategory":"Breakage","classification":"Problem","text":"The new Natural Titanium Temple broke as well — wore it just once and didn't do any heavy sweat activities or tennis.","answer":"Apologies for this. Shipping another Natural Titanium and arranging pickup. Seen this in a few cases and actively solving for it.","sensitive":"TRUE","notes":""},{"id":"WA-247","member":"Member","group":"Member","date":"20/05","source":"WhatsApp","area":"Tech","subcategory":"Sync & Data","classification":"Problem","text":"Temple lens loaded in the morning — I read it partially but then it vanished somehow and I can't find it anymore. Maybe a loader on the component will help.","answer":"It disappears when sleep offset gets revised. Handling this more elegantly in the upcoming release.","sensitive":"","notes":""},{"id":"WA-248","member":"Member","group":"Member","date":"20/05","source":"WhatsApp","area":"Product Team","subcategory":"Insights & Coaching","classification":"Problem","text":"Live data and the graph data aren't matching — for a new user data will always be missing and historical empty states are showing.","answer":"Charts plot on 5-minute intervals. Last data point is the last multiple of 5. Need to capture this better in the UI.","sensitive":"","notes":""},{"id":"WA-249","member":"Member","group":"Member","date":"24/05","source":"WhatsApp","area":"Hardware/Firmware","subcategory":"Battery","classification":"Problem","text":"Charged yesterday and it's at 9% already — battery draining too fast.","answer":"Auto activity detection running in the background was draining battery life. Fixed.","sensitive":"","notes":""},{"id":"WA-250","member":"Member","group":"Member","date":"25/05","source":"WhatsApp","area":"Science Team","subcategory":"Brain Flow","classification":"Question","text":"Still not able to figure how to use Brain Flow — it's at 80 now, how do I control or move it? The current value focus in the Brain Flow view could be improved — would be good to see how it's trending right now.","answer":"","sensitive":"","notes":""},{"id":"WA-251","member":"Member","group":"Member","date":"09/05","source":"WhatsApp","area":"Science Team","subcategory":"Entropy","classification":"Question","text":"Hthe memberng fun checking the metrics for now. I am assuming 7 days of data calibration?","answer":"2 days for core calibration. 2-7 is the last 5% tuning.","sensitive":"","notes":""},{"id":"WA-252","member":"Member","group":"Member","date":"09/05","source":"WhatsApp","area":"Data Science","subcategory":"Chewing Detection","classification":"Positive","text":"Loved the notification which came when we were eating to take a picture of the food.","answer":"","sensitive":"","notes":""},{"id":"WA-253","member":"Member","group":"Member","date":"09/05","source":"WhatsApp","area":"Data Science","subcategory":"Sleep Tracking","classification":"Question","text":"Will it capture naps? I took a 30 min nap during noon.","answer":"Right now sleep gets processed once a day. We capture naps but don't surface them yet — WIP.","sensitive":"","notes":""},{"id":"WA-254","member":"Member","group":"Member","date":"10/05","source":"WhatsApp","area":"Data Science","subcategory":"Calorie Tracking","classification":"Question","text":"By 9am total calories burned is showing 2013 kcal — how is this metric to be read? Whoop is showing 1008 cals till now.","answer":"We stack your entire day's basal calories upfront in the morning. Active calories get added on top as the day goes on. This is to make calorie deficit math easy — it's under active iteration.","sensitive":"","notes":""},{"id":"WA-255","member":"Member","group":"Member","date":"10/05–02/06","source":"WhatsApp+Slack","area":"Product Team","subcategory":"App & Home Experience","classification":"Suggestion","text":"Concerns that UI choices drive behthe memberour: the large calorie/deficit display nudges him to over-consume, and a low physical-effort goal made him feel he shouldn't have worked out — a display that adapts to lifestyle or goals would help. He also wants a Find My Temple option, and the firmware-upgrade banner looks like a warning and isn't obviously clickable.","answer":"The calorie/behthe memberour UI is under active iteration. Find My Temple is in the works. An Update button will be added to the firmware banner, with interim handling while moving to OTA.","sensitive":"","notes":"Collapsed block (4 instances): WA-255, WA-260, WA-267, SL-098"},{"id":"WA-256","member":"Member","group":"Member","date":"10/05","source":"WhatsApp","area":"Adhesion","subcategory":"Tapes","classification":"Problem","text":"Tape experience has been good. Comfort tape stuck through gym, sleep, face wash. Only during swimming it came off and I realised the device doesn't float — it sank to the floor.","answer":"Wipe the skin with a tissue before applying and press the device for 4 seconds. Even comfort shouldn't come out in pools for most skin types.","sensitive":"","notes":""},{"id":"WA-257","member":"Member","group":"Member","date":"11/05","source":"WhatsApp","area":"Science Team","subcategory":"Cognitive Metrics","classification":"Question","text":"I am not intuitively able to figure out what will help improve my cognitive recovery %. The current entropy and brain flow UI is a major differentiation — it's dynamic and you can see it in real time, leading to much higher engagement and open rate.","answer":"Cognitive recovery is a combination of time asleep, restorative sleep and sleep efficiency. Clicking on these metrics shows what affects them.","sensitive":"","notes":""},{"id":"WA-258","member":"Member","group":"Member","date":"11/05","source":"WhatsApp","area":"Science Team","subcategory":"Entropy","classification":"Question","text":"When chewing food, entropy goes up to jittery levels. Will keep observing.","answer":"Yes — motion-corrected entropy is coming soon.","sensitive":"","notes":""},{"id":"WA-259","member":"Member","group":"Member","date":"13/05","source":"WhatsApp","area":"Science Team","subcategory":"Physical Metrics","classification":"Question","text":"Physical work target was 10 yesterday and suddenly 6 today. Such a big variation for a recovery drop from 96% to 80%.","answer":"96% makes it go exponentially higher. Some things are linear, some exponential — all being brought to one scale. Active calories and physical work will be one unified system soon.","sensitive":"","notes":""},{"id":"WA-261","member":"Member","group":"Member","date":"13/05","source":"WhatsApp","area":"Hardware/Firmware","subcategory":"Battery","classification":"Problem","text":"Battery is currently lasting 48 hours.","answer":"Raw data collection is on for debugging right now. Will switch it off once stable — that will take battery to 3.5 days.","sensitive":"","notes":""},{"id":"WA-262","member":"Member","group":"Member","date":"13/05","source":"WhatsApp","area":"Data Science","subcategory":"Calorie Tracking","classification":"Problem","text":"Calorie calculation from food seems lower by 20-30% compared to ChatGPT and Gemini.","answer":"We use Gemini on the backend too — it returns different values each time. We manually override and check user history for consistency. Goal setting for calories coming soon.","sensitive":"","notes":""},{"id":"WA-263","member":"Member","group":"Member","date":"14/05","source":"WhatsApp","area":"Data Science","subcategory":"Accuracy","classification":"Problem","text":"Physical work captured much less than Whoop today — Whoop strain 8.2 by 9am, Temple 1.5.","answer":"Our data shows your heart rate today didn't go up much. Yesterday you spent 20 mins in zone 4/5, today you didn't. There was also a physical work bug found — getting this fixed.","sensitive":"","notes":""},{"id":"WA-264","member":"Member","group":"Member","date":"15/05","source":"WhatsApp","area":"Science Team","subcategory":"Cognitive Metrics","classification":"Question","text":"After the update, cognitive work metrics have dropped on what feels like a hethe memberer meeting-intensive day.","answer":"Meetings intensity is not the same as cognitive output — cognitive output is an outcome of focus. Crazy meetings don't usually lead to focus. Entropy is the stress signal here, 10x better than Whoop's HRV-based stress.","sensitive":"","notes":""},{"id":"WA-265","member":"Member","group":"Member","date":"15/05","source":"WhatsApp","area":"Science Team","subcategory":"Entropy","classification":"Positive","text":"At a party: my entropy is 150 — don't know if it's alcohol or just social pain 😂","answer":"","sensitive":"","notes":""},{"id":"WA-266","member":"Member","group":"Member","date":"17/05","source":"WhatsApp","area":"Hardware/Firmware","subcategory":"Connectivity","classification":"Problem","text":"Temple came off during snorkelling. After drying and re-wearing same tape, device is now asking me to reset user ID.","answer":"Never seen this message — checking. Don't reuse tapes after removal.","sensitive":"","notes":""},{"id":"WA-268","member":"Member","group":"Member","date":"18/05","source":"WhatsApp","area":"Manufacturing","subcategory":"Breakage","classification":"Problem","text":"Device opened from one side and not connecting — feels bloated with moisture after scuba diving to 10 meters.","answer":"Device is defunct from water pressure at depth. Replacement being sent. Testing waterproofing under pressure — currently no wearable is scuba-approved except Apple Watch Ultra.","sensitive":"TRUE","notes":""},{"id":"WA-269","member":"Member","group":"Member","date":"25/05","source":"WhatsApp","area":"Data Science","subcategory":"Accuracy","classification":"Problem","text":"For a similar workout session, physical work and active calories are suddenly far higher than my averages — equations seem to be changing.","answer":"Active calories are being tuned as we speak. 80 calories = 1 physical work currently, moving to 40 calories = 1 to align closer to Whoop strain scale.","sensitive":"","notes":""},{"id":"WA-270","member":"Member","group":"Member","date":"27/05","source":"WhatsApp","area":"Tech","subcategory":"Sync & Data","classification":"Question","text":"Why do we need to open the app to sync? Should it not auto-sync whenever the phone is close?","answer":"Yes, you're right — team is already working on it.","sensitive":"","notes":""},{"id":"WA-271","member":"Member","group":"Member","date":"28/05","source":"WhatsApp","area":"Tech","subcategory":"Sync & Data","classification":"Problem","text":"App connectivity is taking a lot of time — been 3 minutes on connecting, had to shut down twice.","answer":"Connected and synced now — investigating why it took so long.","sensitive":"","notes":""},{"id":"WA-272","member":"Member","group":"Member","date":"29/05","source":"WhatsApp","area":"Tech","subcategory":"Sync & Data","classification":"Problem","text":"App suddenly saying I did not wear Temple yesterday — incorrect state.","answer":"Incorrect state shown intermittently when day-end summary computation takes longer than expected. Team is fixing this.","sensitive":"","notes":""},{"id":"WA-273","member":"Member","group":"Member","date":"30/05","source":"WhatsApp","area":"Tech","subcategory":"Sync & Data","classification":"Problem","text":"App showing 0 cognitive work and focus charts are not available.","answer":"Upgrading to new firmware will fix it. New focus metric launching which replaces older focus charts.","sensitive":"","notes":""},{"id":"WA-274","member":"Member","group":"Member","date":"11/05","source":"WhatsApp","area":"Adhesion","subcategory":"Tapes","classification":"Problem","text":"Comfort tape did not stay during workout session. Athletic tape came off multiple times in an hour long workout even after applying sunscreen around (not under) the device.","answer":"Always use fresh tape on clean skin. Wipe a small patch before putting Temple, or do all skincare around it. Tapes are medical grade.","sensitive":"","notes":""},{"id":"WA-275","member":"Member","group":"Member","date":"13/05","source":"WhatsApp","area":"Product Team","subcategory":"Nutrition & Logging","classification":"Suggestion","text":"Spending 40 minutes a day on Temple app and hthe memberng so much fun — it's addictive. Would love to see protein and carb intake measured against ideal daily targets the way physical and cognitive work are shown.","answer":"This is a great idea — macro tracking against personal targets is on the roadmap.","sensitive":"","notes":""},{"id":"WA-276","member":"Member","group":"Member","date":"13/05","source":"WhatsApp","area":"Science Team","subcategory":"Physical Metrics","classification":"Problem","text":"Physical work target dropped from 10.2 to 3.9 today — it made me skip my workout.","answer":"Checking — physical recovery shows 56% on backend. All physical/cognitive work metrics being brought to one unified scale this week.","sensitive":"","notes":""},{"id":"WA-277","member":"Member","group":"Member","date":"13/05","source":"WhatsApp","area":"Science Team","subcategory":"Cognitive Metrics","classification":"Positive","text":"The realisation that a full day in the office engaged doesn't always lead to high quality cognitive output.","answer":"","sensitive":"","notes":""},{"id":"WA-278","member":"Member","group":"Member","date":"18/05","source":"WhatsApp","area":"Adhesion","subcategory":"Skin Issues","classification":"Problem","text":"Athletic tape leaves skin irritated and red on removal. Also does the device measure physical activity in water? Spent 2 hours in water but physical activity only shows 2.5 corresponding to steps on land.","answer":"Athlete tapes have been reported to leave residue on skin. New comfort tape design with better adhesion for oily skin coming. For water activity — heart rate was not elevated enough to register significant physical work.","sensitive":"TRUE","notes":""},{"id":"WA-279","member":"Member","group":"Member","date":"25/05","source":"WhatsApp","area":"Tech","subcategory":"Notifications","classification":"Problem","text":"Too many 'you are doing an activity' notifications in the last 2-3 days even when just going about regular day.","answer":"Team is actively working on fixing this. Activity detection now only triggers after 20 minutes of continuous activity.","sensitive":"","notes":""},{"id":"WA-280","member":"Member","group":"Member","date":"04/06","source":"WhatsApp","area":"Adhesion","subcategory":"Tapes","classification":"Problem","text":"Tape issue is a daily struggle — doesn't last more than 15 hours at best.","answer":"Sending new tapes with better hold.","sensitive":"","notes":""},{"id":"WA-281","member":"Member","group":"Member","date":"07/06","source":"WhatsApp","area":"Adhesion","subcategory":"Tapes","classification":"Problem","text":"New tape is worse than comfort — slightest moisture or sweat and it starts slipping down.","answer":"Got it — comfort tape remains the better universal option. New comfort tape with improved adhesion for oily skin is coming.","sensitive":"","notes":""},{"id":"WA-282","member":"Member","group":"Member","date":"16/06","source":"WhatsApp","area":"Hardware/Firmware","subcategory":"Battery","classification":"Problem","text":"Device needing a recharge in less than 48 hours.","answer":"Started using device at 60% charge which brought it to 16% over 1.5 days — that's normal. Planning to display battery percentage on home page at all times.","sensitive":"","notes":""},{"id":"SL-001","member":"Member","group":"Member","date":"02/07","source":"Slack","area":"Data Science","subcategory":"Calorie Tracking","classification":"Problem","text":"Food photo logged all 6 dishes on the plate (incl. others' food and a partially-framed dish) though the text prompt named only 3; wants image scope to respect the text and/or exclude partial items.","answer":"Team aligned: not picking partial food items makes sense (will implement). Text is often supporting context for the image, so silently removing items not named in text could confuse; evaluating a 'selection wand' to let users pick an image region to process.","sensitive":"","notes":""},{"id":"SL-002a","member":"Member","group":"Member","date":"02/07","source":"Slack","area":"Product Team","subcategory":"Insights & Coaching","classification":"Suggestion","text":"App/onboarding suggestions: pairing screen should show only unpaired devices; Day 1 single Entropy card is underwhelming — add Day 1-3 guided onboarding under the Entropy card (what the number means; how to use Entropy for workouts/sleep/recovery); Day 3 celebrate new highs/lows; Day 7 prompt logging; add a 'so what'/longevity framing; Focus should link screen time (brain-rot use case); each metric should state its uniqueness/accuracy.","answer":"","sensitive":"","notes":"From SL-002 onboarding note."},{"id":"SL-002b","member":"Member","group":"Member","date":"02/07","source":"Slack","area":"Science Team","subcategory":"Entropy","classification":"Suggestion","text":"Entropy metric feedback: preferred definition is 'real-time energy cost for keeping physical systems in balance'; idle average of 15 weakens the reduction game; the 'Zen' tag reads as mental/mood, not metabolic (felt wrong while driving).","answer":"","sensitive":"","notes":"From SL-002 onboarding note."},{"id":"SL-002c","member":"Member","group":"Member","date":"02/07","source":"Slack","area":"Manufacturing","subcategory":"Color/Finish","classification":"Suggestion","text":"Device colour: wants a framework to help choose a colour; prefers Aged Bronze as it best matches skin tone.","answer":"","sensitive":"","notes":"From SL-002 onboarding note."},{"id":"SL-003","member":"Member","group":"Member","date":"02/07","source":"Slack","area":"Product Team","subcategory":"App & Home Experience","classification":"Suggestion","text":"App should celebrate a user's Personal Best (max) Entropy.","answer":"Insights widget at the bottom of the dial can surface these PBs. Will also add PBs and other achievements to the activity card when it is linked.","sensitive":"","notes":""},{"id":"SL-004","member":"Member","group":"Member","date":"02/07","source":"Slack","area":"Hardware/Firmware","subcategory":"Connectivity","classification":"Problem","text":"Device stuck cycling through calibrating / off-body / failed firmware update / endless syncing.","answer":"Root cause: firmware 150 was slightly too large to install safely over-the-air on X.32-series devices; build checks didn't account for the extra install space. Affected devices auto-rolled back to last stable firmware (no loss of function). FW150 paused; optimised FW151 released to restore updates; build pipeline hardened. No L1 data impact; X.16-series unaffected.","sensitive":"","notes":"Root cause shared internally by Ankur Yadav (firmware 150)."},{"id":"SL-005","member":"Member","group":"Member","date":"02/07","source":"Slack","area":"Adhesion","subcategory":"Skin Issues","classification":"Problem","text":"Skin at the Temple application site has dried out and remains unhealed after 2 days despite switching sides.","answer":"Considered hydrocolloid adhesives but they weren't strong enough to hold during sweating/showering; acrylic-based PSAs may not resolve dryness for everyone. Under discussion.","sensitive":"TRUE","notes":"SENSITIVE — skin reaction."},{"id":"SL-006","member":"Member","group":"Member","date":"02/07","source":"Slack","area":"Tech","subcategory":"Sync & Data","classification":"Problem","text":"Fasting window still showed 10 hrs and didn't recompute after a lunch entry was added out of order (evening logged before lunch).","answer":"Confirmed; retroactively updating existing commentaries is hard — team to discuss how to handle re-computation of already-generated commentary.","sensitive":"","notes":"the member (existing member)."},{"id":"SL-007","member":"Member","group":"Member","date":"01/07","source":"Slack","area":"Tech","subcategory":"Sync & Data","classification":"Problem","text":"Morning Outlook did not generate despite overnight wear and refreshing.","answer":"Morning Outlook depends on a High Confidence Wake Signal (HCWS) triggered by movement after sleep-end; here the HCWS didn't fire due to a data lag. Bottleneck identified; permanent fix released; outlook now visible.","sensitive":"","notes":""},{"id":"SL-009a","member":"Member","group":"Member","date":"01/07","source":"Slack","area":"Product Team","subcategory":"Insights & Coaching","classification":"Suggestion","text":"Wants proactive Entropy-state nudges (breathing/meditation prompt when elevated; a push prompt when below daily Max); Temple Sense made more prominent or repositioned (easy to miss; echoed by another member); an evening wind-down prompt to lower overnight Entropy.","answer":"Points 1-3 already in the works.","sensitive":"","notes":"From SL-009. the member = existing member the member."},{"id":"SL-009b","member":"Member","group":"Member","date":"01/07","source":"Slack","area":"Data Science","subcategory":"Chewing Detection","classification":"Suggestion","text":"Chewing detection flags gum as eating; wants a 'Chewing Gum' tag to mark it neutral (no calories/meal log) instead of dismissing the prompt every time.","answer":"Fair — will implement.","sensitive":"","notes":"From SL-009."},{"id":"SL-010","member":"Member","group":"Member","date":"01/07","source":"Slack","area":"Data Science","subcategory":"Auto Workout","classification":"Problem","text":"Activity auto-detection lagged ~14 min vs Whoop (start 7:15pm; Whoop 7:18pm; Temple 7:29pm).","answer":"Motion was present from ~19:00 but HR (80-85 bpm) sat very close to sedentary HR (77 bpm), so detection didn't trigger; likely a warmup/walk before the game raised HR gradually.","sensitive":"","notes":""},{"id":"SL-011","member":"Member","group":"Member","date":"01/07","source":"Slack","area":"Data Science","subcategory":"Accuracy","classification":"Problem","text":"All metrics recorded incorrectly across a 1.5-hour workout, with fluctuating data capture.","answer":"A firmware update installed right as the workout started, overriding per-second duty cycling back to 5-minute cycling. Rare edge case at the transition between the update's non-interruptive and interruptive phases let the workout start; the reboot then reset the workout config. Fix to block workouts during that transition ships next release; alerting added for duty-cycle fallback during active workouts.","sensitive":"","notes":"the member existing member."},{"id":"SL-014","member":"Member","group":"Member","date":"01/07","source":"Slack","area":"Adhesion","subcategory":"Tapes","classification":"Problem","text":"Tape detached twice — after 70+ min of football in heat with heavy sweat, and again after a swim (device possibly applied without fully drying).","answer":"","sensitive":"","notes":"New member."},{"id":"SL-015","member":"Member","group":"Member","date":"01/07","source":"Slack","area":"Data Science","subcategory":"Auto Workout","classification":"Problem","text":"Swim data (calories) captured but the football session didn't register the same way.","answer":"Activity was processed as soon as an L1 packet arrived with timestamp >= activity end; a physical-output packet at 8:12am triggered premature processing, and remaining data at 8:21am wasn't applied. Activity recomputed as a stopgap; a hard check on latest steps/HR packet timestamps will be released.","sensitive":"","notes":"New member."},{"id":"SL-016","member":"Member","group":"Member","date":"29/06","source":"Slack","area":"Data Science","subcategory":"Auto Workout","classification":"Problem","text":"Gym session from 07:15 not surfaced as an auto-detected activity.","answer":"Workout was started at 7:36am but off-body was detected 8:22-8:34am; a >10-min off-body force-ends and discards the workout from being surfaced. Would have shown mid-workout if the app was opened. Building support to surface the partial recorded workout when duty-cycling ends due to a long off-body period.","sensitive":"","notes":"the member existing member."},{"id":"SL-017","member":"Member","group":"Member","date":"29/06","source":"Slack","area":"Adhesion","subcategory":"Skin Issues","classification":"Problem","text":"Recurring small bumpy rash at the application site; heals in a couple of days when left open but recurs despite alternating sides — skin not adapting. Requesting a gentler tape.","answer":"Investigating gentler skin-side tape options; unsure whether a variant gentler than current comfort tape adheres well enough. Preparing samples of Lohmann DM 22791 to trial on the current device/form factor; team to build a better understanding of skin maceration.","sensitive":"TRUE","notes":"SENSITIVE — recurring skin reaction. the member existing member."},{"id":"SL-019","member":"Member","group":"Member","date":"30/06","source":"Slack","area":"Science Team","subcategory":"Entropy","classification":"Question","text":"Entropy jumped from a ~30-40 baseline to ~80 on waking and ~120 in the day; querying whether old firmware (103.16.111) is the cause.","answer":"Old firmware relied on a wider signal band, more susceptible to artifacts, inflating readings. On the newer metric his baseline sits ~45-60 (vs ~80 waking) and peaks ~70 at meals/rest (vs ~120). Upgrade to firmware 139+ to move to the newer metric. His resting baseline is naturally higher than population averages, so a ~15-point post-meal delta reaching ~70 is expected for his profile.","sensitive":"","notes":"the member (existing member)."},{"id":"SL-021","member":"Member","group":"Member","date":"01/07","source":"Slack","area":"Data Science","subcategory":"Accuracy","classification":"Positive","text":"After comparing Temple vs a bicep-worn Whoop (not wrist), calorie figures now match; earlier discrepancy resolved.","answer":"Confirmed alignment on bicep comparison; loop closed.","sensitive":"","notes":"Resolution of a prior accuracy concern."},{"id":"SL-022b","member":"Member","group":"Member","date":"01/07","source":"Slack","area":"Product Team","subcategory":"Insights & Coaching","classification":"Positive","text":"In awe with Temple; values the deep, actionable insights on sleep quality/duration, daily available energy, and how day-to-day actions affect Entropy.","answer":"","sensitive":"","notes":"New positive from the member (distinct from WA-173)."},{"id":"SL-023","member":"Member","group":"Member","date":"02/07","source":"Slack","area":"Hardware/Firmware","subcategory":"Battery","classification":"Problem","text":"Full charge depletes within a day; a prior device lasted ~48 hours; no unusual activity beyond a heavy workout.","answer":"","sensitive":"","notes":"New member. Shared battery-life theme with several members this batch."},{"id":"SL-026","member":"Member","group":"Member","date":"01/07","source":"Slack","area":"Tech","subcategory":"Sync & Data","classification":"Problem","text":"Find My Temple last-known location stale (showed 1 day ago) despite a connection 2 hours earlier.","answer":"Occurs when background location isn't granted — last-seen updates on disconnect, but if the app is backgrounded and 'Always' location isn't allowed, iOS blocks the capture and the cached location goes stale. Fix: now fetch location on every app foreground, disconnect, and Find My page open; internal first, then customers.","sensitive":"","notes":"RG existing member; recurring Find My issue."},{"id":"SL-027","member":"Member","group":"Member","date":"24/06","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Problem","text":"Sleep split into two episodes (device off ~12:50am, back ~2:45am); only the later window shown, expected them merged.","answer":"Onset/offset model found two windows (22:00-00:41 and 02:47-06:27); the first was rejected by an HR sanity check by only ~0.1, so only the later window remained — not a circadian-merge failure. A new model (in shadow) captures the full period and is rolling out; episodes merged manually for RG and an HR-threshold buffer to be added.","sensitive":"","notes":"RG existing member."},{"id":"SL-028","member":"Member","group":"Member","date":"01/07","source":"Slack","area":"Data Science","subcategory":"Chewing Detection","classification":"Problem","text":"Three false chewing detections in a day.","answer":"Raw data was unavailable for these detections so they couldn't be debugged; chewing metrics now released on fw >=143 to allow analysis without raw data. A per-user chewing personalization algorithm is being tested (initially high recall, lower precision, tuned by feedback).","sensitive":"","notes":"the member existing member."},{"id":"SL-029","member":"Member","group":"Member","date":"01/07","source":"Slack","area":"Hardware/Firmware","subcategory":"Connectivity","classification":"Problem","text":"Device won't reconnect — in ship mode since 17 Jun, not seen in scanning; visible on Bluetooth but restart and unpair/re-pair didn't help.","answer":"Releasing a new app with added scanner visibility/changes; if that doesn't fix it, send a replacement and get the device back for in-person RCA. New app didn't fix it — device being recalled for RCA.","sensitive":"","notes":"the member existing member; device saga (SL-020, SL-035)."},{"id":"SL-031a","member":"Member","group":"Member","date":"22/06","source":"Slack","area":"Science Team","subcategory":"Brain Flow","classification":"Question","text":"Average and peak brain flow dropped when moving Temple from the right side to the left; wants approximate left-vs-right deltas.","answer":"Most people show <10-point left/right difference; a small subset shows asymmetry from physiological differences (still being investigated). For this user, average CBF (84) varied <=2 points across sides, p95 stayed 90-95 and p5 78-82 — stable regardless of side.","sensitive":"","notes":"From SL-031. the member existing member."},{"id":"SL-031b","member":"Member","group":"Member","date":"22/06","source":"Slack","area":"Science Team","subcategory":"Entropy","classification":"Question","text":"Sleep quality vs idle Entropy correlation is weaker than he expected.","answer":"","sensitive":"","notes":"From SL-031."},{"id":"SL-032a","member":"Member","group":"Member","date":"01/07","source":"Slack","area":"Product Team","subcategory":"Insights & Coaching","classification":"Suggestion","text":"Wants a pointer on the chart marking the moment of an exceptional low Entropy reading (value 2) so he can identify and replicate the context.","answer":"","sensitive":"","notes":"From SL-032. the member existing member."},{"id":"SL-034","member":"Member","group":"Member","date":"21/06","source":"Slack","area":"Data Science","subcategory":"Auto Workout","classification":"Problem","text":"On an older app version, the workout starts during the 3-2-1 countdown even when the phone is moved to the background.","answer":"The command is sent to the device as soon as Start Activity is tapped and the workout begins once the write succeeds; this is live for everyone on v1058, but she was on v1016 when reported.","sensitive":"","notes":"Fragmentary thread, low-confidence. SVG = the member (confirmed)."},{"id":"SL-035b","member":"Member","group":"Member","date":"21/06","source":"Slack","area":"Hardware/Firmware","subcategory":"Battery","classification":"Problem","text":"Battery life fell from ~3 days to ~36 hours.","answer":"Arranging a replacement device and recalling the unit for RCA; checked discharge pattern and whether ship mode was triggered by rapid discharge.","sensitive":"","notes":"From SL-035. Part of the member device saga (SL-029)."},{"id":"SL-036","member":"Member","group":"Member","date":"01/07","source":"Slack","area":"Science Team","subcategory":"Entropy","classification":"Problem","text":"Entropy minima not displaying on the chart.","answer":"Known min-max issue fixed in the new Entropy build already released to temple-all; rolling out to everyone.","sensitive":"","notes":"the member existing member."},{"id":"SL-039","member":"Member","group":"Member","date":"01/07","source":"Slack","area":"Science Team","subcategory":"Recovery Score","classification":"Suggestion","text":"Insight framing reads oddly: attributing low physical recovery to 'pushing focus time' alone; should combine high focus with insufficient sleep; positive key-insights conflict with 45% physical / 61% cognitive recovery; Temple Sense frames focus negatively.","answer":"Agreed the intended articulation was significant cognitive work + insufficient sleep leading to lower recovery; it didn't take that path due to tension between sleep sufficiency and (excess) REM. Will make the narrative more coherent and orient focus language more positively, accepting some trade-off in edge insights.","sensitive":"","notes":"the member existing member. Also touches Cognitive Metrics."},{"id":"SL-041","member":"Member","group":"Member","date":"19/06","source":"Slack","area":"Hardware/Firmware","subcategory":"Battery","classification":"Problem","text":"Battery lasted only ~2 days and the device discharged overnight without any alert.","answer":"Device found to have a rapid-discharge fault and was recalled; the member was advised to stop using it and given a spare device to continue. No data for the day as the device had discharged; charging/discharge cycles showed an anomaly.","sensitive":"TRUE","notes":"SENSITIVE candidate — rapid discharge, recall, advised to stop using device. the member Dubai = the member."},{"id":"SL-042","member":"Member","group":"Member","date":"19/06","source":"Slack","area":"Manufacturing","subcategory":"Packaging","classification":"Suggestion","text":"Wants a compact, purse-friendly carrying case holding 5-7 grips; current black box is bulky and grips get misplaced.","answer":"Current black box is sized for golden samples, hence the spare room. Exploring a small leather pouch / travel case for grips.","sensitive":"","notes":"the member existing member. Related to SL-020a (grip carry)."},{"id":"SL-047e","member":"Member","group":"Member","date":"01/07","source":"Slack","area":"Support","subcategory":"Onboarding","classification":"Positive","text":"Praised the onboarding experience and the product-outside=inside design as a rare, thoughtful touch.","answer":"","sensitive":"","notes":"From SL-047."},{"id":"SL-048a","member":"Member","group":"Member","date":"01/07","source":"Slack","area":"Product Team","subcategory":"App & Home Experience","classification":"Positive","text":"Temple is a great conversation starter across many people; has gotten used to wearing it habitually.","answer":"","sensitive":"","notes":"From SL-048. New member."},{"id":"SL-048b","member":"Member","group":"Member","date":"01/07","source":"Slack","area":"Product Team","subcategory":"Device & Metrics","classification":"Suggestion","text":"Removes the device at times for fear of losing it (it fell in a pool once) and forgets to put it back after charging; open to a two-Temple approach.","answer":"","sensitive":"","notes":"From SL-048."},{"id":"SL-048c","member":"Member","group":"Member","date":"01/07","source":"Slack","area":"Product Team","subcategory":"Insights & Coaching","classification":"Suggestion","text":"Finds the app a 'black box' — wants an in-app section on Temple's science / theory of change and per-metric explainers, especially Entropy.","answer":"Expectation confirmed as per-metric explainers, especially Entropy — sharing more information in-app about each
