am","subcategory":"Device & Metrics","classification":"Suggestion","text":"Asked about a two-device option (gets ~10 days from Whoop; charging every 2-3 days isn't ideal).","answer":"","sensitive":"","notes":"Two-Temple theme (SL-048b)."},{"id":"SL-081a","member":"Member","group":"Member","date":"","source":"Slack","area":"Data Science","subcategory":"Calorie Tracking","classification":"Problem","text":"Macros differ between the Health-app section and Temple for the same food.","answer":"","sensitive":"","notes":"From SL-081. the member existing."},{"id":"SL-081b","member":"Member","group":"Member","date":"","source":"Slack","area":"Data Science","subcategory":"Accuracy","classification":"Suggestion","text":"RHR/sleep/calories differ meaningfully from Whoop; wants in-app/bot material explaining why, to build trust.","answer":"","sensitive":"","notes":"From SL-081. Overlaps SL-048c (explainers)."},{"id":"SL-084","member":"Member","group":"Member","date":"","source":"Slack","area":"Data Science","subcategory":"Accuracy","classification":"Question","text":"Temple showed more calories burned than his Apple Watch (felt generous), post football + ice bath.","answer":"He wasn't actually wearing the Apple Watch; Temple showed 895 cal (~757 from 1.5h football with time in Zones 4-5, ~130 NEAT from ~11k steps). As a new user his sedentary HR baseline is still building.","sensitive":"","notes":"the member existing. Activity saga."},{"id":"SL-085a","member":"Member","group":"Member","date":"","source":"Slack","area":"Science Team","subcategory":"Entropy","classification":"Negative","text":"Couldn't watch Entropy continuously (became impractical) and couldn't correlate it the few times he did.","answer":"","sensitive":"","notes":"From SL-085. New member."},{"id":"SL-085b","member":"Member","group":"Member","date":"","source":"Slack","area":"Hardware/Firmware","subcategory":"Battery","classification":"Problem","text":"Battery life is low.","answer":"Working on stretching battery (optimising raw-data storage, reducing idle BLE consumption).","sensitive":"","notes":"From SL-085."},{"id":"SL-085c","member":"Member","group":"Member","date":"","source":"Slack","area":"Adhesion","subcategory":"Tapes","classification":"Suggestion","text":"A stencil is needed; he can't apply the sticker/tape properly each time.","answer":"Golden tape samples due mid-June.","sensitive":"","notes":"From SL-085."},{"id":"SL-085d","member":"Member","group":"Member","date":"","source":"Slack","area":"Adhesion","subcategory":"Tapes","classification":"Negative","text":"Putting the device on is an involved/complex process.","answer":"Golden tape samples with a stencil (for easier application) due mid-June.","sensitive":"","notes":"Split from SL-085 (the member onboarding feedback)."},{"id":"SL-089","member":"Member","group":"Member","date":"","source":"Slack","area":"Hardware/Firmware","subcategory":"Charger","classification":"Problem","text":"Charging issue — only the bottom LED flashed; after removing and retrying it charged continuously.","answer":"Loose connection / something on the contact pads causing interference; started working after reseating. Replacement device + charger shipped (he keeps the old one too).","sensitive":"","notes":"the member (the member & the member) existing."},{"id":"SL-097","member":"Member","group":"Member","date":"","source":"Slack","area":"Product Team","subcategory":"Device & Metrics","classification":"Suggestion","text":"Had to manually unlink the old (lost) device before connecting the replacement.","answer":"Expected behaviour currently, but device-switching should be made simpler (part of the multi-Temple use case).","sensitive":"","notes":"the member existing."},{"id":"SL-099","member":"Member","group":"Member","date":"","source":"Slack","area":"Tech","subcategory":"Android Bugs","classification":"Problem","text":"Device wasn't sending data / not connecting (Samsung A14, Android 14).","answer":"Android 14 GATT_133 Bluetooth-cache bug caused it to get stuck; mitigation = forget the Temple in Bluetooth settings and re-pair (clears the cache); data resumed. Google fixed this on Android 15; auto-recovery being worked on.","sensitive":"","notes":"the member existing (SL-080)."},{"id":"SL-105","member":"Member","group":"Member","date":"","source":"Slack","area":"Hardware/Firmware","subcategory":"Sensor","classification":"Question","text":"Device emits a visible red halo/glow at night (90-120 sec).","answer":"Not a failure — the red LED (currently only for SpO2, not used for Brain Flow/Entropy) is more evident on lighter skin at night; it can be switched off. Dynamic LED/TX control is coming next week (lower LED drive for lighter skin tones).","sensitive":"","notes":"the member existing."},{"id":"SL-106","member":"Member","group":"Member","date":"","source":"Slack","area":"Hardware/Firmware","subcategory":"Connectivity","classification":"Problem","text":"Firmware auto-downloaded then failed.","answer":"Upgrade failed due to a disconnection during upload; retrying fixes it for now. Silent OTA released in v1.1.0 (978).","sensitive":"","notes":"the member saga (SL-056/057/058/110)."},{"id":"SL-107","member":"Member","group":"Member","date":"","source":"Slack","area":"Data Science","subcategory":"Auto Workout","classification":"Problem","text":"Can't start an activity (run) after 5-7 tries on a new Android device; once logged, calories showed.","answer":"Workout Mode is blocked when the device is connecting/disconnected/off-body/calibrating; app-side events were missing so the exact state was unclear. Added the events and improved device-state handling on the Workout Mode entry screen.","sensitive":"","notes":"the member existing (SL-075/094)."},{"id":"SL-108","member":"Member","group":"Member","date":"","source":"Slack","area":"Tech","subcategory":"Sync & Data","classification":"Problem","text":"Device stopped connecting; after unlinking it became undiscoverable.","answer":"Worked again once he restarted ts; will tweak the design for a better solve.","sensitive":"","notes":"Customer unnamed; raised via the member."},{"id":"SL-181","member":"Member","group":"Member","date":"","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Problem","text":"Slept ~8 hours (woke once after 6 hours for a bathroom break), but Temple reported only ~1.5 hours of sleep (time in bed 1h51m, asleep 1h46m).","answer":"Accelerometer noise floor was unusually high through most of his sleep, suspected from very heavy snoring, causing incorrect sleep timings. Fixed in the new sleep algorithm (detected 1:47–7:52am); he'll be the first paid customer onto the updated algorithm.","sensitive":"","notes":"Follow-on: the member noted actual sleep from 00:48 onwards."},{"id":"SL-182","member":"—","group":"—","date":"","source":"Slack","area":"Product Team","subcategory":"App & Home Experience","classification":"Suggestion","text":"Need the ability to scroll through days on a metric's page by swiping left and right.","answer":"Noted; will incorporate.","sensitive":"","notes":"General App UX feedback, no attributed user."},{"id":"SL-183","member":"—","group":"—","date":"","source":"Slack","area":"Data Science","subcategory":"Calorie Tracking","classification":"Problem","text":"Food logging via voice isn't very accurate — could an AI transcriber be used instead of the phone's dictation model?","answer":"Currently using iPhone's SFSpeechRecognizer for meal logging. STT models lose specificity on proper nouns (meal/item names); Soniox/Deepgram are better options but need engineering to improve over time. Will check usage data first.","sensitive":"","notes":"General App UX feedback, no attributed user."},{"id":"SL-184","member":"Eternal (onboarding)","group":"Eternal (onboarding)","date":"09/07","source":"Slack","area":"Science Team","subcategory":"Entropy","classification":"Question","text":"Asked for the ideal ranges of Entropy min, idle and max.","answer":"","sensitive":"","notes":"Onboarding notes (Eternal), unnamed onboardee."},{"id":"SL-185","member":"Eternal (onboarding)","group":"Eternal (onboarding)","date":"09/07","source":"Slack","area":"Product Team","subcategory":"Insights & Coaching","classification":"Suggestion","text":"During profile creation, the device colour shown on the model image should match the colour of the user's own Temple.","answer":"","sensitive":"","notes":"Onboarding notes (Eternal), unnamed onboardee."},{"id":"SL-186","member":"Eternal (onboarding)","group":"Eternal (onboarding)","date":"09/07","source":"Slack","area":"Tech","subcategory":"App Crashes","classification":"Problem","text":"Birthdate scroller wasn't working while creating the profile; height & weight input didn't persist when switching between the two toggles.","answer":"Birthdate scroller to be fixed.","sensitive":"","notes":"Onboarding notes (Eternal), unnamed onboardee."},{"id":"SL-187","member":"Eternal (onboarding)","group":"Eternal (onboarding)","date":"09/07","source":"Slack","area":"Product Team","subcategory":"App & Home Experience","classification":"Suggestion","text":"Wants an 'incognito mode' where metrics tracked during partying/excess-substance situations don't influence weekly averages.","answer":"","sensitive":"","notes":"Onboarding notes (Eternal), unnamed onboardee."},{"id":"SL-188","member":"Eternal (onboarding)","group":"Eternal (onboarding)","date":"09/07","source":"Slack","area":"Science Team","subcategory":"Entropy","classification":"Suggestion","text":"Has hypothyroidism plus higher HRV and RHR (independent of thyroid); would be interesting to see if there's a correlation with his high Entropy. Also found Focus interesting as an artist and wants to track it.","answer":"","sensitive":"","notes":"Onboarding notes (Eternal), unnamed onboardee."},{"id":"SL-189","member":"—","group":"—","date":"","source":"Slack","area":"Science Team","subcategory":"Others","classification":"Positive","text":"Seeing behavioural changes in how they think about fitness — now monitoring and optimising for range and recovery of most metrics, and seeing improvement, rather than just calorie burn and steps.","answer":"","sensitive":"","notes":"General positive feedback, unnamed."},{"id":"SL-190","member":"—","group":"—","date":"","source":"Slack","area":"Data Science","subcategory":"Calorie Tracking","classification":"Positive","text":"The meal logging is magical and very intuitive — loves it, says everyone should copy the flow.","answer":"","sensitive":"","notes":"General positive feedback, unnamed."},{"id":"SL-191","member":"—","group":"—","date":"","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Suggestion","text":"When typing a prompt in Sense, the first letter of a sentence (and after a full stop) should auto-capitalise.","answer":"Will handle in the next release using the user's iPhone auto-capitalisation preference.","sensitive":"","notes":"General App UX feedback, no attributed user."},{"id":"SL-192","member":"—","group":"—","date":"","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Problem","text":"The highlighted (clickable) sections in the Entropy card aren't read as clickable — 'they aren't highlighted enough.'","answer":"Already in dev; being shipped as boxes to indicate tappability.","sensitive":"","notes":"General App UX feedback, no attributed user."},{"id":"SL-193","member":"Member","group":"Member","date":"","source":"Slack","area":"Tech","subcategory":"App Crashes","classification":"Problem","text":"Can't access the Sense chat anymore.","answer":"Caused by a failure in the experimentation service used for feature rollout; since Sense is enabled for all, the experiment dependency is being removed and an 'enabled for all' flag switched on. Fixed live — kill and reopen the app to access Sense.","sensitive":"","notes":""},{"id":"SL-194","member":"Member","group":"Member","date":"","source":"Slack","area":"Science Team","subcategory":"Entropy","classification":"Question","text":"After the gym, riding to office on his bike, Entropy is showing too low — is that expected?","answer":"","sensitive":"","notes":""},{"id":"SL-195","member":"Member","group":"Member","date":"","source":"Slack","area":"Data Science","subcategory":"Accuracy","classification":"Suggestion","text":"For a new user, insights comparing the last day's metrics to their own averages don't make sense until a baseline exists — maybe compare to population averages until then.","answer":"Agreed — shouldn't show baselines until one exists; may use population data for general commentary but not as a shown baseline.","sensitive":"","notes":"Name taken from thread (the member reply); now added to mapping."},{"id":"SL-196","member":"Member","group":"Member","date":"11/07","source":"Slack","area":"Hardware/Firmware","subcategory":"Heating","classification":"Problem","text":"During a sauna session (~1:30pm) the customer felt the device heat up; asked to check device temperature.","answer":"","sensitive":"TRUE","notes":"SENSITIVE candidate — heat/burn class. Sauna session; device temp check requested."},{"id":"SL-197","member":"Member","group":"Member","date":"11/07","source":"Slack","area":"Data Science","subcategory":"Auto Workout","classification":"Problem","text":"Retrospectively logged a Sauna workout (1:30–2:00pm), but the device was taken off at 1:36pm so it went off-body; the workout only had data for 1:30–1:36 and should show the remaining ~24 min as off-body since it was explicitly logged.","answer":"Possibly an app-side issue dropping off-body points; to confirm.","sensitive":"","notes":"Same sauna session as SL-196."},{"id":"SL-198","member":"—","group":"—","date":"11/07","source":"Slack","area":"Product Team","subcategory":"Integrations & Notifications","classification":"Question","text":"Asked whether Temple has an MCP so they can connect their data with Claude — wants everything except the AI to connect to their pre-existing Claude setup (to combine Temple data with other health data like blood reports/scans).","answer":"Niche 'hands-on' use case; Temple Sense already serves these use cases via its own AI + data orchestration. Not doing MCPs anytime soon.","sensitive":"","notes":"General feature question, unnamed customer."},{"id":"SL-199","member":"Member","group":"Member","date":"12/07","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Problem","text":"Wore Temple as usual overnight but it didn't generate a sleep study; during the day it alternated between showing stats and 'calibrating'; and for the past two days it says 'temple off body' while it's on.","answer":"Edge-case bug in on-body computation: when the app moved between foreground and background, on-body detection dropped from every second to once every 5 seconds, corrupting the detection-vote sequencing so it couldn't confirm on-body. Fixed in stable-161 firmware (computation now always runs every second).\n\n[Update 12/07]: Edge-case on-body computation bug: when the app moved between foreground/background, on-body detection dropped from every second to once every 5 seconds, corrupting the sequencing of detection votes so it couldn't collect enough positive votes to confirm on-body. Fixed in stable-161 firmware — computation now always runs every second regardless of app state.","sensitive":"","notes":""},{"id":"SL-200","member":"Member","group":"Member","date":"12/07","source":"Slack","area":"Data Science","subcategory":"Accuracy","classification":"Problem","text":"The device counts steps while just moving the head — are these noise/false positives not being filtered out?","answer":"No immediate solution; ideating on improvements. Needs labelled data to handle step signatures across basketball, football, tennis, badminton, etc.\n\n[Update 12/07]: No immediate solution — ideating on improvements. Needs labelled data to handle step signatures across basketball, football, tennis, badminton, etc.","sensitive":"","notes":""},{"id":"SL-201","member":"Non-Eternal (onboarding)","group":"Non-Eternal (onboarding)","date":"","source":"Slack","area":"Manufacturing","subcategory":"Color/Finish","classification":"Positive","text":"Preferred the Natural Titanium finish for its subtle, non-glossy appearance; praised the lightweight, sleek form factor — can't feel it once on.","answer":"","sensitive":"","notes":"Onboarding notes, Non-Eternal user (unnamed)."},{"id":"SL-202","member":"Non-Eternal (onboarding)","group":"Non-Eternal (onboarding)","date":"","source":"Slack","area":"Hardware/Firmware","subcategory":"Battery","classification":"Positive","text":"An Apple Watch user who doesn't wear it overnight due to charging; the 3-4 day battery life was a major positive.","answer":"","sensitive":"","notes":"Onboarding notes, Non-Eternal user (unnamed)."},{"id":"SL-203","member":"Non-Eternal (onboarding)","group":"Non-Eternal (onboarding)","date":"","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Suggestion","text":"Has used multiple sleep trackers and notes their data doesn't always match how they actually feel; waking rested but being told they slept poorly (or vice versa) is confusing and makes them question their own perception.","answer":"","sensitive":"","notes":"Onboarding notes, Non-Eternal user (unnamed)."},{"id":"SL-204","member":"Member","group":"Member","date":"10/07","source":"Slack","area":"Adhesion","subcategory":"Tapes","classification":"Problem","text":"Over-sweating causes the Temple to come off — happened twice since yesterday (during a brisk walk and while cooking); the grip was applied last night and came off in the morning while cooking. Following all application steps (dry tissue to wipe area, etc.).","answer":"[Update 10/07]: Device came off over the weekend during a subsequent group onboarding session; new grips being sent for the customer to test.","sensitive":"","notes":"Relayed via the member to Padmalaya."},{"id":"SL-205","member":"Member","group":"Member","date":"12/07","source":"Slack","area":"Tech","subcategory":"App Crashes","classification":"Problem","text":"App crashed — asked to check.","answer":"Being checked.\n\n[Update 12/07]: Race condition while the app was scanning for devices. Fix in next release; low-frequency crash (2 users in the past 7 days) — customer can keep using the current app in the meantime.","sensitive":"","notes":""},{"id":"SL-206","member":"Eternal (onboarding)","group":"Eternal (onboarding)","date":"","source":"Slack","area":"Science Team","subcategory":"Entropy","classification":"Positive","text":"Did not renew Whoop to try Temple; recent blood work showed a few markers outside normal range, which probably resulted in an elevated Idle Entropy.","answer":"","sensitive":"","notes":"Onboarding notes, Eternal User 1 (unnamed)."},{"id":"SL-207","member":"Eternal (onboarding)","group":"Eternal (onboarding)","date":"","source":"Slack","area":"Science Team","subcategory":"Entropy","classification":"Positive","text":"First-time health-wearable user, previously used Apple Watch mainly for notifications/calls; especially excited about Entropy — initially felt it was 'too good to be true' and is curious to validate its usefulness.","answer":"","sensitive":"","notes":"Onboarding notes, Eternal User 2 (unnamed)."},{"id":"SL-208","member":"Eternal (onboarding)","group":"Eternal (onboarding)","date":"","source":"Slack","area":"Data Science","subcategory":"GPS/Distance","classification":"Suggestion","text":"Regular runner currently on Garmin; requested run-distance tracking. Highly interested in Entropy and felt recent poor sleep contributed to elevated Idle Entropy; plans to experiment by observing changes after recovery and during workouts.","answer":"","sensitive":"","notes":"Onboarding notes, Eternal User 3 (unnamed)."},{"id":"SL-209","member":"Eternal (onboarding)","group":"Eternal (onboarding)","date":"","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Suggestion","text":"Requested larger font sizes for readability; felt meal logging and nutrition insights should be surfaced more prominently as a core capability. Especially impressed by Sense proactively analysing health data and surfacing insights, and appreciated the premium feel and design of the charger.","answer":"","sensitive":"","notes":"Onboarding notes, Eternal User 4 (unnamed)."},{"id":"SL-210","member":"Member","group":"Member","date":"12/07","source":"Slack","area":"Product Team","subcategory":"App & Home Experience","classification":"Suggestion","text":"Wants a persistent sticky icon for the Sense AI chatbot across Entropy and Sleep tabs — currently has to return to the home page every time to use it.","answer":"Adding chat icon across all pages except side menu/settings, meal-log input, and live-activity page; screen-context awareness coming next.","sensitive":"","notes":""},{"id":"SL-211","member":"Member","group":"Member","date":"10/07","source":"Slack","area":"Science Team","subcategory":"Brain Flow","classification":"Positive","text":"Amazed at how high Brain Flow can go (the member hit 120); excited to try to hit peaks; wants more ways to actively raise Brain Flow.","answer":"","sensitive":"","notes":"From the member onboarding session 10/07."},{"id":"SL-212","member":"Member","group":"Member","date":"10/07","source":"Slack","area":"Science Team","subcategory":"Entropy","classification":"Positive","text":"Pleasantly surprised by how approachable Entropy is; both users had high Idle Entropy attributed to poor sleep the night before and were impressed the number reflected their state accurately. Keen to explore ways to bring Min down.","answer":"","sensitive":"","notes":"From the member onboarding session 10/07."},{"id":"SL-213","member":"Member","group":"Member","date":"10/07","source":"Slack","area":"Science Team","subcategory":"Others","classification":"Positive","text":"Loved the Sleep tracking and Temple Sense.","answer":"","sensitive":"","notes":"From the member onboarding session 10/07."},{"id":"SL-214","member":"Member","group":"Member","date":"10/07","source":"Slack","area":"Manufacturing","subcategory":"Color/Finish","classification":"Suggestion","text":"Requested a different device colour — already being sent.","answer":"","sensitive":"","notes":"From the member onboarding session 10/07."},{"id":"SL-215","member":"Member","group":"Member","date":"14/07","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Problem","text":"Idle Entropy showing higher than Maximum on the biomonitor. Calories In reset when the clock hit 00:00 but Calories Out did not; some metrics reset at midnight while others (e.g. Entropy Max) reset in the morning — inconsistent and confusing.","answer":"","sensitive":"","notes":""},{"id":"SL-216","member":"Member","group":"Member","date":"16/07","source":"Slack","area":"Data Science","subcategory":"Accuracy","classification":"Problem","text":"Today's Physical Work is showing 5th in his all-time-high list even though last week has three higher scores (7.2, 4.6, 4.2) that aren't ranked above it.","answer":"Cause: the all-time list required same-day PW to also exceed that day's target to be counted — so higher PWs from days with even higher targets were excluded. Logic simplified to rank on raw PW value regardless of that day's target. Fixed.","sensitive":"","notes":""},{"id":"SL-217","member":"Member","group":"Member","date":"16/07","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Problem","text":"'Record one more sleep to unlock chronotype and sleep consistency insights' banner still showing after 8 recorded sleeps; also grammar — 'Record 1 more sleep'.","answer":"Sleep count wasn't incrementing when a user edited a sleep before it graduated; fixed for this user manually and root-caused for future.","sensitive":"","notes":""},{"id":"SL-218","member":"Member","group":"Member","date":"16/07","source":"Slack","area":"Science Team","subcategory":"Physical Metrics","classification":"Question","text":"Will Temple track exercise-wise progress and overall workout progress using Volume (like Whoop) for strength-training sessions?","answer":"Exercise selection coming soon; progress will be tracked via Entropy (a physiological response), not Volume — volume is a weak predictor of progressive overload.","sensitive":"","notes":""},{"id":"SL-219","member":"Member","group":"Member","date":"20/07","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Problem","text":"After updating the daily steps goal the goal line on the bar chart doesn't update (step goal itself is updated). Also wants same-day live step count on the bar chart alongside completed days — currently only shows at the top of the page.","answer":"","sensitive":"","notes":""},{"id":"SL-220","member":"Member","group":"Member","date":"20/07","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Problem","text":"Cognitive Recovery on the biomonitor shows higher than the week average for 17 July, but on the bar chart CR for the same day is lower than the average line.","answer":"","sensitive":"","notes":""},{"id":"SL-221","member":"Member","group":"Member","date":"20/07","source":"Slack","area":"Product Team","subcategory":"App & Home Experience","classification":"Suggestion","text":"Wants weekly average and today's value shown on every metric page, matching how Respiratory Rate already displays both.","answer":"","sensitive":"","notes":""},{"id":"SL-222","member":"Member","group":"Member","date":"13/07","source":"Slack","area":"Data Science","subcategory":"Calorie Tracking","classification":"Problem","text":"Poha 0.5 serving and 1 serving showed similar calories.","answer":"Root cause: the AI's calorie estimate for a full-plate 'vegetable poha' came in low (~380 kcal), and a threshold check preferred the AI estimate over the correct catalog value (~800 kcal). Fix: disabled that threshold check so a confident catalog match wins; also updating the extraction prompt to return more descriptive dish names so genuine variants get their own grounded macros.","sensitive":"","notes":""},{"id":"SL-223","member":"Member","group":"Member","date":"14/07","source":"Slack","area":"Data Science","subcategory":"Calorie Tracking","classification":"Problem","text":"200g of boiled chana was logged as ~9g protein; actual is 16–20g.","answer":"Chana was under-grounded at ingestion (~9g for 200g vs real ~16g); 'with veggies' modifier pulled it toward a lighter veggie-heavy dish. Catalog dish fixed to ~16g/200g. Also updating the ingestion prompt so 'X with Y' composites ground the primary/protein-dense base and treat add-ons as modifiers instead of blending toward the lighter component.","sensitive":"","notes":""},{"id":"SL-224","member":"Member","group":"Member","date":"14/07","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Problem","text":"Edited a meal later and macros didn't update — the edit didn't recompute.","answer":"Root cause: user edited the meal name/title, not the description. The meal name is a display label only and doesn't feed the extraction pipeline (by design). Only editing the note/description (or adding an image/item) re-runs the AI. Whatever was added to the title (e.g. the extra protein) was never parsed.","sensitive":"","notes":""},{"id":"SL-225","member":"Member","group":"Member","date":"15/07","source":"Slack","area":"Data Science","subcategory":"Calorie Tracking","classification":"Problem","text":"A scoop of protein logged as 15g protein; should be 25g. Calories also inaccurate — expected 100–120 even for whey isolate.","answer":"The 'protein' catalog entry was mis-valued as a ~50%-protein powder, giving 15g/77cal per scoop instead of ~25g. Fixed the catalog dish to a proper whey scoop (~25g / 117 cal).","sensitive":"","notes":""},{"id":"SL-226","member":"Member","group":"Member","date":"16/07","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Problem","text":"Sleep onset detected as 12:00 — actually fell asleep around 10:45.","answer":"Confirmed the customer fell asleep around 10:45pm; this case is an edge case for the current algorithm. Actively testing different methods and a new sleep algorithm with tweaks.","sensitive":"","notes":""},{"id":"SL-227","member":"Member","group":"Member","date":"16/07","source":"Slack","area":"Data Science","subcategory":"Calorie Tracking","classification":"Problem","text":"Logged 2 toasted breads with butter, 2 whole eggs and an 8 egg-white omelette — should be 45–50g protein but got 112g.","answer":"Investigating. Composite grouping is intentional: prompt handles mixed-ingredient dishes as a single combined item when phrased that way (splits only when clearly distinct foods). Working on segregating ingredients out of composite dishes, or ingesting a specified variant as a new DB item so it resolves to correct macros instead of falling back to a generic dish.","sensitive":"","notes":""},{"id":"SL-228","member":"Member","group":"Member","date":"17/07","source":"Slack","area":"Data Science","subcategory":"Auto Workout","classification":"Problem","text":"Activities not getting auto-detected — no auto-workout notification observed.","answer":"Auto-workout was detected on device but the new flow requires user action within 5 minutes; if the phone isn't within Bluetooth range in that window the app isn't notified and the auto-workout is suppressed. For 15 July, both his activities were started manually so no auto-notification was triggered.","sensitive":"","notes":""},{"id":"SL-229","member":"Member","group":"Member","date":"10/07","source":"Slack","area":"Science Team","subcategory":"Entropy","classification":"Positive","text":"Pleasantly surprised by Entropy accessibility; keen to explore lowering Min and raising Brain Flow.","answer":"","sensitive":"","notes":"From the member onboarding session 10/07 (co-onboardee with the member)."},{"id":"SL-230","member":"Member","group":"Member","date":"13/07","source":"Slack","area":"Product Team","subcategory":"Insights & Coaching","classification":"Suggestion","text":"Wants a persistent Sense AI chatbot icon across Entropy and Sleep tabs — 'AI feature is super helpful; only issue is I have to go to HP every time'.","answer":"Adding chat icon across most pages (except side menu/settings, meal-log input, live-activity). Screen context awareness coming next.","sensitive":"","notes":""},{"id":"SL-231","member":"Member","group":"Member","date":"13/07","source":"Slack","area":"Data Science","subcategory":"Auto Workout","classification":"Problem","text":"Activity insights use Cardio zones for singing — should focus on Focus / Cognitive Work instead, since Cardio doesn't make sense for a singing session.","answer":"Team is fixing insights activity-wise, starting with metabolic activities; can also loop this feedback in for this instance.","sensitive":"","notes":""},{"id":"SL-232","member":"Member","group":"Member","date":"13/07","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Problem","text":"Optimal range for the member's Physical/Cognitive Work pages looks buggy.","answer":"Fixed; also updating the Physical/Cognitive Work pages in upcoming releases (already live on iOS).","sensitive":"","notes":""},{"id":"SL-233","member":"Member","group":"Member","date":"14/07","source":"Slack","area":"Data Science","subcategory":"Accuracy","classification":"Problem","text":"Device was in the pocket but off-body wasn't detected; Entropy reached 1 and stayed below 10 for a while. User also asked (half-jokingly) if the period could be deleted so it doesn't affect his minima.","answer":"Fix in progress. Data deletion isn't possible, but the period can be marked as off-body which will eventually update these values. Marked and confirmed done.","sensitive":"","notes":"User also reported on 19/07 that Entropy=1 issue persists after scale-up; handled again — new system needed this case wiring."},{"id":"SL-234","member":"Member","group":"Member","date":"16/07","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Problem","text":"Homepage shows today's Min Entropy as 14 (hit at 7:05am while sleeping) but the Entropy landing page says 24 — mismatch, and no Entropy of 24 was hit after he got up either.","answer":"Root cause: when Min Entropy was calculated before sleep was generated, the post-sleep Min wasn't replacing the homepage value on Android. Fixed and released in Android v0.3.014.","sensitive":"","notes":""},{"id":"SL-235","member":"Member","group":"Member","date":"14/07","source":"Slack","area":"Data Science","subcategory":"Calorie Tracking","classification":"Problem","text":"Macros calculation is off in Sense: '400g of chicken should be ≥80g protein, up to 120g with skin — Temple predicted 54g'; '2 whole eggs and 8 egg-white omelette is ~40g protein, Temple suggested 12.2g'.","answer":"Investigating logging path.","sensitive":"","notes":""},{"id":"SL-236","member":"Member","group":"Member","date":"14/07","source":"Slack","area":"Data Science","subcategory":"Chewing Detection","classification":"Problem","text":"Singing is being picked up as chewing — sharing for algo improvement.","answer":"","sensitive":"","notes":""},{"id":"SL-237","member":"Member","group":"Member","date":"17/07","source":"Slack","area":"Data Science","subcategory":"Auto Workout","classification":"Problem","text":"Activities not getting auto-detected.","answer":"Both of his activities on 15 July were started manually, so no auto-workout notification was triggered; not a detection failure.","sensitive":"","notes":""},{"id":"SL-238","member":"Member","group":"Member","date":"19/07","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Problem","text":"Extraction was defaulting counts to 'serving' unless the user typed 'piece' — logged nuts/berries/eggs came out with the wrong count unit.","answer":"Fixed with a generic rule: any countable food (nuts/berries/fruit/eggs) now maps to 'pieces' by default.","sensitive":"","notes":""},{"id":"SL-239","member":"Member","group":"Member","date":"14/07","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Problem","text":"Meditation session was logged as sleep — 'I was meditating, not sleeping, jumped into meditation 5–7 mins after waking.'","answer":"Identified offset as 06:30. During meditation, sleep-like stillness plus no blinks plus sleep-like HR produced a false sleep window inside his circadian window; both were merged and displayed as awake with a slight REM drop. Working to enhance detection here.","sensitive":"","notes":""},{"id":"SL-240","member":"Member","group":"Member","date":"14/07","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Suggestion","text":"Question about how nap time reduces sleep need — the current message is misleading. Suggested rephrasing.","answer":"Naps only reduce need up to existing debt; this case had ~14min debt, and Temple doesn't save surplus sleep. Message copy will be improved (e.g. 'This nap cleared your ~14 minutes of sleep debt').","sensitive":"","notes":""},{"id":"SL-241","member":"Member","group":"Member","date":"15/07","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Problem","text":"Sleep was not detected although Entropy values are visible during the sleep period.","answer":"Sleep was generated at 9:02; customer reported at 8:58 — timing overlap.","sensitive":"","notes":""},{"id":"SL-242","member":"Member","group":"Member","date":"17/07","source":"Slack","area":"Tech","subcategory":"App Crashes","classification":"Problem","text":"Morning Outlook rendering LLM 'thinking' text in the user-facing output.","answer":"Fix: avoid asking the LLM to add two line breaks; let it return \\n and parse on our side. Long-term: a checker that scans output, flags unexpected responses, and triggers regeneration.","sensitive":"","notes":""},{"id":"SL-243","member":"Member","group":"Member","date":"17/07","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Problem","text":"Daily Entropy Avg mismatch — biomonitor shows 51 but the Avg Entropy graph shows 57.","answer":"Biomonitor page redesigned and under beta; still investigating why the mismatch happened.","sensitive":"","notes":""},{"id":"SL-244","member":"Member","group":"Member","date":"20/07, 21/07","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Problem","text":"Longevity Score homepage widget shows 'will be unlocked in 12 days' but Sense returned the number on ask.","answer":"Home widget shouldn't have been visible for the latest app version for a new user — fixed. Sense chat should communicate the same information even if live — fix releasing today.\n\n[Update 21/07]: Home widget shouldn't have been visible — root-caused to a new-user path in the latest app release; fixed. Sense chat fix also released so it communicates the same information when live.","sensitive":"","notes":""},{"id":"SL-245","member":"Member","group":"Member","date":"13/07","source":"Slack","area":"Science Team","subcategory":"Entropy","classification":"Question","text":"How to define 'good' vs 'bad' Idle Entropy while at work — that's not really rest and not pushing hard either; can we segregate and define that state?","answer":"Team to revisit definitions and copy.","sensitive":"","notes":""},{"id":"SL-246","member":"Member","group":"Member","date":"13/07","source":"Slack","area":"Product Team","subcategory":"App & Home Experience","classification":"Suggestion","text":"The onboarding session feels premium — suggest adding a customer sequence number (e.g. 'you're the 499th person') on the box, a paper insert or a welcome letter for the first 1,000 members.","answer":"","sensitive":"","notes":""},{"id":"SL-247","member":"Member","group":"Member","date":"13/07","source":"Slack","area":"Science Team","subcategory":"Entropy","classification":"Suggestion","text":"Rate of change of Entropy should be a metric — available in Sense today but should be surfaced as a first-class metric.","answer":"","sensitive":"","notes":""},{"id":"SL-248","member":"Member","group":"Member","date":"13/07","source":"Slack","area":"Science Team","subcategory":"Recovery Score","classification":"Suggestion","text":"Whoop drove habit change via strain/recovery visibility in red — wants similar inferences from Temple linking a night's sleep to next-day cognitive and physical recovery scores.","answer":"","sensitive":"","notes":""},{"id":"SL-249","member":"Member","group":"Member","date":"13/07","source":"Slack","area":"Tech","subcategory":"Android Bugs","classification":"Problem","text":"Android app UX slow while the temple is charging — took 7–10s to reflect the charging state; biomonitor doesn't load while charging; no time-to-full estimate.","answer":"","sensitive":"","notes":""},{"id":"SL-250","member":"Member","group":"Member","date":"13/07","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Problem","text":"Sleep recorded incorrectly — actually slept 1:42–7:40am; app captured earlier laptop-in-bed period as sleep. Also intermittently showed a 12:42–1:01am window at 1:08am that later self-corrected.","answer":"Final sleep for that morning was 1:30–7:42am. The 12:42–1:01am window came from an alternative algorithm we run when the main one can't detect sleep during travel; will be limited to outside the circadian window to remove these cases.","sensitive":"","notes":""},{"id":"SL-251","member":"Member","group":"Member","date":"13/07","source":"Slack","area":"Product Team","subcategory":"Integrations & Notifications","classification":"Suggestion","text":"Would like Apple HealthKit integration during onboarding to prefill weight and height rather than manual entry.","answer":"Evaluating adding Apple Health data-share as part of onboarding — would also allow the app to run in background for longer.","sensitive":"","notes":""},{"id":"SL-252","member":"Member","group":"Member","date":"13/07","source":"Slack","area":"Product Team","subcategory":"App & Home Experience","classification":"Suggestion","text":"When the charging case opens, suggest a pop-up like the AirPods pairing prompt.","answer":"Not possible with current charger hardware.","sensitive":"","notes":""},{"id":"SL-253","member":"Member","group":"Member","date":"13/07","source":"Slack","area":"Data Science","subcategory":"Accuracy","classification":"Suggestion","text":"Signal quality could be used to indicate whether the Temple has been placed on the correct region.","answer":"","sensitive":"","notes":""},{"id":"SL-254","member":"Member","group":"Member","date":"13/07","source":"Slack","area":"Product Team","subcategory":"Insights & Coaching","classification":"Question","text":"Would've wanted to see the OTP in the first line of the setup email.","answer":"","sensitive":"","notes":""},{"id":"SL-255","member":"Member","group":"Member","date":"20/07","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Problem","text":"Entropy reading is 110 but Max is showing 69 — inconsistent.","answer":"","sensitive":"","notes":""},{"id":"SL-256","member":"Member","group":"Member","date":"20/07","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Problem","text":"Woke at 8am, was awake for an hour, then took a nap at 9am — sleep insight treated the awake-in-between hour as part of the same sleep cycle. The 9am sleep should be considered a separate nap and produce a separate insight so it doesn't affect sleep metrics.","answer":"","sensitive":"","notes":""},{"id":"SL-257","member":"Member","group":"Member","date":"20/07","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Suggestion","text":"Sleep graph isn't easily readable — smoothing may help; X/Y axes don't stand out; not clear whether it's showing the last 24h or today.","answer":"Compact graphs are for quick-glance; detailed graphs with axes appear on tap of individual cards.","sensitive":"","notes":""},{"id":"SL-258","member":"Member","group":"Member","date":"14/07","source":"Slack","area":"Product Team","subcategory":"App & Home Experience","classification":"Suggestion","text":"Displayed home-screen metrics should reset sleep-to-sleep — 'day effectively continues until the user's next sleep session begins', not at 00:00.","answer":"","sensitive":"","notes":""},{"id":"SL-259","member":"Member","group":"Member","date":"14/07","source":"Slack","area":"Tech","subcategory":"App Crashes","classification":"Problem","text":"Asked Sense for summary trends — Sense started returning results from the day she started wearing the device and the app crashed. Also: calories mismatch for the same food item between Sense chat and the Food Logging interface.","answer":"","sensitive":"","notes":""},{"id":"SL-260","member":"Member","group":"Member","date":"19/07","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Problem","text":"Sleep sessions not merged and wake time detected around 7:30 was off. Between 10:25pm and 3:06am the device also had no data despite being on-body per the user.","answer":"Long investigation: SW off-body detected at 22:25, HW off-body at 22:30, plus additional HW off-body blocks totalling ~18min till 23:25. Device was probably on-body but on clothing (not skin) till ~03:02. Orientation changes throughout the night point to the device being stuck on clothing or loose — signal quality dropped, no on-body detected. Large avg_accel_z shift at 03:02 suggests device pressed back to skin; on-body detected from there. Sleep generated from 03:11.","sensitive":"","notes":""},{"id":"SL-261","member":"Member","group":"Member","date":"20/07","source":"Slack","area":"Science Team","subcategory":"Focus","classification":"Problem","text":"Focus mode is meant to detect flow state but is actually reading physiological stillness — scored low while painting (cognitively tuned in but physically active) and high while zoning out in a cab. Cognitive Work inherits this since it's calculated from Focus states, so movement-heavy but mentally demanding tasks (painting, writing, instruments) get underrepresented.","answer":"","sensitive":"","notes":""},{"id":"SL-262","member":"Member","group":"Member","date":"21/07","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Problem","text":"Customer is on a ship — sleep wasn't tracked properly.","answer":"","sensitive":"","notes":""},{"id":"SL-263","member":"Member","group":"Member","date":"13/07","source":"Slack","area":"Product Team","subcategory":"Insights & Coaching","classification":"Suggestion","text":"Two workouts (~200 and ~400 cal) both triggered the same 'serious push' notification — the copy should scale with actual effort, ideally relative to the customer's own range.","answer":"Team to update notification service.","sensitive":"","notes":""},{"id":"SL-264","member":"Member","group":"Member","date":"13/07","source":"Slack","area":"Product Team","subcategory":"Women's Health","classification":"Problem","text":"No ovulation window prediction shown this month. Also: if the next period is 12 days away, the ovulation window should fall 11–14 days after that period — the model appears to be placing the window incorrectly for shorter cycles.","answer":"Current-month window already over — showing for next month. Follicular window shrunk due to shorter cycle duration; a fix for handling short cycle lengths went live 13 July night.","sensitive":"","notes":""},{"id":"SL-265","member":"—","group":"—","date":"20/07","source":"Slack","area":"Science Team","subcategory":"Entropy","classification":"Positive","text":"Resting Entropy dropped noticeably with a 4-hour eating window (33–35 vs prior ~45 average). Breaking fast with sugary cookies spiked Entropy to 60; breaking fast with a balanced protein+fibre+fruit meal only spiked to ~50.","answer":"Consistent with metabolic pattern: reducing food intake lowers Entropy — lower digestive demand, less diet-induced thermogenesis, less need to ramp up peripheral perfusion. Both effects bring Entropy down.","sensitive":"","notes":"Internal observation via the member."},{"id":"SL-266","member":"Member","group":"Member","date":"17/07","source":"Slack","area":"Tech","subcategory":"Android Bugs","classification":"Problem","text":"Temple logo on top-left compressed on Vivo (OS-specific).","answer":"OS-specific issue — happening only on Vivo; fix in progress.","sensitive":"","notes":"user_id ed7af6c8 — not in mapping."},{"id":"SL-267","member":"Member","group":"Member","date":"17/07","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Problem","text":"Portion-size editing is buggy — can't input 0.8 or 0.2, only multiples of 0.5. When editing timing of a previously-logged meal, editing time also forces editing portion sizes.","answer":"Both fixed in Android v0.3.015.","sensitive":"","notes":"user_id ed7af6c8 — not in mapping."},{"id":"SL-268","member":"Member","group":"Member","date":"15/07","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Problem","text":"Entropy minima number mismatch in the top banner on day 1 of wearing the device.","answer":"Hotfix released in Android v0.3.014. Also enforced: minima/maxima should take at least 3 days to show.","sensitive":"","notes":"user_id a456e370 — not in mapping."},{"id":"SL-269","member":"Member","group":"Member","date":"16/07","source":"Slack","area":"Tech","subcategory":"Sync & Data","classification":"Problem","text":"Broken/fragmented data graph across data, Entropy and HR — device is always on-body per the user.","answer":"Asked user to update to Android v0.3.014; updated but issue investigation continues.","sensitive":"","notes":"user_id a456e370 — not in mapping."},{"id":"SL-270","member":"Member","group":"Member","date":"20/07, 22/07","source":"Slack","area":"Product Team","subcategory":"Insights & Coaching","classification":"Problem","text":"Sense unable to answer body-clock questions.","answer":"Chronotype documentation being added to KB.\n\n[Update 22/07]: Sense returned different answers for different users on the same body-clock question; chronotype documentation shared for KB (per the member). Correct answer identified — grey circle mention wasn't in KB (that response was wrong). KB now includes chronotype content.","sensitive":"","notes":"user_id a456e370 — not in mapping."},{"id":"SL-271","member":"Member","group":"Member","date":"16/07","source":"Slack","area":"Data Science","subcategory":"Accuracy","classification":"Problem","text":"10km run this morning reported as only 2,428 steps — grossly under-reported vs Garmin.","answer":"Steps detected 6:23–6:36 but not from 6:36–7:15 despite continuously high accel_std suggesting steps continued; raw data unavailable for the period so unable to debug/regenerate. Fix released.","sensitive":"","notes":"user_id 30c85b16 — not in mapping."},{"id":"SL-272","member":"Member","group":"Member","date":"20/07, 22/07","source":"Slack","area":"Data Science","subcategory":"Calorie Tracking","classification":"Problem","text":"Calories and macros wildly off for cucumber and capsicum.","answer":"Upgrading models to better identify user intent and adding a checker system to catch inflated macro cases.\n\n[Update 22/07]: Fix now landed (per the member).","sensitive":"","notes":"user_id 30c85b16 — not in mapping."},{"id":"SL-273","member":"Member","group":"Member","date":"17/07","source":"Slack","area":"Data Science","subcategory":"Calorie Tracking","classification":"Problem","text":"2 Besan chilla for breakfast showing only 7g protein and 17g carbs — under-reported.","answer":"'Besan chilla' was aliased to plain chilla (lower macros) in the DB. Fixed this alias; also iterating over frequently-logged dishes to catch similar issues.","sensitive":"","notes":"user_id 6d48ecce — not in mapping."},{"id":"SL-274","member":"Member","group":"Member","date":"20/07","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Problem","text":"Sleep staging off — 1:37–2:17 shown as deep sleep (was awake watching a match); 8:47–9:02 shown as REM (was almost awake).","answer":"Known failure mode of the current sleep model; fix is in place in the new model, which is being scaled up. New-model onset for this case is 3:21am.","sensitive":"","notes":"user_id 6d48ecce — not in mapping."},{"id":"SL-275","member":"Member","group":"Member","date":"17/07","source":"Slack","area":"Data Science","subcategory":"Chewing Detection","classification":"Problem","text":"Prompted to take a photo of the meal after it was already completed.","answer":"","sensitive":"","notes":"user_id a5248c9c — not in mapping."},{"id":"SL-276","member":"Member","group":"Member","date":"21/07","source":"Slack","area":"Data Science","subcategory":"Calorie Tracking","classification":"Problem","text":"'A scoop of protein and creatine each with cold water' — macros incorrect.","answer":"","sensitive":"","notes":"user_id fa9df9f1 — not in mapping."},{"id":"SL-277","member":"Non-Eternal (onboarding)","group":"Non-Eternal (onboarding)","date":"12/07","source":"Slack","area":"Manufacturing","subcategory":"Color/Finish","classification":"Positive","text":"Preferred the Natural Titanium finish for its subtle, non-glossy appearance.","answer":"","sensitive":"","notes":""},{"id":"SL-278","member":"Non-Eternal (onboarding)","group":"Non-Eternal (onboarding)","date":"12/07","source":"Slack","area":"Science Team","subcategory":"Entropy","classification":"Question","text":"Found Entropy compelling but wants to understand whether it has revealed meaningful patterns beyond what we already know.","answer":"","sensitive":"","notes":""},{"id":"SL-279","member":"Non-Eternal (onboarding)","group":"Non-Eternal (onboarding)","date":"12/07","source":"Slack","area":"Hardware/Firmware","subcategory":"Battery","classification":"Positive","text":"Apple Watch user who doesn't wear it overnight due to charging habits — 3–4 day battery life was a major positive.","answer":"","sensitive":"","notes":""},{"id":"SL-280","member":"Non-Eternal (onboarding)","group":"Non-Eternal (onboarding)","date":"12/07","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Suggestion","text":"Has used multiple sleep trackers — data doesn't always match how they feel; waking rested but being told sleep was poor (or vice versa) is confusing and makes them question their own perception.","answer":"","sensitive":"","notes":""},{"id":"SL-281","member":"Non-Eternal (onboarding)","group":"Non-Eternal (onboarding)","date":"12/07","source":"Slack","area":"Manufacturing","subcategory":"Color/Finish","classification":"Positive","text":"Lightweight and sleek form factor — can't feel it once it's on.","answer":"","sensitive":"","notes":""},{"id":"SL-282","member":"Non-Eternal (onboarding)","group":"Non-Eternal (onboarding)","date":"12/07","source":"Slack","area":"Product Team","subcategory":"Insights & Coaching","classification":"Positive","text":"Preparing for Everest Base Camp trek — will try Temple on the trek. Had already discovered Sense independently before we could mention it; avid AI user, interested in exploring Sense further.","answer":"","sensitive":"","notes":""},{"id":"SL-283","member":"Eternal (onboarding)","group":"Eternal (onboarding)","date":"13/07","source":"Slack","area":"Science Team","subcategory":"Entropy","classification":"Positive","text":"User 1: Focused on health, consistent gym-goer; did not renew Whoop to try Temple. Recent blood work had markers outside normal range — probably contributing to elevated Idle Entropy.","answer":"","sensitive":"","notes":""},{"id":"SL-284","member":"Eternal (onboarding)","group":"Eternal (onboarding)","date":"13/07","source":"Slack","area":"Science Team","subcategory":"Entropy","classification":"Positive","text":"User 2: Apple Watch user primarily for notifications/calls; first health-focused wearable experience — particularly excited about Entropy but initially felt it was 'too good to be true'; curious to validate its usefulness through real-world use.","answer":"","sensitive":"","notes":""},{"id":"SL-285","member":"Eternal (onboarding)","group":"Eternal (onboarding)","date":"13/07","source":"Slack","area":"Product Team","subcategory":"Device & Metrics","classification":"Suggestion","text":"User 3: Regular runner on Garmin; requested run-distance tracking in Temple. Highly interested in Entropy — feels recent poor sleep contributed to elevated Idle; plans to experiment by observing Entropy changes after recovering and during workouts.","answer":"","sensitive":"","notes":""},{"id":"SL-286","member":"Eternal (onboarding)","group":"Eternal (onboarding)","date":"13/07","source":"Slack","area":"Tech","subcategory":"UI/UX","classification":"Suggestion","text":"User 4: Requested larger font sizes for readability; felt meal logging and nutrition insights should be surfaced more prominently as a core capability. Especially impressed by Sense proactively surfacing insights and by the premium feel/design of the charger.","answer":"","sensitive":"","notes":""},{"id":"SL-287","member":"—","group":"—","date":"15/07","source":"Slack","area":"Product Team","subcategory":"Insights & Coaching","classification":"Suggestion","text":"Wants a consistent info icon for all metrics (Entropy Avg has one, Brain Flow doesn't) plus a simplified guide for what's ideal — praised how Garmin explains its metrics.","answer":"","sensitive":"","notes":""},{"id":"SL-288","member":"—","group":"—","date":"15/07","source":"Slack","area":"Data Science","subcategory":"Sleep Tracking","classification":"Positive","text":"Ardent Whoop user praising Temple's nap detection — 'Whoop wasn't able to detect the last few naps.'","answer":"","sensitive":"","notes":""},{"id":"SL-289","member":"—","group":"—","date":"16/07","source":"Slack","area":"Product Team","subcategory":"Nutrition & Logging","classification":"Suggestion","text":"Wants the calorie ring to represent proportions of calorie/fat/protein consumption. For users cutting/bulking, the app should provide actionable direction (e.g. 'calories burnt < calories intake this week by X — cut aggressively for the next two days to get back on track').","answer":"Goal-setting is in the works.","sensitive":"","notes":""},{"id":"SL-290","member":"—","group":"—","date":"16/07","source":"Slack","area":"Product Team","subcategory":"App & Home Experience","classification":"Suggestion","text":"UX feedback: widgets for at-a-glance metrics (Entropy/Focus); ideal ranges for Entropy/Focus so users know when a number is 'good' vs 'bad'; goal-setting for Entropy/Focus with in-moment action items; opt-in morning notification with sleep summary and previous-day outlook (Whoop-style).","answer":"Widgets valid; Resting Entropy coming with tap-to-see 'Top 1%/10%' associations; 'How to lower your Resting Entropy' section in works; morning notification will be incorporated.","sensitive":"","notes":""},{"id":"SL-291","member":"—","group":"—","date":"19/07","source":"Slack","area":"Product Team","subcategory":"Nutrition & Logging","classification":"Suggestion","text":"Wants a way to log fasting; would love to see correlations with metrics.","answer":"Will not treat fasting as an activity. Chewing detection can identify extended no-chewing windows and contextually nudge — feeding to Sense with fasting context baked in. Nutrition flow also has a fasting-window setting in dev.","sensitive":"","notes":""},{"id":"SL-292","member":"—","group":"—","date":"19/07","source":"Slack","area":"Product Team","subcategory":"App & Home Experience","classification":"Question","text":"Can the homepage be customised to bring steps to the first scroll?","answer":"No — steps are not a moat metric; product will not differentiate on a
