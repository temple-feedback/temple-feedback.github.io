": "Football activity picked cleanly and captured calories.", "answer": "", "sensitive": "", "notes": "Adnan existing; activity saga."}, {"id": "SL-054a", "member": "Adnan Adeeb", "group": "Adnan Adeeb", "date": "02/07", "source": "Slack", "area": "Adhesion", "subcategory": "Tapes", "classification": "Problem", "text": "Device came off during a swim (sweat then water).", "answer": "Grips lose adhesion with heavy sweating followed by water (swim/shower); offered device-size tapes to try.", "sensitive": "", "notes": "From SL-054. Adnan existing."}, {"id": "SL-054b", "member": "Adnan Adeeb", "group": "Adnan Adeeb", "date": "02/07", "source": "Slack", "area": "Data Science", "subcategory": "Auto Workout", "classification": "Problem", "text": "The 10-lap swim done before the device came off isn't surfaced as an activity.", "answer": "Auto-detection surfaced only a 3-4 min swim fragment (~9am) so it wasn't shown; off-body was ~3 min (<10 min, so not force-ended). Overlapping-activities handling is in the pipeline (he had logged overlapping 1-hr swim entries, where the app sets end-time = now and start = 1 hr prior).", "sensitive": "", "notes": "From SL-054."}, {"id": "SL-057", "member": "Ragini", "group": "Ragini", "date": "02/07", "source": "Slack", "area": "Tech", "subcategory": "App Crashes", "classification": "Problem", "text": "'Developer removed you from the test programme' error when updating the app.", "answer": "An internal TestFlight group was disabled but some customers were on it; clicking the new invite link fixes it.", "sensitive": "", "notes": "Same as SL-073 (Mayur), SL-051 (Varun)."}, {"id": "SL-060", "member": "Pulkit", "group": "Pulkit", "date": "01/07", "source": "Slack", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Suggestion", "text": "Wants to manually add a nap / sleep-rest; couldn't find where.", "answer": "Adding a nap isn't supported yet (surfacing naps is WIP); his nap was detected (3:53-6:20pm). Nap rollout ~mid next week.", "sensitive": "", "notes": "Overlaps SL-052a (nap detection). Pulkit existing."}, {"id": "SL-062", "member": "Joel & Joy", "group": "Joel & Joy", "date": "13/06", "source": "Slack", "area": "Adhesion", "subcategory": "Skin Issues", "classification": "Problem", "text": "Skin irritation at the Temple application site.", "answer": "", "sensitive": "TRUE", "notes": "SENSITIVE candidate — skin reaction. Joel existing."}, {"id": "SL-063a", "member": "Mayur", "group": "Mayur", "date": "13/06", "source": "Slack", "area": "Hardware/Firmware", "subcategory": "Battery", "classification": "Problem", "text": "Device battery died mid-sleep (alive only 5h15 of a 9h sleep).", "answer": "Battery-dying-during-sleep experience being prioritized; exploring aggressive duty cycling at low charge to still capture sleep.", "sensitive": "", "notes": "From SL-063. Mayur battery/sleep recurring."}, {"id": "SL-063b", "member": "Mayur", "group": "Mayur", "date": "13/06", "source": "Slack", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Suggestion", "text": "Morning Outlook should detect device death, flag it, give insight only on captured data, and not score overall sleep/recovery.", "answer": "Planned handling: partial/omitted recovery, partial sleep commentary with an option to edit/add missing hours, downstream goal/target adjustment, and Temple Sense adjusting to missing sleep context.", "sensitive": "", "notes": "From SL-063."}, {"id": "SL-066", "member": "Rahul Dubai", "group": "Rahul Dubai", "date": "", "source": "Slack", "area": "Science Team", "subcategory": "Entropy", "classification": "Problem", "text": "Off-body periods still compute Entropy/Brain Flow, changing metrics and affecting the day's peaks; suggests excluding off-body from these calculations.", "answer": "", "sensitive": "", "notes": "Reported by Neha on Rahul Gupta's (= Rahul Dubai) device. Off-body-computing theme (SL-095)."}, {"id": "SL-072", "member": "Rahul Dubai", "group": "Rahul Dubai", "date": "11/06", "source": "Slack", "area": "Hardware/Firmware", "subcategory": "Battery", "classification": "Problem", "text": "On the replacement (natural-titanium) device, battery appeared to drop 98%->5% within ~3 min of wearing; asked to remove it.", "answer": "Not a real battery issue — an erroneous drop-on-reboot from a very old firmware; device upgraded to the latest stable FW and safe to wear. (An old device from April stock had reached a new customer.)", "sensitive": "TRUE", "notes": "SENSITIVE candidate — told to remove device. Rahul device saga (SL-041)."}, {"id": "SL-073", "member": "Mayur", "group": "Mayur", "date": "", "source": "Slack", "area": "Tech", "subcategory": "App Crashes", "classification": "Problem", "text": "Received a 'removed from our test program' notification.", "answer": "Happens in some iOS cases; share the new TestFlight invite link. The internal TestFlight link is being changed for more controlled releases.", "sensitive": "", "notes": "Same as SL-057 (Ragini), SL-051 (Varun)."}, {"id": "SL-076", "member": "Tanmay", "group": "Tanmay", "date": "", "source": "Slack", "area": "Hardware/Firmware", "subcategory": "Sensor", "classification": "Problem", "text": "PPG sensor didn't activate on fingers during onboarding; not a battery issue (90%+ charge); possibly didn't exit ship mode.", "answer": "Investigating device charging state / LED indication; his charger works fine standalone.", "sensitive": "", "notes": "Tanmay (existing) — Tanmay Bhat."}, {"id": "SL-077", "member": "Sahil Anand", "group": "Sahil Anand", "date": "", "source": "Slack", "area": "Adhesion", "subcategory": "Tapes", "classification": "Problem", "text": "Temple came off after 20 min on the treadmill (newly onboarded).", "answer": "Skin looked clean but had cream/moisturiser; the skin must be cleaned/wiped before application for better adhesion.", "sensitive": "", "notes": "Sahil Anand existing. Tape-sweat theme."}, {"id": "SL-078", "member": "Vishal Kumar", "group": "Vishal Kumar", "date": "", "source": "Slack", "area": "Hardware/Firmware", "subcategory": "Battery", "classification": "Problem", "text": "Battery discharged abnormally (100%->86% right after application; 29%->0% earlier); not connecting.", "answer": "Device went into ship mode; battery degraded fast (25%->80% in 5 min on charge). Recalled and replaced with a new device + charger.", "sensitive": "", "notes": "Vishal existing. Possible sensitive (ship mode) — left visible."}, {"id": "SL-079", "member": "Vishal Kumar", "group": "Vishal Kumar", "date": "", "source": "Slack", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Suggestion", "text": "Asked about a two-device option (gets ~10 days from Whoop; charging every 2-3 days isn't ideal).", "answer": "", "sensitive": "", "notes": "Two-Temple theme (SL-048b)."}, {"id": "SL-081a", "member": "Vishal Kumar", "group": "Vishal Kumar", "date": "", "source": "Slack", "area": "Data Science", "subcategory": "Calorie Tracking", "classification": "Problem", "text": "Macros differ between the Health-app section and Temple for the same food.", "answer": "", "sensitive": "", "notes": "From SL-081. Vishal existing."}, {"id": "SL-081b", "member": "Vishal Kumar", "group": "Vishal Kumar", "date": "", "source": "Slack", "area": "Data Science", "subcategory": "Accuracy", "classification": "Suggestion", "text": "RHR/sleep/calories differ meaningfully from Whoop; wants in-app/bot material explaining why, to build trust.", "answer": "", "sensitive": "", "notes": "From SL-081. Overlaps SL-048c (explainers)."}, {"id": "SL-084", "member": "Adnan Adeeb", "group": "Adnan Adeeb", "date": "", "source": "Slack", "area": "Data Science", "subcategory": "Accuracy", "classification": "Question", "text": "Temple showed more calories burned than his Apple Watch (felt generous), post football + ice bath.", "answer": "He wasn't actually wearing the Apple Watch; Temple showed 895 cal (~757 from 1.5h football with time in Zones 4-5, ~130 NEAT from ~11k steps). As a new user his sedentary HR baseline is still building.", "sensitive": "", "notes": "Adnan existing. Activity saga."}, {"id": "SL-085a", "member": "Bhavin Turakhiya", "group": "Bhavin Turakhiya", "date": "", "source": "Slack", "area": "Science Team", "subcategory": "Entropy", "classification": "Negative", "text": "Couldn't watch Entropy continuously (became impractical) and couldn't correlate it the few times he did.", "answer": "", "sensitive": "", "notes": "From SL-085. New member."}, {"id": "SL-085b", "member": "Bhavin Turakhiya", "group": "Bhavin Turakhiya", "date": "", "source": "Slack", "area": "Hardware/Firmware", "subcategory": "Battery", "classification": "Problem", "text": "Battery life is low.", "answer": "Working on stretching battery (optimising raw-data storage, reducing idle BLE consumption).", "sensitive": "", "notes": "From SL-085."}, {"id": "SL-085d", "member": "Bhavin Turakhiya", "group": "Bhavin Turakhiya", "date": "", "source": "Slack", "area": "Adhesion", "subcategory": "Tapes", "classification": "Negative", "text": "Putting the device on is an involved/complex process.", "answer": "Golden tape samples with a stencil (for easier application) due mid-June.", "sensitive": "", "notes": "Split from SL-085 (Bhavin onboarding feedback)."}, {"id": "SL-085c", "member": "Bhavin Turakhiya", "group": "Bhavin Turakhiya", "date": "", "source": "Slack", "area": "Adhesion", "subcategory": "Tapes", "classification": "Suggestion", "text": "A stencil is needed; he can't apply the sticker/tape properly each time.", "answer": "Golden tape samples due mid-June.", "sensitive": "", "notes": "From SL-085."}, {"id": "SL-089", "member": "Rob Mohr", "group": "Rob Mohr", "date": "", "source": "Slack", "area": "Hardware/Firmware", "subcategory": "Charger", "classification": "Problem", "text": "Charging issue — only the bottom LED flashed; after removing and retrying it charged continuously.", "answer": "Loose connection / something on the contact pads causing interference; started working after reseating. Replacement device + charger shipped (he keeps the old one too).", "sensitive": "", "notes": "Rob Mohr (Avi & Rob) existing."}, {"id": "SL-097", "member": "Mohit", "group": "Mohit", "date": "", "source": "Slack", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Suggestion", "text": "Had to manually unlink the old (lost) device before connecting the replacement.", "answer": "Expected behaviour currently, but device-switching should be made simpler (part of the multi-Temple use case).", "sensitive": "", "notes": "Mohit existing."}, {"id": "SL-099", "member": "Amit & Shveta", "group": "Amit & Shveta", "date": "", "source": "Slack", "area": "Tech", "subcategory": "Android Bugs", "classification": "Problem", "text": "Device wasn't sending data / not connecting (Samsung A14, Android 14).", "answer": "Android 14 GATT_133 Bluetooth-cache bug caused it to get stuck; mitigation = forget the Temple in Bluetooth settings and re-pair (clears the cache); data resumed. Google fixed this on Android 15; auto-recovery being worked on.", "sensitive": "", "notes": "Shveta existing (SL-080)."}, {"id": "SL-105", "member": "Vidur", "group": "Vidur", "date": "", "source": "Slack", "area": "Hardware/Firmware", "subcategory": "Sensor", "classification": "Question", "text": "Device emits a visible red halo/glow at night (90-120 sec).", "answer": "Not a failure — the red LED (currently only for SpO2, not used for Brain Flow/Entropy) is more evident on lighter skin at night; it can be switched off. Dynamic LED/TX control is coming next week (lower LED drive for lighter skin tones).", "sensitive": "", "notes": "Vidur existing."}, {"id": "SL-106", "member": "Ragini", "group": "Ragini", "date": "", "source": "Slack", "area": "Hardware/Firmware", "subcategory": "Connectivity", "classification": "Problem", "text": "Firmware auto-downloaded then failed.", "answer": "Upgrade failed due to a disconnection during upload; retrying fixes it for now. Silent OTA released in v1.1.0 (978).", "sensitive": "", "notes": "Ragini saga (SL-056/057/058/110)."}, {"id": "SL-107", "member": "Prerna", "group": "Prerna", "date": "", "source": "Slack", "area": "Data Science", "subcategory": "Auto Workout", "classification": "Problem", "text": "Can't start an activity (run) after 5-7 tries on a new Android device; once logged, calories showed.", "answer": "Workout Mode is blocked when the device is connecting/disconnected/off-body/calibrating; app-side events were missing so the exact state was unclear. Added the events and improved device-state handling on the Workout Mode entry screen.", "sensitive": "", "notes": "Prerna existing (SL-075/094)."}, {"id": "SL-108", "member": "Sandeep", "group": "Sandeep", "date": "", "source": "Slack", "area": "Tech", "subcategory": "Sync & Data", "classification": "Problem", "text": "Device stopped connecting; after unlinking it became undiscoverable.", "answer": "Worked again once he restarted Bluetooth.", "sensitive": "", "notes": "Sandeep existing (SL-103)."}, {"id": "SL-111", "member": "Ragini", "group": "Ragini", "date": "", "source": "Slack", "area": "Science Team", "subcategory": "Focus", "classification": "Problem", "text": "Focus/cognitive-work reading looked anomalous during a morning work session.", "answer": "During her 5:50-7am work session, HRV dropped (50s->30s) with HR only in the late 80s plus some steps — physical/systemic stress masqueraded as focus and missed the movement thresholds that dampen it. Will dampen those; consumer rollout EOW.", "sensitive": "", "notes": "Ragini existing. Flagged internally for RCA."}, {"id": "SL-112a", "member": "Varun Alagh; Ghazal Alagh", "group": "Varun Alagh; Ghazal Alagh", "date": "", "source": "Slack", "area": "Manufacturing", "subcategory": "Color/Finish", "classification": "Suggestion", "text": "Suggest embossing/engraving the Temple bean logo on the charger (a visual cue, like the Apple logo) rather than only 'Temple' text.", "answer": "", "sensitive": "", "notes": "From SL-112. Varun Alagh + Ghazal Alagh (both existing)."}, {"id": "SL-112b", "member": "Varun Alagh; Ghazal Alagh", "group": "Varun Alagh; Ghazal Alagh", "date": "", "source": "Slack", "area": "Manufacturing", "subcategory": "Color/Finish", "classification": "Positive", "text": "Loved the glossy silver finish, the laser-band/shadow slimming effect, and the charger ('a very smooth pebble').", "answer": "", "sensitive": "", "notes": "From SL-112."}, {"id": "SL-112c", "member": "Varun Alagh; Ghazal Alagh", "group": "Varun Alagh; Ghazal Alagh", "date": "", "source": "Slack", "area": "Adhesion", "subcategory": "Tapes", "classification": "Suggestion", "text": "Initial tape interaction wasn't fully intuitive (clarified final tapes will use a stencil and be seamless).", "answer": "", "sensitive": "", "notes": "From SL-112."}, {"id": "SL-112d", "member": "Varun Alagh; Ghazal Alagh", "group": "Varun Alagh; Ghazal Alagh", "date": "", "source": "Slack", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Suggestion", "text": "The app didn't proactively request notification permissions — they had to go to phone settings.", "answer": "Changed to prompt on first launch, popping up after login.", "sensitive": "", "notes": "From SL-112."}, {"id": "SL-112e", "member": "Varun Alagh; Ghazal Alagh", "group": "Varun Alagh; Ghazal Alagh", "date": "", "source": "Slack", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Positive", "text": "Loved the overall app experience; super impressed by chewing detection; intrigued by Brain Flow, Entropy and Focus.", "answer": "", "sensitive": "", "notes": "From SL-112."}, {"id": "SL-113", "member": "Akshant", "group": "Akshant", "date": "", "source": "Slack", "area": "Hardware/Firmware", "subcategory": "Charger", "classification": "Suggestion", "text": "Charger opening isn't intuitive; suggests a small indentation on the top shell for easier, ergonomic opening.", "answer": "", "sensitive": "", "notes": "Akshant existing."}, {"id": "SL-114", "member": "PV Sindhu", "group": "PV Sindhu", "date": "", "source": "Slack", "area": "Data Science", "subcategory": "Accuracy", "classification": "Question", "text": "Questioned her heart-rate reading during activity (whether it should be ~109 vs the ~70s shown).", "answer": "HR is benchmarked per-second against Polar with a 5s EMA (33% weight to the current second) and allows a max 9 bpm/sec increase; the data was clean and both peak-counting and frequency-domain methods point to ~70s. No issue found, including across her cycling.", "sensitive": "", "notes": "New member (PV Sindhu)."}, {"id": "SL-115", "member": "Datta", "group": "Datta", "date": "", "source": "Slack", "area": "Adhesion", "subcategory": "Tapes", "classification": "Problem", "text": "Temple fell off during sleep twice in three nights.", "answer": "Checking tape type/skin; Athletic tapes are too strong for him.", "sensitive": "", "notes": "New member (Datta, PV Sindhu's husband)."}, {"id": "SL-116", "member": "PV Sindhu", "group": "PV Sindhu", "date": "", "source": "Slack", "area": "Adhesion", "subcategory": "Residue", "classification": "Problem", "text": "Some skin residue from Athletic tapes on day-to-day use; her physio cleaned it with an alcohol swab.", "answer": "", "sensitive": "", "notes": "PV Sindhu (new). Minor."}, {"id": "SL-117", "member": "PV Sindhu", "group": "PV Sindhu", "date": "", "source": "Slack", "area": "Data Science", "subcategory": "Chewing Detection", "classification": "Problem", "text": "No chewing/eating detected at all (vs 5 detections for Datta).", "answer": "", "sensitive": "", "notes": "PV Sindhu (new)."}], "taxonomy": {"Hardware/Firmware": ["Battery", "Device Body", "Charger", "Connectivity", "Sensor", "Heating"], "Manufacturing": ["Color/Finish", "Breakage", "Packaging"], "Adhesion": ["Tapes", "Skin Issues", "Residue"], "Data Science": ["Accuracy", "Chewing Detection", "Sleep Tracking", "Auto Workout", "Calorie Tracking", "GPS/Distance"], "Science Team": ["Entropy", "Brain Flow", "Focus", "Cognitive Metrics", "Physical Metrics", "Recovery Score", "Others"], "Tech": ["App Crashes", "Sync & Data", "Notifications", "UI/UX", "Android Bugs"], "Product Team": ["Feature Requests", "Women's Health", "Activity Logging"], "Support": ["Onboarding", "Device Replacement", "Logistics"]}, "faq": {"Hardware/Firmware": [{"question": "How long does the device take to charge, and how do I know when it's done?", "customers": ["Rahul Ganjoo", "Sanjeev", "Vatsal"], "answer": "A full charge takes about 1 hour 15 minutes (80% in ~30 mins). You'll get a notification on the app when it's complete. The LED on the charger will breathe 4 times and stop — that's normal, not a fault.", "count": 3}, {"question": "Why does battery drain faster than expected, or not last the advertised duration?", "customers": ["Mohit", "Ragini", "Joel & Joy", "Vatsal"], "answer": "Battery life averages 3–3.5 days. Leaving an activity running in the background significantly drains it faster. Check that no activity is paused/running when not in use. Battery life is intentionally matched to tape change rhythm (every 3–4 days).", "count": 4}, {"question": "What do the different LED light colours and blink patterns on the charger mean?", "customers": ["Mayur", "Rahul Ganjoo"], "answer": "White blinking = charging in progress. Breathing 4 times then stopping = fully charged (this is normal). No light = device not seated properly on charger, adjust placement. Purple/unusual colours may indicate a firmware or hardware issue — contact support.", "count": 2}, {"question": "Is the device safe to use near water, during sweaty workouts, or in a sauna?", "customers": ["Vatsal", "Dr Apoorva"], "answer": "The device is fully waterproof — face washing, showering, and sweating are all fine. Sauna is also safe; the temple area naturally stays at core body temperature, capping device heat around 40–45°C even at 70°C ambient. Max rated temp is around 55°C.", "count": 2}, {"question": "The device keeps disconnecting or won't reconnect to the app — what should I do?", "customers": ["Sandeep", "Himanshu", "Mohit"], "answer": "First try restarting your phone's Bluetooth. If that doesn't work, unlink the device in the app and re-scan. For new/replacement devices, you will need to unlink the old device first before connecting the new one — we're working on making this automatic.", "count": 3}], "Adhesion": [{"question": "Why does the tape fall off during heavy workouts or after a few days?", "customers": ["Prerna", "Pulkit", "Sumeet", "Kunal Khambhati", "Sahil"], "answer": "The most common cause is oil or residue on the skin before application. Wipe the temple area with a dry tissue first, then press the device firmly for 4–5 seconds after placing. For high-sweat activities, use Athlete tapes instead of Comfort tapes. Tape is designed to last 3–4 days.", "count": 5}, {"question": "Is it normal for skin to feel irritated or show marks after removing the tape?", "customers": ["Dr Apoorva", "Ankush", "Ragini"], "answer": "Mild marks or slight redness on removal is common, especially in early weeks. Skin typically adapts within 1–2 tape cycles. Avoid reapplying to the exact same spot — rotate slightly. If irritation persists beyond 3–4 days, switch sides or contact us.", "count": 3}, {"question": "Does residue build up on the device sensor, and how should I clean it?", "customers": ["Ankush"], "answer": "Some glue residue on the device after removal is normal. Use a dry cloth or damp wipe to gently clean the contact points and sensor area. Avoid submerging the device specifically for cleaning. Keeping the sensor area clean ensures accurate readings.", "count": 1}], "Data Science": [{"question": "Why did the device miss detecting a meal, or flag a false eating detection?", "customers": ["Mayur", "Mohit", "Dr Apoorva", "Shivam", "Niharika"], "answer": "Chewing detection works on jaw movement patterns and is still being personalised per user. False positives (e.g. chewing gum, talking) can be dismissed and tagged as 'not eating' — this data trains your personal model. Liquids and small sips are not detected yet. Late notifications are being improved.", "count": 5}, {"question": "Why does the sleep tracking seem inaccurate — wrong start time, missed naps, or split sessions?", "customers": ["Mayur", "Nicco", "Rob Mohr", "Akshant"], "answer": "Sleep detection improves over the first 7 days as the device calibrates to your patterns. Brief wake-ups (under 10 mins) should now merge as one session. Nap detection is not yet live. If sleep data is missing, check battery didn't die mid-sleep — that causes a gap. You can manually edit sleep times in the app.", "count": 4}, {"question": "Calorie counts seem off — too high for food logged, or too low for workouts. Why?", "customers": ["Akshant", "Pulkit", "Rob Mohr"], "answer": "Food calorie estimates are AI-generated and occasionally inaccurate — flag these so we improve them. For workouts, Temple uses entropy-based calorie calculation rather than heart rate, which is more accurate for strength training but still being refined for high-intensity cardio (HIIT, cycling at threshold). Improvements are actively in progress.", "count": 3}, {"question": "Can the device detect drinks, liquids, or fluid intake?", "customers": ["Ragini", "Shagun"], "answer": "Not currently — detection is based on jaw chewing movements, so liquids (smoothies, coffee, water) are not picked up. This is on the roadmap.", "count": 2}], "Science Team": [{"question": "What does Entropy actually measure, and what brings it down?", "customers": ["Ajit", "Akanksha", "Kees", "Vatsal", "Merani"], "answer": "Entropy is your body's real-time metabolic rate — the total energy cost of what you're doing (physical activity + nervous system activity + baseline organ function). To lower it: meditation, breathwork, cold exposure, head-down tilt, and sleep. It naturally spikes during exercise, eating, and stress — and drops during rest and recovery.", "count": 5}, {"question": "Why does Entropy go above the 120/160 shown on the dial during workouts?", "customers": ["Kees", "Akshant"], "answer": "The dial shows up to 120 (or 160 on some versions) because that's where most users sit day-to-day. During intense workouts, entropy can reach 180–200+, which is normal and means your body is working hard. The full scale goes to 200 — the display will be updated to reflect this.", "count": 2}, {"question": "How is Focus measured, and why does it show low even during focused work?", "customers": ["Dr Apoorva", "Vatsal"], "answer": "Focus is a physiological signal measured from cerebral blood flow patterns — it reflects your brain's readiness state, not effort or concentration per se. Always log an activity when doing focused work (surgery, coding, meetings) so we can study and calibrate your personal focus signature.", "count": 2}, {"question": "What is Cognitive Work and how do I increase it?", "customers": ["Dr Apoorva", "Kunal Khambhati"], "answer": "Cognitive Work = Focus × hours. It's the total productive brain output over a period. To increase it: maintain high focus states for longer durations by keeping Entropy low before deep work sessions, sleeping well, and timing focused work during your natural Brain Flow peaks.", "count": 2}], "Tech": [{"question": "Data isn't loading, or the app is showing outdated/missing metrics — what's happening?", "customers": ["Ragini", "Vatsal", "Akshant"], "answer": "This is usually a sync delay. Try killing the app and reopening. Charts update on 5-minute intervals, so the last data point shown will be the last 5-minute mark — live data catches up within seconds of opening. If sleep data is missing after waking, wait a few minutes for backend processing to complete.", "count": 3}, {"question": "Notifications are either too frequent, delayed, or not firing at all — is this normal?", "customers": ["Ragini", "Vatsal", "Sumeet", "Niharika"], "answer": "Off-body reminders fire at regular intervals. Charge-complete notifications trigger once at 100% — if missed, a persistent banner is being added. Eating detection notifications are being tuned for timing. Push every 5 minutes after full charge is a bug — being fixed. Bluetooth-off notifications are on the roadmap.", "count": 4}, {"question": "The UI feels confusing in certain spots — ending an activity, calorie display, or chart readability.", "customers": ["Akshant", "Akanksha", "Vatsal"], "answer": "Known areas being improved: ending an activity requires 3-dot menu (intentional to keep screen clean, will be made clearer); calorie surplus/burned label can be confusing (fix in progress); chart data intervals are 5 minutes (not real-time by design). Feedback on specific screens is always welcome — send a screenshot.", "count": 3}], "Product Team": [{"question": "Is there or will there be a way to locate the device if it's lost or falls off?", "customers": ["Aakash", "Niharika", "Sumeet"], "answer": "Find My Temple is now live on app version v1.1.0. Update your app to access it. We also replace devices under Temple Care if they're lost or damaged.", "count": 3}, {"question": "Are third-party integrations like Strava, Apple Health, or Garmin planned?", "customers": ["Sumeet", "Avi & Rob", "Dhruv B"], "answer": "Apple Health integration is already live — go to Menu > Integrations > Apple Health. Strava is in active development (2–3 weeks). Automated Set Detection for workouts is also coming soon. More integrations are being prioritised based on demand.", "count": 3}, {"question": "Will there be a widget or quicker way to log food and check metrics without opening the app?", "customers": ["Sagar & Sahil", "Vatsal"], "answer": "A home screen widget is in development. It will show live Entropy and Brain Flow, and allow quick food logging and activity starts directly from the widget — no need to open the full app.", "count": 2}, {"question": "Can the device be shared between two people or used by someone else temporarily?", "customers": ["Dr Apoorva", "Nicco"], "answer": "Not currently — the device calibrates to one person's physiology and profile. Sharing without resetting produces inaccurate readings. A reset/share flow is on the roadmap. For now, contact support if you need a second device.", "count": 2}], "Manufacturing": [{"question": "Will there be more colour options, including options suited for women?", "customers": ["Dr Apoorva"], "answer": "Yes — three more colours are coming: Reflective Silver, True Gold, and Matte Titanium. Rose Gold for women is also being developed. Current users will be informed when new colours are available.", "count": 1}], "Support": [{"question": "How does device replacement work if the device is lost, damaged, or malfunctioning?", "customers": ["Mohit", "Sumeet", "Rahul Ganjoo", "Sagar & Sahil"], "answer": "All devices are covered under Temple Care — our in-house replacement programme. Contact your support group and we'll ship a replacement right away, no questions asked. For damaged devices, we may ask to collect the old unit for diagnosis. Replacements typically arrive within 1–2 business days (India).", "count": 4}]}};
const CLASS_ORDER = ["Problem","Negative","Positive","Suggestion","Question"];

const ADMIN_EMAILS=["arjun@temple.com","aaqib@temple.com","kushagra@temple.com","jalaj@temple.com","ramni@temple.com","neha@temple.com","dhruv@temple.com","vidushi@temple.com","samdeesh@temple.com","aman.kant@temple.com","chandan@temple.com","shalabh@temple.com","ajay@temple.com","sahil@temple.com","eshaan@temple.com","deepinder@temple.com"];
const FULL_EMAILS=["padmalaya@temple.com"];
function roleFor(email){const e=(email||"").trim().toLowerCase();
  if(ADMIN_EMAILS.map(x=>x.toLowerCase()).indexOf(e)>=0)return "admin";
  if(FULL_EMAILS.map(x=>x.toLowerCase()).indexOf(e)>=0)return "full";
  return "regular";}
const SESSION_KEY="temple_session_v1";
let SESSION=null;try{SESSION=JSON.parse(sessionStorage.getItem(SESSION_KEY)||"null");}catch(e){}
function decodeJwt(t){try{const p=t.split(".")[1];const j=decodeURIComponent(atob(p.replace(/-/g,"+").replace(/_/g,"/")).split("").map(c=>"%"+("00"+c.charCodeAt(0).toString(16)).slice(-2)).join(""));return JSON.parse(j);}catch(e){return null;}}
function isAdmin(){return SESSION&&SESSION.role==="admin";}
function isFull(){return SESSION&&SESSION.role==="full";}
function canSeeSensitive(){return isAdmin()||isFull();}
function visibleRecords(){return canSeeSensitive()?DATA.records:DATA.records.filter(r=>String(r.sensitive).toUpperCase()!=="TRUE");}
const GOOGLE_CLIENT_ID="667916747255-7m7o2oal769bdoaqe4n5t3upfbm84oag.apps.googleusercontent.com";
function showLoginErr(msg){const e=document.getElementById("login-err");if(e){e.textContent=msg;e.classList.add("show");}}
function handleGoogleSignIn(response){
  const errEl=document.getElementById("login-err");
  if(!response||!response.credential){showLoginErr("Sign-in didn't complete. Please try again.");return;}
  const payload=decodeJwt(response.credential);
  if(!payload||!payload.email||!payload.email_verified){showLoginErr("Could not verify your Google account. Please try again.");return;}
  const email=payload.email.toLowerCase();
  if(!email.endsWith("@temple.com")){showLoginErr("Please sign in with your @temple.com Google account.");return;}
  errEl.classList.remove("show");
  SESSION={email,role:roleFor(email)};
  try{sessionStorage.setItem(SESSION_KEY,JSON.stringify(SESSION));}catch(e){}
  enterApp();}
// Explicit GSI initialization — more reliable than data-attribute auto-init, enables FedCM,
// and surfaces errors instead of silently stalling after account selection.
function initGoogleSignIn(){
  if(!(window.google&&google.accounts&&google.accounts.id)){
    // GSI script not ready yet — retry shortly.
    return setTimeout(initGoogleSignIn,200);
  }
  try{
    google.accounts.id.initialize({
      client_id:GOOGLE_CLIENT_ID,
      callback:handleGoogleSignIn,
      use_fedcm_for_prompt:true,
      auto_select:false,
      cancel_on_tap_outside:true
    });
    const btn=document.getElementById("gsi-button");
    if(btn){
      google.accounts.id.renderButton(btn,{type:"standard",size:"large",theme:"filled_black",text:"signin_with",shape:"rectangular",logo_alignment:"left",width:300});
    }
  }catch(e){
    showLoginErr("Google Sign-In failed to load. Check your connection and refresh. ("+(e&&e.message?e.message:e)+")");
  }
}
function logout(){SESSION=null;try{sessionStorage.removeItem(SESSION_KEY);}catch(e){}
  document.getElementById("app-view").hidden=true;document.getElementById("login-view").hidden=false;
  if(window.google&&google.accounts&&google.accounts.id)google.accounts.id.disableAutoSelect();}
function enterApp(){
  document.getElementById("login-view").hidden=true;document.getElementById("app-view").hidden=false;
  const label=isAdmin()?"admin":(isFull()?"Hardware/Adhesion":"team member");
  document.getElementById("who-tag").innerHTML=`<b>${esc(SESSION.email)}</b> · ${label} <button class="logout-btn" onclick="logout()">sign out</button>`;
  render();}

const app = document.getElementById('app');
let state = {view:'home', tab:'team', sel:null, subtab:'overview', fSub:null, fClass:null};

function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function by(arr,k){const m={};arr.forEach(r=>{(m[r[k]]=m[r[k]]||[]).push(r)});return m;}
function countClass(rows){const c={};CLASS_ORDER.forEach(x=>c[x]=0);rows.forEach(r=>{if(c[r.classification]!=null)c[r.classification]++});return c;}
function cardInner(rows,label,openLabel){
  const probs=rows.filter(r=>r.classification=='Problem');
  const bySub={};probs.forEach(r=>{bySub[r.subcategory]=(bySub[r.subcategory]||0)+1});
  let top=null,topn=0;for(const k in bySub){if(bySub[k]>topn){top=k;topn=bySub[k]}}
  const topline = top?`Top issue: <b>${esc(top)}</b> (${topn})`:'No problems yet';
  return `<div class="big">${rows.length}</div>
    <div class="nm">${esc(label)}</div>
    <hr class="cdiv">
    <div class="ctop">${topline}</div>
    <div class="copen">${openLabel} →</div>`;
}

function home(){
  const R=visibleRecords();const teams = by(R,'area'), members = by(R,'member');
  let h = `<div class="tabs">
    <button class="tab ${state.tab=='team'?'on':''}" onclick="setTab('team')">By team</button>
    <button class="tab ${state.tab=='member'?'on':''}" onclick="setTab('member')">By member</button></div>`;
  if(state.tab=='team'){
    h += '<div class="grid">';
    Object.keys(teams).sort((a,b)=>teams[b].length-teams[a].length).forEach(t=>{
      h += `<div class="card" onclick="openTeam('${esc(t)}')">${cardInner(teams[t],t,'Open team')}</div>`;});
    h += '</div>';
  } else {
    h += '<div class="grid">';
    Object.keys(members).sort((a,b)=>members[b].length-members[a].length).forEach(m=>{
      h += `<div class="card" onclick="openMember(${JSON.stringify(m).replace(/"/g,'&quot;')})">${cardInner(members[m],m,'Open member')}</div>`;});
    h += '</div>';
  }
  app.innerHTML = h;
}

function tableRows(rows){
  return `<table><thead><tr><th>Member</th><th>Date</th><th>Feedback</th><th>Type</th><th>Answer / Remark</th></tr></thead><tbody>`+
    rows.map(r=>`<tr>
      <td>${esc(r.member)}</td>
      <td>${esc(r.date)}</td>
      <td><div class="txt">${esc(r.text)}</div></td>
      <td><span class="badge b-${r.classification}">${esc(r.classification)}</span></td>
      <td><div class="ans">${esc(r.answer)||'—'}</div></td>
    </tr>`).join('')+`</tbody></table>`;
}

function stackBar(groups, onClickFn, activeKey){ // groups: {label: rows}; onClickFn: name of fn taking the label
  const keys = Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length);
  const max = Math.max(1,...keys.map(k=>groups[k].length));
  return '<div class="stack">'+keys.map(k=>{
    const c=countClass(groups[k]);const tot=groups[k].length;
    const clickable = onClickFn ? ` onclick="${onClickFn}('${esc(k)}')" style="cursor:pointer"` : '';
    const active = activeKey===k ? ' rowbar-active' : '';
    return `<div class="row-bar${active}"${clickable}><div class="lbl">${esc(k)} · ${tot}</div>
      <div class="bar" style="width:${tot/max*100}%">`+
      CLASS_ORDER.map(cl=>c[cl]?`<span title="${cl}: ${c[cl]}" style="width:${c[cl]/tot*100}%;background:${CLASS_COL[cl]}"></span>`:'').join('')+
      `</div></div>`;}).join('')+'</div>';
}

function openTeam(t){state.view='team';state.sel=t;state.subtab='overview';state.fSub=null;state.fClass=null;render();}
function openMember(m){state.view='member';state.sel=m;state.fClass=null;render();}
function setTab(t){state.tab=t;render();}
function goHome(){state.view='home';state.sel=null;render();}
function setSub(s){state.fSub=state.fSub==s?null:s;render();}
function setClass(c){state.fClass=state.fClass==c?null:c;render();}
function setSubtab(s){state.subtab=s;render();}

function teamView(){
  const t=state.sel; let rows=visibleRecords().filter(r=>r.area==t);
  const subs=by(rows,'subcategory');
  let h=`<div class="crumb"><button class="back" onclick="goHome()">← All</button>
    <div class="detail-h">${esc(t)}</div></div>`;
  h+=`<div class="subtabs">
    <button class="subtab ${state.subtab=='overview'?'on':''}" onclick="setSubtab('overview')">Overview</button>
    <button class="subtab ${state.subtab=='faq'?'on':''}" onclick="setSubtab('faq')">FAQ</button></div>`;
  if(state.subtab=='faq'){
    const f=(DATA.faq[t]||[]);
    h+=`<div class="panel"><h3>FAQ — ${esc(t)}</h3>`+
      (f.length?f.map(q=>`<div class="faqq"><div class="q">${esc(q.question)}</div>
        <div class="a">${esc(q.answer)}</div>
        ${q.customers&&q.customers.length?`<div class="who">Asked by: ${q.customers.map(esc).join(', ')}</div>`:''}</div>`).join(''):'<div class="ans">No FAQ entries.</div>')+
      `</div>`;
    app.innerHTML=h;return;
  }
  h+=`<div class="panel"><h3>By subcategory <span style="font-family:system-ui,sans-serif;font-weight:400;font-size:12px;color:var(--ink-dim);letter-spacing:0">· click any bar to filter</span></h3>${stackBar(subs,'setSub',state.fSub)}</div>`;
  // filters
  h+='<div class="chips">'+Object.keys(subs).sort().map(s=>`<button class="chip ${state.fSub==s?'on':''}" onclick="setSub('${esc(s)}')">${esc(s)}</button>`).join('')+'</div>';
  h+='<div class="chips">'+CLASS_ORDER.map(c=>`<button class="chip ${state.fClass==c?'on':''}" onclick="setClass('${c}')">${c}</button>`).join('')+'</div>';
  let fr=rows;
  if(state.fSub)fr=fr.filter(r=>r.subcategory==state.fSub);
  if(state.fClass)fr=fr.filter(r=>r.classification==state.fClass);
  h+=`<div class="stat">${fr.length} of ${rows.length} records</div>`;
  h+=tableRows(fr);
  app.innerHTML=h;
}

function memberView(){
  const m=state.sel; let rows=visibleRecords().filter(r=>r.member==m);
  const areas=by(rows,'area');
  let h=`<div class="crumb"><button class="back" onclick="goHome()">← All</button>
    <div class="detail-h">${esc(m)}</div></div>`;
  h+=`<div class="panel"><h3>By team</h3>${stackBar(areas)}</div>`;
  h+='<div class="chips">'+CLASS_ORDER.map(c=>`<button class="chip ${state.fClass==c?'on':''}" onclick="setClass('${c}')">${c}</button>`).join('')+'</div>';
  let fr=rows; if(state.fClass)fr=fr.filter(r=>r.classification==state.fClass);
  h+=`<div class="stat">${fr.length} of ${rows.length} records</div>`;
  h+=tableRows(fr);
  app.innerHTML=h;
}

function render(){
  // Always enforce correct view visibility so navigation never re-shows the login screen.
  if(SESSION&&SESSION.email){
    document.getElementById("login-view").hidden=true;
    document.getElementById("app-view").hidden=false;
  }
  if(state.view=='home')home();
  else if(state.view=='team')teamView();
  else if(state.view=='member')memberView();
  window.scrollTo(0,0);
}
(function(){
  if(SESSION&&SESSION.email){SESSION={email:SESSION.email,role:roleFor(SESSION.email)};enterApp();}
  else{document.getElementById("login-view").hidden=false;initGoogleSignIn();}
})();
</script>
</body>
</html>
