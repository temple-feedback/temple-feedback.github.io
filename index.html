<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Member Feedback — Temple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --parch:#161616; --parch2:#1f1f1f;
  --espresso:#1E1E1E; --espresso2:#262626; --espresso3:#323232;
  --bronze:#C79A5B; --bronze-dim:#B08343;
  --ink:#F2EFEA; --ink-dim:#B3ABA0; --ink-faint:#807a72;
  --line:rgba(199,154,91,.24);
  --pr-bg:#e4cafe;--pr-tx:#4c1d95;--ne-bg:#fdb8b8;--ne-tx:#7f1d1d;
  --po-bg:#a7f3c0;--po-tx:#14532d;--su-bg:#aed6fd;--su-tx:#1e3a8a;
  --qu-bg:#fde08a;--qu-tx:#78350f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--parch);color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;
  background-image:radial-gradient(circle at 12% -10%,rgba(199,154,91,.07),transparent 42%);}
.wrap{max-width:1600px;margin:0 auto;padding:28px 40px 80px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:30px;letter-spacing:-.01em;margin:0;color:var(--ink)}
h1 .f{color:var(--bronze-dim)}
.sub{color:var(--ink-dim);font-size:13px;margin:2px 0 22px}
.tabs{display:flex;gap:8px;margin:0 0 22px}
.tab{font-family:'Inter';font-weight:600;font-size:14px;padding:9px 18px;border-radius:999px;border:1px solid var(--line);
  background:transparent;color:var(--ink-dim);cursor:pointer;transition:.15s}
.tab.on{background:var(--ink);color:#161616;border-color:var(--ink)}
.tab:not(.on):hover{background:var(--espresso2)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{background:var(--espresso);color:var(--ink);border-radius:18px;padding:30px 30px 26px;cursor:pointer;
  border:1px solid var(--espresso3);transition:.16s;position:relative;overflow:hidden;min-height:150px}
.card:hover{transform:translateY(-2px);border-color:var(--bronze);box-shadow:0 12px 30px -16px rgba(0,0,0,.8)}
.card .nm{font-family:'Fraunces',serif;font-weight:600;font-size:24px;letter-spacing:-.01em;line-height:1.15}
.card .big{font-size:17px;color:var(--bronze);font-weight:600;margin-top:12px}
.card .big small{color:var(--ink-dim);font-weight:400;font-size:13px;margin-left:4px}
.crumb{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.back{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;cursor:pointer;
  font-weight:600;color:var(--ink);font-size:13px}
.back:hover{background:var(--espresso2)}
.detail-h{font-family:'Fraunces',serif;font-weight:600;font-size:26px;margin:0;color:var(--ink)}
.panel{background:var(--espresso);color:var(--ink);border-radius:18px;padding:20px;margin-bottom:18px;border:1px solid var(--espresso3)}
.panel h3{font-family:'Fraunces',serif;font-weight:600;font-size:16px;margin:0 0 14px;color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:10px}
.row-bar{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:12px;border-radius:6px;padding:3px 4px;transition:background .12s}
.row-bar[onclick]:hover{background:var(--espresso2,rgba(255,255,255,.05))}
.row-bar[onclick]:hover .lbl{color:var(--ink)}
.rowbar-active{background:var(--espresso2,rgba(255,255,255,.08))}
.rowbar-active .lbl{color:var(--ink);font-weight:600}
.row-bar .lbl{font-size:12.5px;color:var(--ink-dim);text-align:right}
.bar{display:flex;height:20px;border-radius:5px;overflow:hidden;background:var(--espresso3)}
.bar span{display:block;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 16px}
.chip{font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;
  color:var(--ink-dim);cursor:pointer;font-weight:500}
.chip.on{background:var(--bronze);border-color:var(--bronze);color:#2a1c0f;font-weight:600}
table{width:100%;border-collapse:collapse;background:var(--espresso);border-radius:14px;overflow:hidden;border:1px solid var(--espresso3)}
th{background:var(--espresso2);color:var(--ink-dim);font-weight:600;font-size:11.5px;text-transform:uppercase;
  letter-spacing:.04em;text-align:left;padding:11px 13px}
td{padding:12px 13px;border-top:1px solid rgba(176,131,67,.14);color:var(--ink);font-size:13px;vertical-align:top}
tr:hover td{background:var(--espresso2)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.b-Problem{background:var(--pr-bg);color:var(--pr-tx)}
.b-Negative{background:var(--ne-bg);color:var(--ne-tx)}
.b-Positive{background:var(--po-bg);color:var(--po-tx)}
.b-Suggestion{background:var(--su-bg);color:var(--su-tx)}
.b-Question{background:var(--qu-bg);color:var(--qu-tx)}
.src{font-size:10.5px;color:var(--ink-faint);font-weight:500}
.ans{color:var(--ink-dim);font-size:12.5px;white-space:pre-wrap}
.txt{white-space:pre-wrap}
.faqq{border-top:1px solid rgba(176,131,67,.14);padding:13px 0}
.faqq:first-child{border-top:none}
.faqq .q{font-weight:600;color:var(--ink)}
.faqq .a{color:var(--ink-dim);font-size:12.5px;margin-top:5px;white-space:pre-wrap}
.faqq .who{color:var(--ink-faint);font-size:11px;margin-top:5px}
.stat{color:var(--ink-dim);font-size:12px;margin:-6px 0 16px}
.subtabs{display:flex;gap:6px;margin:0 0 16px}
.subtab{font-size:13px;font-weight:600;padding:7px 15px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--ink-dim);cursor:pointer}
.subtab.on{background:var(--ink);color:#161616;border-color:var(--ink)}
@media(max-width:560px){.row-bar{grid-template-columns:100px 1fr}.wrap{padding:20px 14px 60px}.grid{grid-template-columns:1fr}}
@media(min-width:561px) and (max-width:860px){.grid{grid-template-columns:repeat(2,1fr)}}

.card{padding:26px 24px 22px}
.card .big{position:absolute;top:18px;right:20px;font-size:20px;color:var(--bronze);font-weight:700;margin:0}
.card .nm{padding-right:44px}
.cstats{color:var(--ink-dim);font-size:12.5px;margin-top:10px}
.cdiv{border:none;border-top:1px dashed rgba(176,131,67,.30);margin:14px 0 12px}
.ctop{font-size:13px;color:var(--ink-dim)}
.ctop b{color:var(--ink);font-weight:600}
.copen{margin-top:14px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--bronze);font-weight:600}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
[hidden]{display:none !important}
.login-card{background:var(--espresso);border:1px solid var(--espresso3);border-radius:20px;padding:44px 40px;max-width:420px;width:100%;text-align:center}
.login-title{font-family:'Fraunces',serif;font-weight:600;font-size:26px;color:var(--ink);margin-bottom:10px}
.login-sub{font-size:14px;color:var(--ink-dim);margin-bottom:28px;line-height:1.55}
.gsi-wrap{display:flex;justify-content:center;margin-bottom:10px}
.login-err{font-size:12px;color:#fca5a5;margin-top:14px;display:none}
.login-err.show{display:block}
.who-bar{display:flex;align-items:center;gap:14px}
.who-tag{font-size:13px;color:var(--ink-dim);margin-left:auto}
.who-tag b{color:var(--ink)}
.logout-btn{background:none;border:none;font-family:inherit;color:var(--ink-dim);font-size:13px;cursor:pointer;text-decoration:underline;padding:0;margin-left:8px}
.logout-btn:hover{color:var(--ink)}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="login-wrap" id="login-view" hidden>
  <div class="login-card">
    <div class="login-title">Member Feedback</div>
    <div class="login-sub">Sign in with your Temple Google account to continue.</div>
    <div class="gsi-wrap"><div id="gsi-button"></div></div>
    <div class="login-err" id="login-err">That email isn't on the access list. Contact your admin.</div>
  </div>
</div>
<div class="wrap" id="app-view" hidden>
  <header class="top">
    <div class="who-bar" style="width:100%">
      <h1>Member Feedback</h1>
      <span class="who-tag" id="who-tag"></span>
    </div>
  </header>
  <div id="app"></div>
</div>

<script>
const DATA = {"records": [{"id": "WA-011", "member": "Akanksha", "group": "Akanksha", "date": "03/06–07/06", "source": "WhatsApp+Slack", "area": "Science Team", "subcategory": "Entropy", "classification": "Question", "text": "Several Entropy observations: it stays high for about an hour after waking without coming down; there is a large, reproducible left-vs-right difference (~30-40 points, right side high and left much lower); and during an anxiety episode her heart rate spiked noticeably but Entropy showed no change, though she expected it to reflect the anxiety.", "answer": "Entropy drops overnight after good sleep; allow ~3 days to calibrate (ice on the face and breathwork can help lower it). Left/right differences can occur from blood-flow differences between sides, and the newer metric reduces this variability. Anxiety produces only ~10-30% metabolic spikes so may not stand out; the new Entropy (v2) is more robust, with better in-app education planned.", "sensitive": "", "notes": "Collapsed block (5 instances): WA-011, WA-013, WA-014, WA-216, SL-086"}, {"id": "WA-012", "member": "Akanksha", "group": "Akanksha", "date": "04/06–01/07", "source": "WhatsApp+Slack", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Problem", "text": "Three app-UX points: the 'surplus' calorie tag was momentarily confusing (read as being surplus by 1516); the active-calories-burned bar is red, which reads as underperformance like the Diffused Focus state (should it be green?); and days with no logged meals should collapse into a single snippet, plus she expects a left-swipe to reach previous days.", "answer": "On the tag: total consumed was 1516 with 1500 burned, so surplus was a marginal 16. Red on active calories is intentional for the 'burn' connotation; green is reserved for goal/target completion. On the timeline: a continuous timeline makes swipe navigation incorrect, so filters, a calendar and an end-of-day summary with a collapsed timeline are planned.", "sensitive": "", "notes": "Collapsed block (3 instances): WA-012, WA-015, SL-025"}, {"id": "WA-016", "member": "Akanksha", "group": "Akanksha", "date": "13/06", "source": "WhatsApp+Slack", "area": "Product Team", "subcategory": "Women's Health", "classification": "Problem", "text": "Period-tracker feedback: it auto-logs dates on first use without an Apple Health sync (unclear where the estimate comes from); de-selection should be a simple tap on the calendar date (the edit button is hard to find); the calendar should be forward-scrollable to show the ovulation window; and the prediction hierarchy looks off ('period in X days' feels wrong when the current cycle has just started).", "answer": "Being picked up on the women's-health side: auto-log to be handled via onboarding, de-selection to be checked, forward-scroll to be evaluated (currently possible via the calendar), and the prediction hierarchy to be changed.", "sensitive": "", "notes": "Collapsed block (2 instances): WA-016, SL-064"}, {"id": "WA-158", "member": "Amit & Shveta", "group": "Amit & Shveta", "date": "03/06–10/06", "source": "WhatsApp+Slack", "area": "Adhesion", "subcategory": "Tapes", "classification": "Problem", "text": "Several tape issues: the sticky bit sometimes transfers onto the yellow strip when removing it; the device can be taken off and restuck, but a spare strip isn't always on hand when away from home; and the Temple came off during tennis and a dance session, with worry about it coming off during runs.", "answer": "The strip transfer rarely happens and we're working to eliminate it. A more sweat-resistant version of the grips is in the works and will be sent to try.", "sensitive": "", "notes": "Collapsed block (4 instances): WA-158, WA-162, WA-164, SL-080"}, {"id": "WA-032", "member": "Ankush", "group": "Ankush", "date": "23/05–02/07", "source": "WhatsApp+Slack", "area": "Hardware/Firmware", "subcategory": "Battery", "classification": "Suggestion", "text": "Recurring battery concerns: initial life was ~3.5 days (he'd like it to match the 3-4 day tape life) and he'd value a low-battery 'light mode' for long-haul travel. More recently the battery degraded to under 2 full days after ~5 weeks, and once dropped from full to 18% in ~23 hours with no activity. On one occasion the device disconnected after an 18-hour flight, a firmware update failed, and the PPG light stopped showing.", "answer": "Battery is designed around the 3-4 day tape rhythm to keep skin comfortable; a light mode was noted with the product team. The flight/disconnect case: the device entered ship mode from a high-discharge-rate fault (earlier prolonged workout-state discharge from a firmware bug contributed) and the unit was recalled. Paused or unfinished workouts kept per-second duty cycling and drained faster — addressed on the latest firmware, so a paused workout no longer drains the battery.", "sensitive": "", "notes": "Collapsed block (5 instances): WA-032, WA-035, SL-012, SL-013, SL-024"}, {"id": "WA-031", "member": "Ankush", "group": "Ankush", "date": "23/05–12/06", "source": "WhatsApp+Slack", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Suggestion", "text": "Three requests: an option to dismiss/snooze the eating-detection prompt for small nibbles (while still logging major meals); a clearer way to end an activity (he paused instead of ending it because stopping wasn't obvious); and a low-battery mode.", "answer": "Dismiss/snooze on the eating prompt is on the roadmap. Ending an activity will be made more discoverable — pausing will surface an end-workout option, with auto-pause/auto-end coming. A low-battery mode was parked in favour of dynamic sampling, since at ~1 data point/hour it degrades chewing, sleep detail, recovery and HRV too much.", "sensitive": "", "notes": "Collapsed block (3 instances): WA-031, SL-067, SL-070"}, {"id": "WA-033", "member": "Ankush", "group": "Ankush", "date": "12/06", "source": "WhatsApp+Slack", "area": "Adhesion", "subcategory": "Residue", "classification": "Problem", "text": "Residual glue is left on the device (and over the sensor) when the tape is removed to charge every ~3 days; he'd like cleaning guidance that won't damage the device or scratch the sensor.", "answer": "Use an alcohol swab to clean gently — avoid dry cloth or tissue, which can stick. Residue is worse if removed right after a shower or workout; he noted it happens towards the end of the battery cycle. A better long-term solution is being explored.", "sensitive": "", "notes": "Collapsed block (2 instances): WA-033, SL-069"}, {"id": "WA-048", "member": "Dr Apoorva", "group": "Dr Apoorva", "date": "31/05–02/07", "source": "WhatsApp+Slack", "area": "Tech", "subcategory": "App Crashes", "classification": "Problem", "text": "A few app issues: an app-crash notification on waking (and an iOS crash dialog on another occasion); no option to start a second activity right after ending the first; and a timeline-logged 'Surgery' showed all vitals but not Focus.", "answer": "The crash came from a race condition in the BLE command stack (surfaced by the new auto-detected-workout Aerobar but possible in normal use); fixed, and she's on the fixed version. Back-to-back activities should work — being checked. The missing Focus on 'Surgery' was because it was a pre-existing custom activity; duplicate entries fixed.", "sensitive": "", "notes": "Collapsed block (4 instances): WA-048, WA-049, WA-051, SL-101"}, {"id": "WA-044", "member": "Dr Apoorva", "group": "Dr Apoorva", "date": "19/05", "source": "WhatsApp+Slack", "area": "Science Team", "subcategory": "Cognitive Metrics", "classification": "Question", "text": "Questions around Cognitive Work: what it is and how to increase it, and why logging 'Surgery' didn't surface Focus / Cognitive Work on the detail pages.", "answer": "Cognitive Work is focus x hours, so low focus means low CW. 'Surgery' was a pre-existing custom activity (created before it was catalogued), so Focus/CW weren't attached; deduplication now makes the global activity take precedence.", "sensitive": "", "notes": "Collapsed block (2 instances): WA-044, SL-068"}, {"id": "WA-184", "member": "Jeph", "group": "Jeph", "date": "19/06–01/07", "source": "WhatsApp+Slack", "area": "Tech", "subcategory": "Android Bugs", "classification": "Problem", "text": "Two Android issues: the charge-complete notification didn't fire, and after confirming a meal the home meal card doesn't show a loading state and renders incorrectly until the page is reloaded.", "answer": "The charge-notification issue is being checked. The meal-card bug was identified and a hotfix shipped (v0.2.024), live after review.", "sensitive": "", "notes": "Collapsed block (2 instances): WA-184, SL-046"}, {"id": "WA-110", "member": "Joel & Joy", "group": "Joel & Joy", "date": "13/06–14/06", "source": "WhatsApp+Slack", "area": "Hardware/Firmware", "subcategory": "Battery", "classification": "Problem", "text": "Battery appeared to discharge quickly — around 58% in the morning down to low by evening, continuing after a morning run.", "answer": "Discharge was in line with usage — 58% on the evening of the 13th to ~40% the next morning, and ~1.69%/hr for the run session with normal temperatures. Battery trends are coming to the app soon.", "sensitive": "", "notes": "Collapsed block (2 instances): WA-110, SL-061"}, {"id": "WA-055", "member": "Mayur", "group": "Mayur", "date": "10/06–16/06", "source": "WhatsApp+Slack", "area": "Data Science", "subcategory": "Chewing Detection", "classification": "Problem", "text": "Recurring meal-detection misses: dinner (9-10:30pm) not recorded one night; on another day lunch, a 3-hour dinner and two snacks all went undetected; two further meals (~8:15pm and ~9pm) not detected; and his morning coffee with coconut milk wasn't recorded.", "answer": "Being investigated — a required detection threshold wasn't met on the dinners, and a per-user personalization approach is in progress (a slightly lower threshold would have caught them), targeting end of week. Liquid intake such as coffee can't be detected without chewing movement; gulping detection is being explored.", "sensitive": "", "notes": "Collapsed block (4 instances): WA-055, WA-058, SL-074, SL-088b"}, {"id": "WA-054", "member": "Mayur", "group": "Mayur", "date": "05/06–30/06", "source": "WhatsApp+Slack", "area": "Data Science", "subcategory": "Sleep Tracking", "classification": "Problem", "text": "Recurring sleep issues: sleep onset logged 50-75 minutes later than when he actually fell asleep on multiple nights; evening naps (e.g. 6-9:30pm) not recorded or surfaced; and on one 9-hour night the device ran out of charge mid-sleep and then showed an alarming post-charge display.", "answer": "Sleep-onset detection is being improved. Naps are detected internally (e.g. 5:58-9:30pm) but not yet surfaced separately (in progress). If the device loses charge mid-sleep it can't reconstruct the rest of the night and should show 'insufficient data' rather than an alarming readout — being fixed.", "sensitive": "", "notes": "Collapsed block (6 instances): WA-054, WA-056, WA-057, SL-008, SL-055b, SL-088a"}, {"id": "WA-122", "member": "Nicco", "group": "Nicco", "date": "02/06–02/07", "source": "WhatsApp+Slack", "area": "Data Science", "subcategory": "Sleep Tracking", "classification": "Problem", "text": "Slept ~6 hours, but a ~5-minute wake to drink split the night and the tracker counted only ~3 hours — the two sleep windows didn't merge.", "answer": "The second window read very awake-ish (high motion/blinks), likely a flat-bed flight raising the noise floor, so no sleep was detected there. It should merge given time; fixed for this case in the backend, with a broader adaptive-threshold fix in testing.", "sensitive": "", "notes": "Collapsed block (2 instances): WA-122, SL-100"}, {"id": "WA-069", "member": "Prerna", "group": "Prerna", "date": "06/06", "source": "WhatsApp+Slack", "area": "Adhesion", "subcategory": "Tapes", "classification": "Problem", "text": "The device slips off during intense, sweaty workouts — on almost every heavy session (for example a Murph CrossFit workout).", "answer": "Larger, device-sized tapes (~0.2mm bigger) were sent for more adhesion, under trial where comfort tapes don't hold; confirming whether she's on Athlete or Comfort tapes.", "sensitive": "", "notes": "Collapsed block (2 instances): WA-069, SL-094"}, {"id": "WA-083", "member": "Ragini", "group": "Ragini", "date": "13/05–02/07", "source": "WhatsApp+Slack", "area": "Tech", "subcategory": "Sync & Data", "classification": "Problem", "text": "Recurring connectivity/sync problems: data not loading after an update; the app stuck on 'Connecting' in the early morning across days; the device sometimes won't connect after repeated taps (unpair button not working, device not discoverable); and a ~14-hour sync backlog despite keeping the app open.", "answer": "Investigated: on one occasion the last battery reading was 0 and the device hadn't connected since (forget + re-pair suggested). Overnight, the connection was lost out of Bluetooth range and the OS wake-ups didn't re-attempt a reconnect; an auto-reconnect-after-restart fix shipped, with remaining wake-up cases being worked on. Updates now happen in the background.", "sensitive": "", "notes": "Collapsed block (4 instances): WA-083, WA-084, SL-056, SL-110"}, {"id": "WA-232", "member": "Rohin Thampi", "group": "Rohin", "date": "22/05", "source": "WhatsApp+Slack", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Suggestion", "text": "Two requests: an hourly trend chart for Physical and Cognitive work (like the focus chart) to review what drove changes; and a clearer charger charge-level indicator, since the LED wasn't intuitive to interpret.", "answer": "The trend chart is being shipped shortly. The charger LED currently means white = more than one full charge, yellow = less than one, red = empty; the charger doesn't relay state to the app, so a clearer indicator is planned for later versions.", "sensitive": "", "notes": "Collapsed block (2 instances): WA-232, SL-093"}, {"id": "WA-204", "member": "Priyanka (SVG)", "group": "Priyanka (SVG)", "date": "17/06–01/07", "source": "WhatsApp+Slack", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Suggestion", "text": "Meal logging is slow — you must wait for an image to fully upload before logging (it should happen in the background) — and editing a meal takes an unnecessary extra step (serving-size page first, then another tap for dish details). Separately, it would help to see charging-pod charge info in the app and to track the pod itself to avoid misplacing it.", "answer": "Background image upload is going live (won't block logging); the meal-edit flow revamp is in the pipeline. Charging-pod charge info and pod tracking are both being looked into.", "sensitive": "", "notes": "Collapsed block (4 instances): WA-204, WA-209, SL-043b, SL-043c"}, {"id": "WA-205", "member": "Priyanka (SVG)", "group": "Priyanka (SVG)", "date": "17/06–01/07", "source": "WhatsApp+Slack", "area": "Product Team", "subcategory": "Women's Health", "classification": "Suggestion", "text": "Period logging doesn't sync with Apple Health (so it lacks her past logs) and the logging UX is cumbersome — she'd want a 1-tap log with optional details. The flower graphic that wilts as the cycle progresses felt wrong, unempathetic and unnecessary.", "answer": "Apple Health period sync is being checked; the flower imagery is being reconsidered for a better representation.", "sensitive": "", "notes": "Collapsed block (3 instances): WA-205, SL-043d, SL-043e"}, {"id": "WA-199", "member": "Salil Sharma", "group": "Salil Sharma", "date": "22/06–01/07", "source": "WhatsApp+Slack", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Suggestion", "text": "When the app highlights 'Your Best' or 'Your Highest' for a metric like Entropy, it would help to see the context — whether it was during sleep, exercise or recovery, and the associated event or time — to understand personal patterns.", "answer": "", "sensitive": "", "notes": "Collapsed block (2 instances): WA-199, SL-032b"}, {"id": "WA-211", "member": "Sumeet", "group": "Sumeet", "date": "22/06–01/07", "source": "WhatsApp+Slack", "area": "Data Science", "subcategory": "Calorie Tracking", "classification": "Problem", "text": "Calorie figures don't match the food's own label — including near-zero calories for 10 almonds or pistachios, and mismatches even when a label photo is provided.", "answer": "Root cause was a unit issue: 'almonds' logged as a default 'serving' (~15g handful) overstated calories, and the user's downward edit was saved as a per-gram preference, so a later 'pieces' entry pulled values to ~0. Fixed by tagging countable items as 'piece' and clearing the bad saved macros; the prompt now also reads macros from the label image, not just typed text.", "sensitive": "", "notes": "Collapsed block (3 instances): WA-211, SL-018, SL-030"}, {"id": "WA-255", "member": "Varun Alagh", "group": "Alaghs", "date": "10/05–02/06", "source": "WhatsApp+Slack", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Suggestion", "text": "Concerns that UI choices drive behaviour: the large calorie/deficit display nudges him to over-consume, and a low physical-effort goal made him feel he shouldn't have worked out — a display that adapts to lifestyle or goals would help. He also wants a Find My Temple option, and the firmware-upgrade banner looks like a warning and isn't obviously clickable.", "answer": "The calorie/behaviour UI is under active iteration. Find My Temple is in the works. An Update button will be added to the firmware banner, with interim handling while moving to OTA.", "sensitive": "", "notes": "Collapsed block (4 instances): WA-255, WA-260, WA-267, SL-098"}, {"id": "WA-152", "member": "Vidur", "group": "Vidur", "date": "01/06–01/07", "source": "WhatsApp+Slack", "area": "Hardware/Firmware", "subcategory": "Charger", "classification": "Suggestion", "text": "Wants the charger/battery box to also hold the grips — the charger is always used alongside the tapes, and he stashes grips in his car and wallet and loses them.", "answer": "A charger pouch with a pocket for the tapes is being made.", "sensitive": "", "notes": "Collapsed block (2 instances): WA-152, SL-020a"}, {"id": "WA-150", "member": "Vidur", "group": "Vidur", "date": "30/05–21/06", "source": "WhatsApp+Slack", "area": "Science Team", "subcategory": "Entropy", "classification": "Suggestion", "text": "The FAQ and app don't describe Entropy or its drivers/constituents — he'd like to know what goes into a metric he's running his life by. He also noted Entropy isn't visible during sleep.", "answer": "Entropy documentation is in progress, including a white paper. Entropy not showing during sleep is intentional.", "sensitive": "", "notes": "Collapsed block (2 instances): WA-150, SL-035a"}, {"id": "WA-151", "member": "Vidur", "group": "Vidur", "date": "01/06–02/06", "source": "WhatsApp+Slack", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Suggestion", "text": "Several requests: a plain-language 'what is this device?' FAQ entry (also in local language); a single chart showing Entropy, CBF and HR together over time; the ability to annotate activities on the chart; and custom conditional alerts (e.g. alert when HR stays flat but Entropy rises, to separate physical strain from physiological stress).", "answer": "Website and FAQ updates are planned. A combined Entropy/CBF/HR chart is seen as an advanced-user feature (some find the current charts already dense). Peaks in Brain Flow and troughs in Entropy can already be tagged; a Trends tab for custom correlations is being considered.", "sensitive": "", "notes": "Collapsed block (4 instances): WA-151, WA-154, WA-155, SL-096c"}, {"id": "WA-153", "member": "Vidur", "group": "Vidur", "date": "01/06–01/07", "source": "WhatsApp+Slack", "area": "Adhesion", "subcategory": "Tapes", "classification": "Suggestion", "text": "On the tapes: after changing stickers a few times, matching the device to the sticker isn't a big problem, so the larger stencil sticker's size may outweigh its benefit. Separately, the grip looks worn out after a couple of days, undercutting the premium feel — he suggests a colour change or a Temple logo on the grip.", "answer": "Agreed it's a trade-off we're weighing.", "sensitive": "", "notes": "Collapsed block (2 instances): WA-153, SL-020b"}, {"id": "WA-001", "member": "Aakash", "group": "Aakash", "date": "19/05", "source": "WhatsApp", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Question", "text": "if i drop the device somewhere or misplace it is there a way to track it (like findmy on iphone)", "answer": "Not yet, Aakash. We are building this feature and will launch this soon. Meanwhile, if you ever lose or misplace the device we will send a replacement device for you immediately.", "sensitive": "", "notes": ""}, {"id": "WA-002", "member": "Aakash", "group": "Aakash", "date": "19/05", "source": "WhatsApp", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Suggestion", "text": "it would be cool if at some point bone conduction audio can be added so i can drop my current head phones", "answer": "", "sensitive": "", "notes": ""}, {"id": "WA-003", "member": "Aakash", "group": "Aakash", "date": "19/05", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Device Body", "classification": "Problem", "text": "my kids rejected placement on temple so i am wearing behind my ear", "answer": "Temple will not work for any other location, other than the temple. The physiology of the temporal area is unique.", "sensitive": "", "notes": ""}, {"id": "WA-004", "member": "Ajit", "group": "Ajit", "date": "15/05", "source": "WhatsApp", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Positive", "text": "this app is absolutely beautiful. Beyond words.", "answer": "", "sensitive": "", "notes": ""}, {"id": "WA-005", "member": "Ajit", "group": "Ajit", "date": "17/05", "source": "WhatsApp", "area": "Science Team", "subcategory": "Entropy", "classification": "Question", "text": "Reducing Entropy: I've got a rough idea of when it spikes, but still figuring out what actually brings it down and keeps it low. Do we know what I could try?", "answer": "To get your Entropy down you can try - meditation, cold shower, head down tilt, and even sleeping!", "sensitive": "", "notes": ""}, {"id": "WA-006", "member": "Ajit", "group": "Ajit", "date": "17/05", "source": "WhatsApp", "area": "Science Team", "subcategory": "Recovery Score", "classification": "Question", "text": "Sleep position & recovery: I usually sleep on my tummy, but switched to my side last night and felt noticeably better. Both cognitive and physical recovery were the highest I've hit. What else moves the sleep score?", "answer": "Side sleeping improves glymphatic system at night. To really move the sleep score, try to reduce your entropy and keep it low for 1-2 hrs before sleeping.", "sensitive": "", "notes": ""}, {"id": "WA-007", "member": "Ajit", "group": "Ajit", "date": "17/05", "source": "WhatsApp", "area": "Tech", "subcategory": "UI/UX", "classification": "Problem", "text": "UI overlap bug: When Entropy is just a point or two away from a section boundary, the numbers on the left start overlapping.", "answer": "Noted here!", "sensitive": "", "notes": ""}, {"id": "WA-008", "member": "Ajit", "group": "Ajit", "date": "18/05", "source": "WhatsApp", "area": "Science Team", "subcategory": "Entropy", "classification": "Question", "text": "A bowl of litchis just spiked my entropy. That's possible?", "answer": "Eating does increase entropy. Extent of increase depends on the food item and how it affects your body.", "sensitive": "", "notes": ""}, {"id": "WA-009", "member": "Ajit", "group": "Ajit", "date": "25/05", "source": "WhatsApp", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Positive", "text": "BTW, the new interface looks really good.", "answer": "", "sensitive": "", "notes": ""}, {"id": "WA-010", "member": "Ajit", "group": "Ajit", "date": "26/05", "source": "WhatsApp", "area": "Product Team", "subcategory": "Activity Logging", "classification": "Suggestion", "text": "Are we planning to change this icon to the kind of activity logged?", "answer": "", "sensitive": "", "notes": ""}, {"id": "WA-017", "member": "Akshant", "group": "Akshant", "date": "11/05", "source": "WhatsApp", "area": "Data Science", "subcategory": "Calorie Tracking", "classification": "Question", "text": "I am trying to look for my calories consumed data from yesterday. Where can I find it on the app?", "answer": "You can click on today's calories consumed card and navigate to yesterday using the arrows on top right.", "sensitive": "", "notes": ""}, {"id": "WA-018", "member": "Akshant", "group": "Akshant", "date": "13/05", "source": "WhatsApp", "area": "Science Team", "subcategory": "Recovery Score", "classification": "Question", "text": "I don't get to understand why my recovery is low and what can make it better. All the metrics shown under recovery are good for me - RHR, HRV, Sleep Efficiency, total sleep time etc.", "answer": "There are additional factors which determine recovery, not being reflected on the app currently. We will be live with these by end of the week.", "sensitive": "", "notes": ""}, {"id": "WA-019", "member": "Akshant", "group": "Akshant", "date": "14/05", "source": "WhatsApp", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Problem", "text": "At the top, once I pause the activity, it is not obvious how to end it. That action is buried inside the 3 vertical dots.", "answer": "Kept it intentional to keep the screen clean. One time learning. There's nowhere else to go for ending activity.", "sensitive": "", "notes": ""}, {"id": "WA-020", "member": "Akshant", "group": "Akshant", "date": "14/05", "source": "WhatsApp", "area": "Data Science", "subcategory": "Calorie Tracking", "classification": "Question", "text": "Is our science for calculating active calories burned same as other wearables?", "answer": "No, we also do strength workouts really well. Our strength calories are based on entropy swings. Heart rate doesn't capture strength training intensity.", "sensitive": "", "notes": ""}, {"id": "WA-021", "member": "Akshant", "group": "Akshant", "date": "14/05", "source": "WhatsApp", "area": "Data Science", "subcategory": "Calorie Tracking", "classification": "Problem", "text": "Same input showing 988 kcal today - cortado coffee + 5 overnight soaked almonds. The calories have been inconsistent day to day.", "answer": "Hmm, these are AI goof ups - will see if we can do something about it.", "sensitive": "", "notes": ""}, {"id": "WA-022", "member": "Akshant", "group": "Akshant", "date": "19/05", "source": "WhatsApp", "area": "Science Team", "subcategory": "Entropy", "classification": "Question", "text": "The entropy dial shows a max of 160 but my entropy was 180+ while running today", "answer": "By design - post that, you are overclocking the engine. Not intuitive - can take the dial back to 200.", "sensitive": "", "notes": ""}, {"id": "WA-023", "member": "Akshant", "group": "Akshant", "date": "25/05", "source": "WhatsApp", "area": "Science Team", "subcategory": "Entropy", "classification": "Problem", "text": "Entropy and focus have become very erratic since the new update - generally very high all the time. Focus is also high for large blocks when I am not doing any activity.", "answer": "Let me get to the bottom of this.", "sensitive": "", "notes": ""}, {"id": "WA-024", "member": "Akshant", "group": "Akshant", "date": "26/05", "source": "WhatsApp", "area": "Science Team", "subcategory": "Recovery Score", "classification": "Question", "text": "I had very good sleep in the night. But the entropy was always in stimulated zone. It's paradoxical that sleep summary is saying I had high entropy and great sleep quality.", "answer": "Currently physical recovery factors in HRV, RHR and Deep Sleep duration. Workstream to ingress entropy and BF values in sleep quality is in progress.", "sensitive": "", "notes": ""}, {"id": "WA-025", "member": "Akshant", "group": "Akshant", "date": "28/05", "source": "WhatsApp", "area": "Tech", "subcategory": "Sync & Data", "classification": "Problem", "text": "Not seeing any data in my charts post 11am yesterday. No eating detection also post 2pm. Device ran out of charge during sleep.", "answer": "Getting this checked. Seems like some issue with flash storage - getting your device replaced.", "sensitive": "", "notes": ""}, {"id": "WA-026", "member": "Akshant", "group": "Akshant", "date": "30/05", "source": "WhatsApp", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Suggestion", "text": "I did a 36 hour fast. Zero calories. Would have been cool for the product to pick up that I haven't eaten and bake that into my morning insight card.", "answer": "Very cool! We'll bake this in. Fasting will be great lever for giving commentary in morning insights.", "sensitive": "", "notes": ""}, {"id": "WA-027", "member": "Akshant", "group": "Akshant", "date": "03/06", "source": "WhatsApp", "area": "Tech", "subcategory": "App Crashes", "classification": "Problem", "text": "Possible activity detected message came even though my activity was already on. Needs to be fixed.", "answer": "Should not happen. Will get this fixed. A device reboot happened during your workout causing previous context to be lost. Hotfix releasing tonight.", "sensitive": "", "notes": ""}, {"id": "WA-028", "member": "Akshant", "group": "Akshant", "date": "08/06", "source": "WhatsApp", "area": "Data Science", "subcategory": "Sleep Tracking", "classification": "Question", "text": "What's the basis of sleep quality? I woke up at 4am, sleep quality was 4/10. I slept again till 6am. Both sleep scores went up although there is no deep sleep between 4-6am.", "answer": "Sleep quality depends on duration and Brain Flow factors during Deep and REM stages. When the sleep got updated, we recompute the sleep stages for the entire duration.", "sensitive": "", "notes": ""}, {"id": "WA-029", "member": "Ankush", "group": "Ankush", "date": "23/05", "source": "WhatsApp", "area": "Adhesion", "subcategory": "Skin Issues", "classification": "Problem", "text": "The tape's stickiness strengthens over time. However by day 3 one starts to feel the glue stress on the skin akin to an old band-aid.", "answer": "The skin stress is most likely first-time adaptation. Should ease by your second or third cycle.", "sensitive": "", "notes": ""}, {"id": "WA-030", "member": "Ankush", "group": "Ankush", "date": "23/05", "source": "WhatsApp", "area": "Adhesion", "subcategory": "Skin Issues", "classification": "Problem", "text": "When you take off the tape after 3-4 days, some small dots appear on surface of the skin where it was mounted.", "answer": "On the small dots - were they sticky to the touch when you ran your finger over them, or just visible marks on the skin?", "sensitive": "TRUE", "notes": ""}, {"id": "WA-034", "member": "Ankush", "group": "Ankush", "date": "12/06", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Sensor", "classification": "Suggestion", "text": "Around the sensor, could consider raising the plastic to create a mini boundary wall so that residual glue doesn't slide over onto the sensor.", "answer": "Appreciate the feedback. I've forwarded this to the relevant teams.", "sensitive": "", "notes": ""}, {"id": "WA-036", "member": "Dhruv B", "group": "Dhruv B", "date": "15/06", "source": "WhatsApp", "area": "Product Team", "subcategory": "Activity Logging", "classification": "Question", "text": "Logged in my first workout today - missed the rep and exercise logging on the app itself like Whoop does. Are we planning to build this internally or integrating with any 3p app to log the details?", "answer": "Yes this is something we are absolutely integrating into Temple. We will launch Automated Set Detection soon.", "sensitive": "", "notes": ""}, {"id": "WA-037", "member": "Dr Apoorva", "group": "Dr Apoorva", "date": "16/05", "source": "WhatsApp", "area": "Support", "subcategory": "Onboarding", "classification": "Question", "text": "I asked Dad to use my temple, I changed gender/weight/height in profile and it instantly changed parameters. Not sure if temple can be shared between people.", "answer": "Temple can't be shared between people. It has to be reset before you share it with someone. And the reset functionality hasn't been built yet.", "sensitive": "", "notes": ""}, {"id": "WA-038", "member": "Dr Apoorva", "group": "Dr Apoorva", "date": "16/05", "source": "WhatsApp", "area": "Data Science", "subcategory": "Sleep Tracking", "classification": "Positive", "text": "I tracked my sleep and I am very proud that in morning I saw 99% efficiency! Positive feedback and Good mood to start day!", "answer": "", "sensitive": "", "notes": ""}, {"id": "WA-039", "member": "Dr Apoorva", "group": "Dr Apoorva", "date": "16/05", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Connectivity", "classification": "Question", "text": "Questions from my patients: Where is the manufacturing? Is it made in India? One full charge allows you to wear Temple for how many days? Does the wireless waves and network affect the mind/health?", "answer": "Manufacturing in India. One full charge lasts for 2.5-4 days. There is ZERO radiation towards the body side. Our Bluetooth is a custom made ultra low powered Bluetooth that only emits waves away from the body.", "sensitive": "", "notes": ""}, {"id": "WA-040", "member": "Dr Apoorva", "group": "Dr Apoorva", "date": "16/05", "source": "WhatsApp", "area": "Manufacturing", "subcategory": "Color/Finish", "classification": "Question", "text": "Will there be more color options in future?", "answer": "Three more - Reflective Silver, True Gold, Matte Titanium.", "sensitive": "", "notes": ""}, {"id": "WA-041", "member": "Dr Apoorva", "group": "Dr Apoorva", "date": "16/05", "source": "WhatsApp", "area": "Manufacturing", "subcategory": "Color/Finish", "classification": "Suggestion", "text": "At some point it will be nice if you guys introduce rose gold for women!", "answer": "Yes, working on it. Trying to get the perfect rose gold.", "sensitive": "", "notes": ""}, {"id": "WA-042", "member": "Dr Apoorva", "group": "Dr Apoorva", "date": "19/05", "source": "WhatsApp", "area": "Adhesion", "subcategory": "Skin Issues", "classification": "Question", "text": "My skin had irritation after wearing it for 2 days so I removed it and put it on right side. Is that normal?", "answer": "Skin irritation - yes, can switch sides. Irritation should not happen once you put it on clean skin. Your skin will also get used to it in a week.", "sensitive": "TRUE", "notes": ""}, {"id": "WA-043", "member": "Dr Apoorva", "group": "Dr Apoorva", "date": "19/05", "source": "WhatsApp", "area": "Science Team", "subcategory": "Focus", "classification": "Question", "text": "How do you measure focus? I perform 3 hour long highly precise plastic surgery which needs crazy focus but my focus reading is soft. Is it because my hands, body and legs are moving?", "answer": "Focus is a physiological signal - nothing to do with motion. Next time you do a surgery, please log an activity on Temple as 'surgery' and we will study what happens to your focus at that time.", "sensitive": "", "notes": ""}, {"id": "WA-045", "member": "Dr Apoorva", "group": "Dr Apoorva", "date": "19/05", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Sensor", "classification": "Question", "text": "Is it safe for pregnant females?", "answer": "Yes, fully safe for pregnant females. There's nothing in it which is unsafe in any way.", "sensitive": "", "notes": ""}, {"id": "WA-046", "member": "Dr Apoorva", "group": "Dr Apoorva", "date": "27/05", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Battery", "classification": "Question", "text": "Is it possible that new software updates are draining battery quickly?", "answer": "", "sensitive": "", "notes": ""}, {"id": "WA-047", "member": "Dr Apoorva", "group": "Dr Apoorva", "date": "27/05", "source": "WhatsApp", "area": "Adhesion", "subcategory": "Skin Issues", "classification": "Problem", "text": "My skin feels slightly itchy and I get the urge to take it off and give my skin rest. Removing and putting the adhesive tape on same area is making my skin itchy especially in this hot weather.", "answer": "", "sensitive": "TRUE", "notes": ""}, {"id": "WA-050", "member": "Dr Apoorva", "group": "Dr Apoorva", "date": "15/06", "source": "WhatsApp", "area": "Data Science", "subcategory": "Chewing Detection", "classification": "Problem", "text": "It's showing me eating detected whereas there was no activity. I am sitting in my car on my way home with closed eyes - it says eating detected. This is the third time since morning.", "answer": "We are working on a personalized chewing detection pattern that would have removed most of the false detections today.", "sensitive": "", "notes": ""}, {"id": "WA-052", "member": "Mayur", "group": "Mayur", "date": "26/05", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Charger", "classification": "Question", "text": "I don't know what the different colours of lights mean on the charger. Does this mean it's charging?", "answer": "The device because of old firmware of the charger had gone into ship mode. The device should start working once it's charged.", "sensitive": "", "notes": ""}, {"id": "WA-053", "member": "Mayur", "group": "Mayur", "date": "27/05", "source": "WhatsApp", "area": "Data Science", "subcategory": "Calorie Tracking", "classification": "Suggestion", "text": "What if we map the macros for all the Bistro menu items? Then we will get very accurate calorie counts and analysis when we log Bistro food.", "answer": "Yes, that's under consideration, even Zomato listed restaurants.", "sensitive": "", "notes": ""}, {"id": "WA-059", "member": "Mohit", "group": "Mohit", "date": "16/05", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Device Body", "classification": "Positive", "text": "You forget you are wearing it. Love the fact it's completely waterproof.", "answer": "", "sensitive": "", "notes": ""}, {"id": "WA-059b", "member": "Mohit", "group": "Mohit", "date": "16/05", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Battery", "classification": "Negative", "text": "Battery life is 3 days — wish it was 7 days.", "answer": "", "sensitive": "", "notes": ""}, {"id": "WA-060", "member": "Mohit", "group": "Mohit", "date": "16/05", "source": "WhatsApp", "area": "Data Science", "subcategory": "Chewing Detection", "classification": "Problem", "text": "The eating detections fire multiple times in the same meal - for the same meal it should detect once.", "answer": "They are spaced at 30 mins right now. Sometimes slow multi-course meals get multiple notifications.", "sensitive": "", "notes": ""}, {"id": "WA-061", "member": "Mohit", "group": "Mohit", "date": "16/05", "source": "WhatsApp", "area": "Data Science", "subcategory": "Auto Workout", "classification": "Question", "text": "I would like to see it impact my workouts more. Given I train with an online coach I cannot view the app while working out. I don't have a post workout synopsis. It does not auto-detect workouts?", "answer": "Auto detect workout feature is yet to go live. But start an activity before starting to work out.", "sensitive": "", "notes": ""}, {"id": "WA-062", "member": "Mohit", "group": "Mohit", "date": "19/05", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Heating", "classification": "Problem", "text": "Charged my Temple device and put it back on. After 30-45 min the device had become hot and ended up burning my skin.", "answer": "Sorry about this, Mohit. First time I am hearing this - will get to the bottom of this. There seems to be physical damage to the device from inside. Failsafes have been implemented.", "sensitive": "TRUE", "notes": ""}, {"id": "WA-063", "member": "Mohit", "group": "Mohit", "date": "31/05", "source": "WhatsApp", "area": "Support", "subcategory": "Device Replacement", "classification": "Problem", "text": "Lost Temple - my device fell off somewhere between waking up and the golf course.", "answer": "No worries at all. Will get replacement done immediately.", "sensitive": "", "notes": ""}, {"id": "WA-064", "member": "Mohit", "group": "Mohit", "date": "02/06", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Connectivity", "classification": "Problem", "text": "Received replacement device. Unfortunately not connecting. Had to unlink the old device manually and then it connected.", "answer": "You shouldn't have to unlink the old device manually to be able to connect a new one - this is on us to handle cleanly.", "sensitive": "", "notes": ""}, {"id": "WA-065", "member": "Niharika", "group": "Niharika", "date": "16/06", "source": "WhatsApp", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Question", "text": "Is there a way to log fever or general symptoms on the app?", "answer": "You can log fever and symptoms using the 'Journal' feature, which can be accessed by the + Activity button on the bottom right side of the Home Screen.", "sensitive": "", "notes": ""}, {"id": "WA-066", "member": "Niharika", "group": "Niharika", "date": "16/06", "source": "WhatsApp", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Suggestion", "text": "I sometimes forget to put the device back on after a shower. Is there a way to enable a more prominent reminder or stronger vibration?", "answer": "Feedback noted on the notification. Currently we prompt once the device is completely charged. Will keep you posted on updates.", "sensitive": "", "notes": ""}, {"id": "WA-067", "member": "Niharika", "group": "Niharika", "date": "16/06", "source": "WhatsApp", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Question", "text": "Is there a Find My Temple feature or another way to locate it if I misplace it?", "answer": "Find My Temple is now live on version v1.1.0.", "sensitive": "", "notes": ""}, {"id": "WA-068", "member": "Niharika", "group": "Niharika", "date": "16/06", "source": "WhatsApp", "area": "Data Science", "subcategory": "Chewing Detection", "classification": "Problem", "text": "The eating detection trigger usually comes in very late, often towards the end of my meal. Is there a setting I should adjust?", "answer": "Thank you for your inputs regarding chewing detection - this is being worked on by the team.", "sensitive": "", "notes": ""}, {"id": "WA-070", "member": "Prerna", "group": "Prerna", "date": "11/06", "source": "WhatsApp", "area": "Data Science", "subcategory": "GPS/Distance", "classification": "Problem", "text": "If I record an outdoor running, it doesn't show the distance covered.", "answer": "We're shipping this soon. Will have GPS integration with phone.", "sensitive": "", "notes": ""}, {"id": "WA-071", "member": "Pulkit", "group": "Pulkit", "date": "11/06", "source": "WhatsApp", "area": "Manufacturing", "subcategory": "Packaging", "classification": "Suggestion", "text": "The paper bag had a golden temple outside. The temple box is silver. We should keep this consistent with the device colour.", "answer": "Will happen.", "sensitive": "", "notes": ""}, {"id": "WA-072", "member": "Pulkit", "group": "Pulkit", "date": "13/06", "source": "WhatsApp", "area": "Data Science", "subcategory": "Calorie Tracking", "classification": "Problem", "text": "While playing Padel today for njoo", "date": "25/05", "source": "WhatsApp", "area": "Science Team", "subcategory": "Entropy", "classification": "Positive", "text": "Entropy was lower on Friday and kept going up since Friday evening which coincided with illness.", "answer": "Entropy picks up illness. In fact, it starts picking up a day before illness really becomes symptomatic.", "sensitive": "", "notes": ""}, {"id": "WA-078", "member": "Rahul Ganjoo", "group": "Rahul Ganjoo", "date": "02/06", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Charger", "classification": "Problem", "text": "Unable to close the charging case.", "answer": "This is likely due to the holding magnet coming out. We are sending a replacement here.", "sensitive": "", "notes": ""}, {"id": "WA-079", "member": "Rahul Ganjoo", "group": "Rahul Ganjoo", "date": "14/06", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Charger", "classification": "Question", "text": "No blinking light on the case for charging indication.", "answer": "This is intentional. When you put the device on charge, the small LED will breathe 4 times and then stop.", "sensitive": "", "notes": ""}, {"id": "WA-080", "member": "Ragini", "group": "Ragini", "date": "13/05", "source": "WhatsApp", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Problem", "text": "When I skip adding my meal input from the previous day and eat today, then my last evening's enter food notification doesn't show - only today's does.", "answer": "To check your missed food logs, you can scroll down to the previous days on the home page itself.", "sensitive": "", "notes": ""}, {"id": "WA-081", "member": "Ragini", "group": "Ragini", "date": "15/05", "source": "WhatsApp", "area": "Data Science", "subcategory": "Chewing Detection", "classification": "Question", "text": "My favourite feature is the eating detection. However it doesn't detect drinking. By design?", "answer": "Haven't been able to detect drinking so far. It's part of our list of things to solve.", "sensitive": "", "notes": ""}, {"id": "WA-082", "member": "Ragini", "group": "Ragini", "date": "25/05", "source": "WhatsApp", "area": "Adhesion", "subcategory": "Skin Issues", "classification": "Negative", "text": "I feel like temperature is an important metric we're missing. I wish the battery lasted a little longer. I have extremely sensitive skin so removing the tape is leaving a slight mark. Data sync takes about a minute sometimes.", "answer": "", "sensitive": "TRUE", "notes": ""}, {"id": "WA-085", "member": "Ragini", "group": "Ragini", "date": "02/06", "source": "WhatsApp", "area": "Tech", "subcategory": "Notifications", "classification": "Problem", "text": "When my temple has fully charged and I don't immediately wear it back, I get a push notification every 5 minutes. Is that by design?", "answer": "Not at all. Getting this looked into.", "sensitive": "", "notes": ""}, {"id": "WA-086", "member": "Ragini", "group": "Ragini", "date": "14/05", "source": "WhatsApp", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Suggestion", "text": "Suggestion - if my Bluetooth is off, maybe I should get a push notification similar to what I get when I close the app.", "answer": "Noted.", "sensitive": "", "notes": ""}, {"id": "WA-087", "member": "Sandeep", "group": "Sandeep", "date": "16/05", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Device Body", "classification": "Negative", "text": "My wife feels it would be ideal if the device could be concealed within the hair. She's not a big fan of how the temple placement looks.", "answer": "", "sensitive": "", "notes": ""}, {"id": "WA-088", "member": "Sandeep", "group": "Sandeep", "date": "16/05", "source": "WhatsApp", "area": "Support", "subcategory": "Onboarding", "classification": "Suggestion", "text": "Will also be nice to get a quick tutorial on how to understand the metrics and why they matter.", "answer": "In person will be best. Temple has a bit of a learning curve, best done over zoom.", "sensitive": "", "notes": ""}, {"id": "WA-089", "member": "Sandeep", "group": "Sandeep", "date": "16/05", "source": "WhatsApp", "area": "Data Science", "subcategory": "Auto Workout", "classification": "Problem", "text": "Whoop auto captured my workout. Temple recorded the elevated HR but couldn't auto capture.", "answer": "Our auto activity detection is going live this upcoming week.", "sensitive": "", "notes": ""}, {"id": "WA-090", "member": "Sandeep", "group": "Sandeep", "date": "16/05", "source": "WhatsApp", "area": "Tech", "subcategory": "Android Bugs", "classification": "Problem", "text": "UI not optimised for the resolution of my One Plus 13s.", "answer": "", "sensitive": "", "notes": ""}, {"id": "WA-091", "member": "Sandeep", "group": "Sandeep", "date": "17/05", "source": "WhatsApp", "area": "Tech", "subcategory": "Android Bugs", "classification": "Problem", "text": "Sleep is captured but weirdly not showing up on the Bio monitor dashboard. Seems to be a bug on Android.", "answer": "Noted Sandeep. Will have this fixed in the next 2-3 days.", "sensitive": "", "notes": ""}, {"id": "WA-092", "member": "Sandeep", "group": "Sandeep", "date": "20/05", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Connectivity", "classification": "Problem", "text": "My Temple disconnected in the morning and is not reconnecting. Had 12% charge.", "answer": "It worked once I restarted my phone Bluetooth.", "sensitive": "", "notes": ""}, {"id": "WA-093", "member": "Sandeep", "group": "Sandeep", "date": "05/06", "source": "WhatsApp", "area": "Adhesion", "subcategory": "Tapes", "classification": "Suggestion", "text": "The comfort tape tends to start falling off around the 4th day. The bigger issue is I didn't realise the device had actually fallen off. Is there a way to notify the user when this happens?", "answer": "Shipping something soon for situations like this.", "sensitive": "", "notes": ""}, {"id": "WA-094", "member": "Sandeep", "group": "Sandeep", "date": "13/06", "source": "WhatsApp", "area": "Data Science", "subcategory": "Sleep Tracking", "classification": "Positive", "text": "Had super broken sleep last night. My Whoop gave me a crazy high recovery score. Temple was much closer to how I was actually feeling.", "answer": "", "sensitive": "", "notes": ""}, {"id": "WA-095", "member": "Sanjeev", "group": "Sanjeev", "date": "13/06", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Charger", "classification": "Question", "text": "I am charging my Temple into my laptop. How long do I need to charge it for?", "answer": "Around 1h15m should be fine. You will get a notification on your app when it charges completely.", "sensitive": "", "notes": ""}, {"id": "WA-096", "member": "Shagun", "group": "Shagun", "date": "16/06", "source": "WhatsApp", "area": "Data Science", "subcategory": "Chewing Detection", "classification": "Question", "text": "My Temple app isn't detecting any fluids I'm consuming - smoothies, protein shakes etc. Ideally I'd like these to be included in my calorie count. Is there a setting I need to adjust?", "answer": "We do not currently detect fluid intake. Just chewing-related activities.", "sensitive": "", "notes": ""}, {"id": "WA-097", "member": "Shivam", "group": "Shivam", "date": "14/05", "source": "WhatsApp", "area": "Manufacturing", "subcategory": "Packaging", "classification": "Negative", "text": "The packaging feels a little busy with the stickers, and I think simplifying that will go a long way in making the unboxing feel more premium. The device casing itself also has some room to feel a little more refined.", "answer": "", "sensitive": "", "notes": ""}, {"id": "WA-098", "member": "Shivam", "group": "Shivam", "date": "16/05", "source": "WhatsApp", "area": "Data Science", "subcategory": "Chewing Detection", "classification": "Problem", "text": "It's difficult to eat chewing gum with the device - it keeps on detecting it as a meal time.", "answer": "Can you tag it as 'not eating' and then 'chewing gum'. With enough data we can crack anything.", "sensitive": "", "notes": ""}, {"id": "WA-099", "member": "Adit", "group": "Adit", "date": "17/06", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Device Body", "classification": "Negative", "text": "All good so far, just that I wear eye glasses, each time I adjust them even a bit, it does clink with temple device.", "answer": "The metrics/readings normally don't get affected by contact with reading glasses.", "sensitive": "", "notes": ""}, {"id": "WA-100", "member": "Adit", "group": "Adit", "date": "17/06", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Device Body", "classification": "Negative", "text": "No discomfort, but I become aware of the device each time. A Whoop or a ring is something that becomes invisible to me.", "answer": "", "sensitive": "", "notes": ""}, {"id": "WA-101", "member": "Avi & Rob", "group": "Avi & Rob", "date": "03/06", "source": "WhatsApp", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Positive", "text": "Rob: So far I really love the interface. I must say it has a very techy aesthetic.", "answer": "", "sensitive": "", "notes": ""}, {"id": "WA-102", "member": "Avi & Rob", "group": "Avi & Rob", "date": "03/06", "source": "WhatsApp", "area": "Data Science", "subcategory": "Sleep Tracking", "classification": "Problem", "text": "Rob: Temple hasn't yet learned my sleep pattern and missed 5 hours of my night. Is there a way to nudge the software into looking at a longer period of time?", "answer": "Releasing Edit Sleep Time feature by Friday to get real time customer feedback on sleep.", "sensitive": "", "notes": ""}, {"id": "WA-103", "member": "Avi & Rob", "group": "Avi & Rob", "date": "04/06", "source": "WhatsApp", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Suggestion", "text": "Avi: I'm very happy to link/sync my Apple Health data with Temple.", "answer": "You can share Apple Health data from within the Temple app. Menu -> Integrations -> Apple Health.", "sensitive": "", "notes": ""}, {"id": "WA-104", "member": "Avi & Rob", "group": "Avi & Rob", "date": "04/06", "source": "WhatsApp", "area": "Data Science", "subcategory": "Sleep Tracking", "classification": "Positive", "text": "Rob: The most important thing is it didn't flag my single 10 minute awakening as the end of my sleep. Also interesting watching my entropy cluing me in to stress that I don't recognize independently.", "answer": "", "sensitive": "", "notes": ""}, {"id": "WA-105", "member": "Avi & Rob", "group": "Avi & Rob", "date": "05/06", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Charger", "classification": "Problem", "text": "Rob: I think we have a charging issue. I tried charging the temple yesterday afternoon and it came out of the charger lower than when I put it in. When I plug the charger in it flashes white a few times.", "answer": "Sending a replacement right away as we figure this out.", "sensitive": "", "notes": ""}, {"id": "WA-106", "member": "Avi & Rob", "group": "Avi & Rob", "date": "12/06", "source": "WhatsApp", "area": "Data Science", "subcategory": "Calorie Tracking", "classification": "Problem", "text": "Rob: I am still finding that it's underestimating my calories by 40% or more on hard workouts. I'd love to work with the team to unpack this.", "answer": "We're working on improving the calories logic which should make the hard workout calories far more relatable.", "sensitive": "", "notes": ""}, {"id": "WA-107", "member": "Himanshu", "group": "Himanshu", "date": "17/06", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Connectivity", "classification": "Problem", "text": "Getting disconnected for brief moments.", "answer": "Got it. Let me check with the team and get back to you.", "sensitive": "", "notes": ""}, {"id": "WA-108", "member": "Joel & Joy", "group": "Joel & Joy", "date": "14/06", "source": "WhatsApp", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Question", "text": "This morning it gave me an outlook summary of my sleep but wanted to know more. How do I ask the device for an evening winddown routine or breath work like we do on Whoop?", "answer": "We have an evening wind down feature in the works. You will be able to see your pre sleep Entropy and ways to optimise it.", "sensitive": "", "notes": ""}, {"id": "WA-109", "member": "Joel & Joy", "group": "Joel & Joy", "date": "14/06", "source": "WhatsApp", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Suggestion", "text": "Majorly for me in Whoop I just ask the chat bot. Would be great to have that on Temple.", "answer": "We're soon building a chat bot on the app to serve this and other needs.", "sensitive": "", "notes": ""}, {"id": "WA-111", "member": "Kees", "group": "Kees", "date": "29/05", "source": "WhatsApp", "area": "Science Team", "subcategory": "Entropy", "classification": "Question", "text": "During workout (recovery run at 125 bpm), I am hitting entropy of around 190 - so off the scale of 120?", "answer": "The actual range for Entropy is 1-200. We only show up to 120 on the scale. 120+ is almost always achieved in workouts. We will change the range of the Entropy dial to 1-200 on the home page.", "sensitive": "", "notes": ""}, {"id": "WA-112", "member": "Kees", "group": "Kees", "date": "30/05", "source": "WhatsApp", "area": "Science Team", "subcategory": "Entropy", "classification": "Negative", "text": "Between the Garmin and Oura it is just not enough new insight for me.", "answer": "", "sensitive": "", "notes": ""}, {"id": "WA-113", "member": "Kunal Khambhati", "group": "Kunal Khambhati", "date": "23/05", "source": "WhatsApp", "area": "Manufacturing", "subcategory": "Packaging", "classification": "Negative", "text": "Packaging for early access/beta mode - brown box was underwhelming even for early access. Metal case and device felt really good in the hand.", "answer": "", "sensitive": "", "notes": ""}, {"id": "WA-114", "member": "Kunal Khambhati", "group": "Kunal Khambhati", "date": "23/05", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Device Body", "classification": "Negative", "text": "Not a fan of bringing attention to myself with the device on my face.", "answer": "", "sensitive": "", "notes": ""}, {"id": "WA-115", "member": "Kunal Khambhati", "group": "Kunal Khambhati", "date": "04/06", "source": "WhatsApp", "area": "Data Science", "subcategory": "Sleep Tracking", "classification": "Positive", "text": "Temple has been a game changer. Keeps me calm with the kids, tracking food is fab, period tracking is killer, sleep patterns are accurately recorded. Only question is the other day did not track my 40 min nap.", "answer": "Amazing to see it's making a change! We are adding auto nap detections and that should be live soon.", "sensitive": "", "notes": ""}, {"id": "WA-116", "member": "Kunal Khambhati", "group": "Kunal Khambhati", "date": "17/06", "source": "WhatsApp", "area": "Adhesion", "subcategory": "Tapes", "classification": "Problem", "text": "Payal was complaining about the temple tape coming off last few days during morning run.", "answer": "Around less than 10% people are facing issues with tapes. Root cause is either not wiping the temple region before wearing, or not pressing the device for 4-5 seconds. Most cases getting solved by correct application.", "sensitive": "", "notes": ""}, {"id": "WA-117", "member": "Kunal Khambhati", "group": "Kunal Khambhati", "date": "18/06", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Device Body", "classification": "Problem", "text": "Product issue - device cannot be used anymore.", "answer": "We will ship a replacement today.", "sensitive": "", "notes": ""}, {"id": "WA-118", "member": "Merani", "group": "Merani", "date": "10/06", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Connectivity", "classification": "Question", "text": "If the phone is not nearby, how long can the temple store data?", "answer": "More than a full day, around 33-36 hours of data.", "sensitive": "", "notes": ""}, {"id": "WA-119", "member": "Merani", "group": "Merani", "date": "15/06", "source": "WhatsApp", "area": "Science Team", "subcategory": "Entropy", "classification": "Question", "text": "My entropy changes a lot while having a cold shower. But doesn't change as much during meditation. But the focus changes a lot during meditation but not much during the shower.", "answer": "", "sensitive": "", "notes": ""}, {"id": "WA-120", "member": "Merani", "group": "Merani", "date": "15/06", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Device Body", "classification": "Negative", "text": "The biggest problem with the device is that you have to explain to each person you meet. Infact strangers come up to me and start conversations just to know what I'm wearing.", "answer": "", "sensitive": "", "notes": ""}, {"id": "WA-121", "member": "Nicco", "group": "Nicco", "date": "30/05", "source": "WhatsApp", "area": "Science Team", "subcategory": "Entropy", "classification": "Question", "text": "Entropy in the night was low as 3 but up and down.", "answer": "Looks related to your sleep cycles, Deep and REM.", "sensitive": "", "notes": ""}, {"id": "WA-124", "member": "Rishabh Pant", "group": "Rishabh Pant", "date": "08/06", "source": "WhatsApp", "area": "Support", "subcategory": "Logistics", "classification": "Problem", "text": "The permissions at the hotel have been a menace and same with getting time during the game. Would it be possible to arrange for someone to visit Rishabh for the onboarding at his Delhi house?", "answer": "Yes that can be done.", "sensitive": "", "notes": ""}, {"id": "WA-125", "member": "Sagar & Sahil", "group": "Sagar & Sahil", "date": "28/05", "source": "WhatsApp", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Suggestion", "text": "I find myself opening the app so frequently, wish there was a widget!", "answer": "It's in the works! Having a quick way to add to timeline directly from widget would be helpful, directly from widget - food, record activity, less taps.", "sensitive": "", "notes": ""}, {"id": "WA-126", "member": "Sagar & Sahil", "group": "Sagar & Sahil", "date": "03/06", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Device Body", "classification": "Positive", "text": "Sahil: This is very interesting biosignal. I can see why you're so passionate about it. I forget I'm even wearing it.", "answer": "", "sensitive": "", "notes": ""}, {"id": "WA-127", "member": "Sagar & Sahil", "group": "Sagar & Sahil", "date": "10/06", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Connectivity", "classification": "Problem", "text": "Sagar: Device no longer connecting to app. No light on the temple device at all. Tried forget device in Bluetooth setting. Still not able to find device.", "answer": "The charger seems fine. Try placing the device again on the charger. The dot will light up white if the device gets power.", "sensitive": "", "notes": ""}, {"id": "WA-128", "member": "Sagar & Sahil", "group": "Sagar & Sahil", "date": "11/06", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Charger", "classification": "Problem", "text": "Sagar: Unfortunately no response from Sahil's charger either. Likely the device isn't picking up charge.", "answer": "Lets send two new devices; one for backup.", "sensitive": "", "notes": ""}, {"id": "WA-129", "member": "Sagar & Sahil", "group": "Sagar & Sahil", "date": "13/06", "source": "WhatsApp", "area": "Science Team", "subcategory": "Brain Flow", "classification": "Question", "text": "Sahil: What's the sampling rate of data? Why does this have to be a PPG signal measure over the Temple region versus a PPG signal from anywhere else?", "answer": "Sampling rate is continuous, 30 second windows for Entropy analysis. Temple region stays at core body temperature, vasodilation of Temporal Artery is an indicator of homeostasis effort, trigeminal nerves surround the arteries here - impossible to get this signal from any other body part.", "sensitive": "", "notes": ""}, {"id": "WA-130", "member": "Sahil", "group": "Sahil", "date": "10/06", "source": "WhatsApp", "area": "Adhesion", "subcategory": "Tapes", "classification": "Problem", "text": "I use wax - so it's the sweat and wax causing the tape to not stick, I guess.", "answer": "Takes everyone about two days to find the right rhythm.", "sensitive": "", "notes": ""}, {"id": "WA-131", "member": "Sumeet", "group": "Sumeet", "date": "25/05", "source": "WhatsApp", "area": "Adhesion", "subcategory": "Tapes", "classification": "Problem", "text": "2 days done. Two issues: 1) tape worn out in 2 days the device came off 2) is there a way to log in quantity when you log food like portion size?", "answer": "You can type the qty in natural language while logging and app will pick it up correctly.", "sensitive": "", "notes": ""}, {"id": "WA-132", "member": "Sumeet", "group": "Sumeet", "date": "04/06", "source": "WhatsApp", "area": "Support", "subcategory": "Device Replacement", "classification": "Problem", "text": "Guys terrible news my temple just fell off somewhere in Singapore.", "answer": "No worries at all. We will ship a replacement to you right away.", "sensitive": "", "notes": ""}, {"id": "WA-133", "member": "Sumeet", "group": "Sumeet", "date": "04/06", "source": "WhatsApp", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Suggestion", "text": "Maybe a notification which says it's off-body within a min or something as I got the off-body notification like 10 mins after losing it.", "answer": "", "sensitive": "", "notes": ""}, {"id": "WA-134", "member": "Sumeet", "group": "Sumeet", "date": "16/06", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Device Body", "classification": "Positive", "text": "Am loving the equipment and the attention with it.", "answer": "", "sensitive": "", "notes": ""}, {"id": "WA-135", "member": "Sumeet", "group": "Sumeet", "date": "16/06", "source": "WhatsApp", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Suggestion", "text": "Add Strava please!", "answer": "It's on the way. We are starting to build important integrations.", "sensitive": "", "notes": ""}, {"id": "WA-136", "member": "Tanmay", "group": "Tanmay", "date": "11/06", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Charger", "classification": "Problem", "text": "Charger pod might not be charging the Temple without a cable plugged into it.", "answer": "We think your pod might not be charging your Temple without a cable being plugged into it. Just want to confirm that.", "sensitive": "", "notes": ""}, {"id": "WA-137", "member": "Vatsal", "group": "Vatsal", "date": "20/05", "source": "WhatsApp", "area": "Tech", "subcategory": "Sync & Data", "classification": "Problem", "text": "Temple lens loaded in the morning - I read it partially but then it vanished somehow - can't find it anymore.", "answer": "It disappears when sleep offset gets revised. Should be back soon.", "sensitive": "", "notes": ""}, {"id": "WA-138", "member": "Vatsal", "group": "Vatsal", "date": "20/05", "source": "WhatsApp", "area": "Tech", "subcategory": "Sync & Data", "classification": "Problem", "text": "Live data and the graph data aren't matching.", "answer": "We plot charts on 5 min intervals. So last data point you see is the last multiple of 5. Need to capture this better in the UI.", "sensitive": "", "notes": ""}, {"id": "WA-139", "member": "Vatsal", "group": "Vatsal", "date": "21/05", "source": "WhatsApp", "area": "Tech", "subcategory": "Sync & Data", "classification": "Problem", "text": "Data not loading for some reason. Tried foreground background etc. Nah no sleep data.", "answer": "On my todo - will get back soon. Sleep should be visible now.", "sensitive": "", "notes": ""}, {"id": "WA-140", "member": "Vatsal", "group": "Vatsal", "date": "21/05", "source": "WhatsApp", "area": "Tech", "subcategory": "UI/UX", "classification": "Problem", "text": "Aaaah since there is not much data today, with minor scroll also haptic is triggering. Felt like something is broken.", "answer": "On app haptic is when you move from today to yesterday on the timeline. Got it.", "sensitive": "", "notes": ""}, {"id": "WA-141", "member": "Vatsal", "group": "Vatsal", "date": "21/05", "source": "WhatsApp", "area": "Product Team", "subcategory": "Feature Requests", "classification": "Suggestion", "text": "Do a notification when the computation is done and on app open it fetches the data again.", "answer": "", "sensitive": "", "notes": ""}, {"id": "WA-142", "member": "Vatsal", "group": "Vatsal", "date": "21/05", "source": "WhatsApp", "area": "Data Science", "subcategory": "Accuracy", "classification": "Problem", "text": "Maybe night time twists and turns are computed as steps - not sure.", "answer": "", "sensitive": "", "notes": ""}, {"id": "WA-143", "member": "Vatsal", "group": "Vatsal", "date": "21/05", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Sensor", "classification": "Question", "text": "Can I wear it in sauna? It'll be at 70 degrees.", "answer": "Sauna is fine. Max temple temp reached is 45ish at 70 degrees. Temple area is at core body temperature so there's a cooling effect on the device.", "sensitive": "", "notes": ""}, {"id": "WA-144", "member": "Vatsal", "group": "Vatsal", "date": "21/05", "source": "WhatsApp", "area": "Hardware/Firmware", "subcategory": "Sensor", "classification": "Question", "text": "Do you have a temperature sensor on it?", "answer": "We use IMU temp sensor. Didn't have space for a dedicated temp sensor. Next version for sure.", "sensitive": "", "notes": ""}, {"id": "WA-145", "member": "Vatsal", "group": "Vatsal", "date": "
